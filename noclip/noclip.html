<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ノークリップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 「降下記録」「空欄」と同じ組み立て（状態行・文章・命令を作る・十字キー）。
   色はレベルごとに変わる。それ以外の明暗の切り替えはしない。 */
:root {
  --screen: #15130a; --wall: #e0cd7a; --bright: #fff3b8; --dim: #8f8250; --faint: #3f3a22; --key: #1d1b10;
  --bar-bg: #e0cd7a; --bar-fg: #15130a; --warn: #e88a6a; --hot: #8a1f10;
  --dot: "DotGothic16", "Noto Sans Mono CJK JP", "Osaka-Mono", ui-monospace, monospace;
  --size: 17px; --line: 1.65;
  color-scheme: dark;
}
body.t1 { --screen: #111315; --wall: #b9c1c6; --bright: #eef2f4; --dim: #6d777d; --faint: #2a3034; --key: #171b1e; --bar-bg: #b9c1c6; --bar-fg: #111315; --warn: #e3a07a; --hot: #8a1f10; }
body.t2 { --screen: #140c08; --wall: #d49a68; --bright: #ffd2a8; --dim: #8a5d3c; --faint: #3a2618; --key: #1c120c; --bar-bg: #d49a68; --bar-fg: #140c08; --warn: #ff7a5a; --hot: #7a1a08; }
body.t3 { --screen: #160a09; --wall: #d9a49a; --bright: #ffe0d8; --dim: #8e5e56; --faint: #3c2320; --key: #1e0f0e; --bar-bg: #d9a49a; --bar-fg: #160a09; --warn: #ff8f6e; --hot: #7a1a08; }
body.t4 { --screen: #e9e7e0; --wall: #31363a; --bright: #0b0d0f; --dim: #727a80; --faint: #c4c2ba; --key: #dcdad2; --bar-bg: #31363a; --bar-fg: #e9e7e0; --warn: #9b2d1f; --hot: #ff9a8a; color-scheme: light; }
body.t5 { --screen: #13070a; --wall: #d8b67a; --bright: #fbe6b8; --dim: #8b6a44; --faint: #3b1e22; --key: #1c0b0f; --bar-bg: #6b1c26; --bar-fg: #fbe6b8; --warn: #ff8f7a; --hot: #ffd27a; }
body.t6 { --screen: #000000; --wall: #7a7a7a; --bright: #b5b5b5; --dim: #4a4a4a; --faint: #1c1c1c; --key: #080808; --bar-bg: #1c1c1c; --bar-fg: #7a7a7a; --warn: #b07070; --hot: #ff7a7a; }
body.t7 { --screen: #040c15; --wall: #8fb4ca; --bright: #d6ecf8; --dim: #4f6f84; --faint: #16283a; --key: #07131f; --bar-bg: #23445c; --bar-fg: #d6ecf8; --warn: #e3a07a; --hot: #ffb08a; }
body.t37 { --screen: #ecf5f4; --wall: #2c5c64; --bright: #0e2f35; --dim: #7da0a5; --faint: #c6dedd; --key: #dfeeed; --bar-bg: #9ccfd0; --bar-fg: #0e2f35; --warn: #9b4a3a; --hot: #8a1f10; color-scheme: light; }
body.tfun { --screen: #fff1f6; --wall: #8a2c5a; --bright: #4a0f2c; --dim: #c07a9c; --faint: #f3cfe0; --key: #ffe4ef; --bar-bg: #ffd84a; --bar-fg: #4a0f2c; --warn: #d0204a; --hot: #d0204a; color-scheme: light; }
body.trun { --screen: #1a0000; --wall: #ff9a8a; --bright: #ffe0da; --dim: #a04a40; --faint: #4a0e0a; --key: #240302; --bar-bg: #c81e14; --bar-fg: #ffe0da; --warn: #ffd27a; --hot: #ffd27a; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--screen); color: var(--wall);
  font-family: var(--dot); font-size: var(--size); line-height: var(--line);
  transition: background-color 0.8s, color 0.8s;
}
#app { height: 100%; display: flex; flex-direction: column; }
#bar { display: flex; align-items: baseline; gap: 0.8em; background: var(--bar-bg); color: var(--bar-fg); padding: 0.15em 16px; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  #bar.flicker { animation: flicker 0.6s steps(2, end) 1; }
  @keyframes flicker { 0% { opacity: 1; } 30% { opacity: 0.35; } 45% { opacity: 1; } 60% { opacity: 0.6; } 100% { opacity: 1; } }
  .row.fresh { animation: hum 0.25s steps(3, end); }
  @keyframes hum { from { opacity: 0.2; } to { opacity: 1; } }
  body.trun #bar { animation: alarm 0.9s steps(2, end) infinite; }
  @keyframes alarm { 50% { opacity: 0.55; } }
}
#room { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#room .lv { font-size: 0.78em; margin-left: 0.6em; opacity: 0.75; }
#score { font-variant-numeric: tabular-nums; font-size: 0.9em; }
#score .low { color: var(--hot); }
#menu-btn { font: inherit; background: none; border: 0; color: var(--bar-fg); padding: 0 0.2em; cursor: pointer; }
#menu-btn:focus-visible { outline: 2px solid var(--bar-fg); }
#screen { flex: 1; min-height: 0; overflow-y: auto; padding-inline: 16px; padding-block: 1.1em 0.6em; overscroll-behavior: contain; }
#log { max-width: 46em; display: flex; flex-direction: column; }
.row { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.row.title { color: var(--bright); }
.row.indent { padding-left: 1.5em; }
.row.note { color: var(--dim); font-size: 0.86em; }
.row.warn { color: var(--warn); }
.row.win { color: var(--bright); }
.row.voice { color: var(--bright); padding-left: 1em; }
.row.doc { color: var(--bright); padding-left: 0.8em; border-left: 2px solid var(--faint); }
.gap { height: calc(var(--size) * 0.7); }
.cmd { color: var(--bright); margin-top: 0.4em; }
.cmd .sent { color: var(--dim); font-size: 0.86em; margin-left: 0.8em; }
#dock { border-top: 1px solid var(--faint); padding-block: 0.5em calc(0.6em + env(safe-area-inset-bottom, 0px)); }
#prompt { display: flex; align-items: center; gap: 0.5em; padding-inline: 16px; }
#prompt .gt { color: var(--bright); }
#cmd { flex: 1; min-width: 0; font: inherit; font-size: max(16px, 1em); background: transparent; color: var(--bright); border: 0; outline: 0; caret-color: var(--bright); padding: 0.2em 0; }
#cmd::placeholder { color: var(--faint); }
#send, #build-btn { flex: none; font: inherit; font-size: 0.9em; background: var(--wall); color: var(--screen); border: 0; padding: 0.35em 0.7em; cursor: pointer; }
#send:focus-visible, #build-btn:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
#pad { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0.7em; padding-inline: 16px; padding-top: 0.6em; }
#compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
#common { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; align-content: start; }
.pk { font: inherit; font-size: 0.9em; line-height: 1.2; min-height: 2.4em; background: transparent; color: var(--wall); border: 1px solid var(--faint); padding: 0.3em 0.1em; cursor: pointer; white-space: nowrap; }
.pk.dir { background: var(--key); color: var(--dim); }
.pk.dir.open { color: var(--bright); border-color: var(--dim); }
.pk.look { border-color: var(--wall); color: var(--bright); }
.pk.blank { visibility: hidden; }
.pk:active { background: var(--wall); color: var(--screen); }
.pk:focus-visible { outline: 1px solid var(--bright); }
.pk.updown { font-size: 0.82em; }
body.typing #pad { display: none; }
.key { font: inherit; font-size: 0.9em; line-height: 1.2; background: transparent; color: var(--wall); border: 1px solid var(--faint); padding: 0.35em 0.7em; cursor: pointer; }
.key:active { background: var(--wall); color: var(--screen); }
.key:focus-visible { outline: 1px solid var(--bright); }
#builder, #sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: flex-end; }
.panel { background: var(--screen); border-top: 1px solid var(--wall); max-height: 82%; display: flex; flex-direction: column; padding: 0.8em 16px calc(0.8em + env(safe-area-inset-bottom, 0px)); }
.bhead { display: flex; flex-direction: column; gap: 0.15em; padding-bottom: 0.6em; }
#b-title, .panel h2 { color: var(--bright); font: inherit; margin: 0; }
#b-preview { color: var(--dim); font-size: 0.86em; }
#b-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; align-content: start; }
#b-list.verbs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.bk { font: inherit; text-align: left; background: transparent; color: var(--wall); border: 1px solid var(--faint); padding: 0.45em 0.6em; cursor: pointer; min-width: 0; }
#b-list.verbs .bk { padding: 0.4em 0.45em; }
.bk.held { border-color: var(--dim); }
.bk:active { background: var(--wall); color: var(--screen); }
.bk:focus-visible { outline: 1px solid var(--bright); }
#b-list .empty { color: var(--dim); }
.bfoot { display: flex; gap: 0.4em; flex-wrap: wrap; padding-top: 0.7em; }
#sheet .panel { gap: 0.8em; overflow-y: auto; }
#sheet p { margin: 0; color: var(--dim); font-size: 0.86em; line-height: 1.6; }
#confirm-row { display: flex; gap: 0.4em; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <span id="room">ノークリップ</span>
    <span id="score">正気 10</span>
    <button id="menu-btn" type="button" aria-label="メニュー" aria-expanded="false">≡</button>
  </header>

  <main id="screen" aria-live="polite">
    <div id="log"></div>
  </main>

  <footer id="dock">
    <form id="prompt" autocomplete="off">
      <button id="build-btn" type="button" aria-haspopup="dialog">命令を作る</button>
      <label for="cmd" class="gt">&gt;</label>
      <input id="cmd" type="text" enterkeyhint="send" placeholder="耳をすます" autocapitalize="off" spellcheck="false">
      <button id="send" type="submit">決定</button>
    </form>
    <div id="pad">
      <div id="compass" aria-label="移動">
        <button class="pk dir updown" type="button" data-go="u">上</button>
        <button class="pk dir" type="button" data-go="n">北</button>
        <span class="pk blank" aria-hidden="true"></span>
        <button class="pk dir" type="button" data-go="w">西</button>
        <button class="pk look" type="button" data-cmd="look">見る</button>
        <button class="pk dir" type="button" data-go="e">東</button>
        <span class="pk blank" aria-hidden="true"></span>
        <button class="pk dir" type="button" data-go="s">南</button>
        <button class="pk dir updown" type="button" data-go="d">下</button>
      </div>
      <div id="common" aria-label="よく使う命令">
        <button class="pk" type="button" data-cmd="inventory">持ち物</button>
        <button class="pk" type="button" data-cmd="wait">待つ</button>
        <button class="pk" type="button" data-cmd="listen">耳をすます</button>
        <button class="pk" type="button" data-cmd="noclip">すり抜ける</button>
        <button class="pk" type="button" data-cmd="dunno">わからない</button>
        <button class="pk" type="button" data-cmd="help">遊び方</button>
      </div>
    </div>
  </footer>

  <div id="builder" hidden>
    <div class="panel" role="dialog" aria-labelledby="b-title">
      <div class="bhead">
        <span id="b-title">何をする？</span>
        <span id="b-preview"></span>
      </div>
      <div id="b-list"></div>
      <div class="bfoot">
        <button class="key" type="button" id="b-back">戻る</button>
        <button class="key" type="button" id="b-close">閉じる</button>
      </div>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="panel" role="dialog" aria-label="メニュー">
      <h2>ノークリップ</h2>
      <p>十字キーで移動する。左上の「上」と右下の「下」で、上下にも動ける。「命令を作る」を押し、動詞 → 物（またはことば）の順にタップすると命令になる。入力欄に日本語で書いてもいい。困ったら「わからない」。</p>
      <p>途中の状態は自動で残り、次に開くと続きから始まる。</p>
      <div id="confirm-row">
        <button class="key" type="button" id="restart-btn">はじめから</button>
        <button class="key" type="button" id="restart-yes" hidden>本当にはじめから</button>
        <button class="key" type="button" id="restart-no" hidden>やめる</button>
      </div>
      <button class="key" type="button" id="close-sheet">閉じる</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ==== ENGINE BEGIN ====
// ゲーム本体。画面（DOM）には触らない。時計版に移すときは、この区切りの中だけを使う。
// io: { loadState(), saveState(obj), loadLoop(), saveLoop(obj) }（どれも失敗してよい）
function createGame(io) {
  const VERSION = 1;
  function loadSaved() { try { return io.loadState(); } catch (e) { return null; } }
  function writeSaved(obj) { try { io.saveState(obj); } catch (e) { /* 残せなくても遊べる */ } }
  function loadLoop() { try { return io.loadLoop() || { n: 0, echo: [], last: "" }; } catch (e) { return { n: 0, echo: [], last: "" }; } }
  function saveLoop(v) { try { io.saveLoop(v); } catch (e) { /* 残らなくても遊べる */ } }

  // ---- 物の置き場 ----
  const O = {};
  function thing(id, def) {
    O[id] = Object.assign({ id, loc: null, take: false, en: id.toLowerCase(), aliases: [def.name] }, def);
  }
  const text = v => (typeof v === "function" ? v() : v);
  const held = id => O[id].loc === "player";
  const near = id => O[id].loc === "player" || O[id].loc === S.loc;
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const DIR_JA = { n: "北", s: "南", e: "東", w: "西", u: "上", d: "下" };

  // ---- レベル ----
  const LEVEL_OF = { l0: "0", l1a: "1", l1b: "1", l1c: "1", l2a: "2", l2j: "2", l2e: "2", l3a: "3", l3b: "3", l3c: "3", l3d: "3",
    l4a: "4", l4b: "4", l4c: "4", l5a: "5", l5b: "5", l5c: "5", l5d: "5", l6: "6", l7a: "7", l7b: "7",
    l37a: "37", l37b: "37", l37c: "37", lfun: "Fun", lrun: "!" };
  const LEVEL_START = { "0": "l0", "1": "l1a", "2": "l2a", "3": "l3a", "4": "l4a", "5": "l5a", "6": "l6", "7": "l7a", "37": "l37a", "Fun": "lfun", "!": "lrun" };
  const LEVEL_INFO = {
    "0": ["ロビー", "クラス1"], "1": ["居住区", "クラス1"], "2": ["パイプの夢", "クラス2"], "3": ["電気室", "クラス4"],
    "4": ["放棄されたオフィス", "クラス1"], "5": ["恐怖のホテル", "クラス3"], "6": ["消灯", "クラス4"], "7": ["海洋恐怖症", "クラス3"],
    "37": ["崇高", "クラス0"], "Fun": ["ファン =)", "クラス5"], "!": ["走れ", "クラス5"],
  };
  const LV = () => LEVEL_OF[S.loc];

  // M.E.G. の生存手引き。見たもの、出会ったものが、ここに増えていく
  const PAGES = {
    "0": "レベル0「ロビー」\n生存難易度：クラス1（安全・不安定・実体はほぼ確認されていない）\n黄ばんだ壁紙、湿ったカーペット、最大出力でうなる蛍光灯。広さは推定で六億平方マイル。同じ部屋に二度入ることは、まずない。\n出口：壁紙の継ぎ目がずれている場所では、壁をすり抜けられることがある。",
    "1": "レベル1「居住区」\n生存難易度：クラス1（安全・安定・実体は少数）\nコンクリートの倉庫がどこまでも続く。床に水たまり、天井近くに薄い霧。補給品の木箱が、いつのまにか置かれていることがある。\n照明はときどき消える。消えているあいだは、動かないこと。\nかつて M.E.G. の基地アルファがあった。",
    "2": "レベル2「パイプの夢」\n生存難易度：クラス2（ほぼ安全・安定・実体あり）\n暗く狭い整備用トンネル。奥へ行くほど暑い。\n分岐では管に触れて確かめること。冷たい管は、どこかへ続いている。",
    "3": "レベル3「電気室」\n生存難易度：クラス4（危険・安定・実体多数）\nレンガの廊下と、唸りつづける機械。\n内側から人の声がする扉は、開けないこと。返事もしないこと。\n配電盤のスイッチを全部上げると、過負荷になる。",
    "4": "レベル4「放棄されたオフィス」\n生存難易度：クラス1（安全・安定・実体はほぼなし）\n誰もいないオフィス。給水器からアーモンド水が出る。休める場所。\n風船のついた扉には入らないこと。",
    "5": "レベル5「恐怖のホテル」\n生存難易度：クラス3\n古いホテル。ずっと、誰かに見られている気がする。\nビバリールームのピアノは、誰も弾いていないのに鳴る。曲の途中で、物に触れないこと。\nボイラー室はひどく暑い。",
    "6": "レベル6「消灯」\n生存難易度：クラス4\nどんな光源も働かない。何も見えない。\n音をたよりに進むこと。暗闇に歯が浮かんだら、動かないこと。",
    "7": "レベル7「海洋恐怖症」\n生存難易度：クラス3\n部屋の半分が、果てのない海になっている。水の下に、とても大きなものがいる。\n影が船の下を通るあいだは、漕がないこと。",
    "37": "レベル37「崇高」\n生存難易度：クラス0（安全・安定・実体なし）\n白いタイルと、温かいプール。ひどく落ち着く。\n長く留まった者は、帰りたい理由を、ひとつずつ忘れていくと言われている。",
    "Fun": "レベル Fun =)\n生存難易度：クラス5（極めて危険）\n風船、紙吹雪、ケーキ。\n誘いに「はい」と言わないこと。何も食べないこと。留まらないこと。",
    "!": "レベル !「走れ」\n生存難易度：クラス5（極めて危険）\n赤い非常灯の廊下。後ろから何かが来る。\n止まらないこと。角では、曲がる方向を間違えないこと。",
    water: "物品「アーモンド水」\nほんのり甘い水。飲むと頭がはっきりする。ここで、いちばん大切な飲みもの。",
    wretch: "「ウレッチ」\nアーモンド水を飲まずに、長いあいだ正気を失いつづけた人のなれの果て。\n正気を尽きさせないこと。",
    smiler: "実体「スマイラー」\n暗闇に浮かぶ、白い歯の列。\n灯りを向けないこと。動かないこと。しばらくすると、興味を失う。",
    hound: "実体「ハウンド」\n四つ足で這う、人に似たもの。恐れに反応する。\n走らないこと。目を逸らさずに見つめ返し、それからゆっくり離れること。",
    skin: "実体「スキンスティーラー」\n人の皮をかぶり、人の声で話す。\n扉の向こうから知り合いの声がしても、開けないこと。返事もしないこと。",
    faceling: "実体「フェイスリング」\n顔のない人。たいてい無害。人のふりをして、人の暮らしを続けている。",
    party: "実体「パーティーゴアー」\n黄色い体に、描いたような笑顔。会えば、必ずパーティーに誘ってくる。=)",
  };
  const PAGE_ORDER = ["0", "1", "2", "3", "4", "5", "6", "7", "37", "Fun", "!", "water", "wretch", "smiler", "hound", "skin", "faceling", "party"];
  const pageTitle = k => PAGES[k].split("\n")[0];

  function initWorld() {
    for (const k of Object.keys(O)) delete O[k];

    // ---- レベル0
    thing("wallpaper", { name: "壁紙", aliases: ["壁紙", "壁", "wallpaper"], loc: "l0", scenery: true,
      desc: () => S.l0.seam ? "この部屋の壁紙だけ、継ぎ目が指一本ぶんずれている。ずれの奥は、黄色ではない。" : "黄ばんだ壁紙。細い縦じまの模様。どの部屋も、同じ壁紙だ。" });
    thing("carpet", { name: "カーペット", aliases: ["カーペット", "床", "carpet"], loc: "l0", scenery: true,
      desc: "湿ったカーペット。踏むと、古い水の匂いが上がってくる。" });
    thing("lights0", { name: "蛍光灯", aliases: ["蛍光灯", "明かり", "lights"], loc: "l0", scenery: true,

  const exitsOf = loc => text(ROOMS[loc].exits);

  // ---- 状態 ----
  let S = null;
  let LOOP = loadLoop();
  function shuffleDirs(n, from) { const out = []; for (let i = 0; i < n; i++) out.push(pick(from)); return out; }
  function newState() {
    initWorld();
    S = { loc: "l0", moves: 0, done: false, seen: {}, san: 10, bat: 60, light: false, falls: 0, broken: false,
      pages: {}, hist: [], said: {},
      l0: { i: rnd(YELLOW.length), steps: 0, seam: false, foot: pick(["n", "s", "e", "w"]), idle: 0 },
      l1v: 0, radio: 0, blk: 0, blkArmed: false, blkDone: false,
      pipes: shuffleDirs(4, ["n", "e", "w"]), j: 0, hound: 0, heat: 0,
      ss: 0, ssWait: 0, ssLine: 0, sw: { 1: false, 2: false, 3: false, 4: false }, power: false, burnt: false, smile: null, keyIn: false,
      bulletin: false, invited: false, facePointed: false,
      song: 0, boilerOpen: false, watched: 0,
      l6: 0, l6d: shuffleDirs(3, ["n", "e", "w"]), smile6: null,
      row: 0, shadow: 0,
      calm: 0, drain: false,
      funWait: 0,
      run: 0, runDirs: shuffleDirs(5, ["n", "e", "w"]) };
  }
  const SAVED_FIELDS = ["loc", "closed"];
  function snapshot() {
    const objs = {};
    for (const o of Object.values(O)) {
      objs[o.id] = {};
      for (const k of SAVED_FIELDS) if (k in o) objs[o.id][k] = o[k];
    }
    return { v: VERSION, S, objs, log: rows.slice(-300) };
  }
  function restore(data) {
    if (!data || data.v !== VERSION || !data.S) return false;
    initWorld();
    S = data.S;
    for (const [id, st] of Object.entries(data.objs || {})) if (O[id]) Object.assign(O[id], st);
    return true;
  }

  // ---- 文章の行 ----
  let rows = [];
  let turnStart = 0;
  let flashed = false;
  function push(r) { rows.push(r); }
  // 正気が削れてくると、字がところどころ欠ける
  function corrupt(t) {
    if (!S || S.san > 3 || t.length < 6 || Math.random() > 0.25) return t;
    const i = 2 + rnd(t.length - 3);
    return t.slice(0, i) + pick(["■", "黄", "=)"]) + t.slice(i + 1);
  }
  function say(t, cls) { for (const part of String(t).split("\n")) push({ t: "out", ja: cls === "title" || cls === "win" || cls === "doc" ? part : corrupt(part), cls: cls || "" }); }
  function gap() { push({ t: "gap" }); }
  function flicker() { flashed = true; }
  // 過去に打った命令の一つが、打っていない命令に書き換わる
  function haunt(t) {
    const idx = [];
    rows.forEach((r, i) => { if (r.t === "cmd" && i < rows.length - 8) idx.push(i); });
    if (!idx.length) return;
    rows[idx[rnd(idx.length)]] = { t: "cmd", ja: t, en: "", haunted: true };
  }
  function note(k) {
    if (S.pages[k]) return;
    S.pages[k] = true;
    S.lastPage = k;
    if (held("book")) say("（生存手引きに、ページが一枚増えた）", "note");
  }
  function bookText() {
    const have = PAGE_ORDER.filter(k => S.pages[k]);
    const lv = LV();
    let t = "M.E.G. 生存手引き\n綴じてあるページ：" + (have.length ? have.map(k => pageTitle(k).replace(/^(実体|物品)/, "")).join("、") : "まだない");
    t += "\n\n" + (S.pages[lv] ? PAGES[lv] : "（このレベルのページは、まだない）");
    if (S.lastPage && S.lastPage !== lv && S.pages[S.lastPage]) t += "\n\n" + PAGES[S.lastPage];

  }
  function loopScrawl() {

  }
  const songOn = () => S.song % 5 < 3;
  function runCue() {

    return d === "n" ? "廊下は、まっすぐ北へ続いている。" : `すぐ先で、廊下が${DIR_JA[d]}へ折れている。`;
  }
  function runExits() { const e = {}; if (S.run < 5) e[S.runDirs[S.run]] = "lrun"; return e; }
  function status() {
    const lv = LV();
    const info = LEVEL_INFO[lv];
    const glitch = S.san <= 2 && !S.done && Math.random() < 0.5;
    const ex = isDark() && S.loc !== "l6" ? {} : exitsOf(S.loc);
    return { room: isDark() ? "暗闇" : ROOMS[S.loc].name,
      level: "Level " + (glitch ? pick(["?", "0", "−1", "∞"]) : lv), cls: info[1], levelName: info[0],
      san: S.san, low: S.san <= 3, bat: held("flashlight") ? S.bat : null, light: lightOn(),
      exits: Object.keys(ex).filter(k => ex[k]), done: S.done, theme: { "0": "t0", "37": "t37", "Fun": "tfun", "!": "trun" }[lv] || "t" + lv };
  }

  // ---- 世界のしくみ ----
  const lightOn = () => S.light && held("flashlight") && S.bat > 0 && LV() !== "6";
  function baseDark(loc) {
    if (loc === "l1c" || loc === "l2a" || loc === "l2j" || loc === "l2e" || loc === "l6") return true;
    if (loc === "l3b" && S.smile) return true;
    if (LEVEL_OF[loc] === "1" && S.blk > 0) return true;
    return false;
  }
  const isDark = () => baseDark(S.loc) && !lightOn();
  function visible() {
    const out = [];
    const dark = isDark();
    const walk = parent => {
      for (const o of Object.values(O)) {
        if (o.loc !== parent) continue;
        if (dark && parent === S.loc && !o.feel) continue;
        out.push(o);
        if (o.container && !o.closed) walk(o.id);
      }
    };
    walk(S.loc);
    walk("player");
    return out;
  }
  function describe(full) {
    const r = ROOMS[S.loc];
    if (isDark() && S.loc !== "l6") {
      say("暗闇", "title");
      if (LV() === "2") say("真っ暗だ。熱い管の匂い。手を伸ばすと、管に触れる。" + (S.loc === "l2j" ? "三本に分かれている。" : ""));
      else if (LV() === "1" && S.blk > 0) say("照明が、すべて消えている。");
      else if (S.loc === "l3b") say("割れた電球のかけらが、靴の下で鳴る。暗闇の真ん中に、白い歯の列が浮かんでいる。");
      else say("真っ暗で、何も見えない。奥から、配管を叩くような音。");
      return;
    }
    say(r.name, "title");
    if (full || !S.seen[S.loc] || S.loc === "l0" || S.loc === "l2j" || S.loc === "lrun" || S.loc === "l6" || S.loc === "l7b") say(text(r.desc));
    S.seen[S.loc] = true;
    const loose = Object.values(O).filter(o => o.loc === S.loc && !o.scenery);
    for (const o of loose) say(`ここに${o.name}がある。`);
    for (const c of Object.values(O).filter(o => o.loc === S.loc && o.container && !o.closed)) {
      const inside = Object.values(O).filter(o => o.loc === c.id);
      if (inside.length) say(`${c.name}の中に、${inside.map(o => o.name).join("、")}。`);
    }
  }
  // 階が変わったときの出来事
  function arrive(lv, from) {
    if (lv === from) return;
    const info = LEVEL_INFO[lv];
    say(`―― Level ${lv}「${info[0]}」`, "note");
    if (lv === "1" && !S.seen.arr1) { S.seen.arr1 = true; say("落ちてきたはずの天井を見上げる。コンクリートの天井には、穴も継ぎ目もない。", "note"); }
    if (lv === "3" && !S.seen.arr3) { S.seen.arr3 = true; S.ss = 1; haunt("開けて"); }
    if (lv === "6" && !S.seen.arr6) { S.seen.arr6 = true; if (S.light) say("懐中電灯のスイッチは入ったままなのに、光が出ていない。", "warn"); }
    if (lv === "Fun" && !S.seen.arrF) {
      S.seen.arrF = true;
      say("背中で、扉が閉まる音。振り向くと、扉はもうなかった。", "warn");
      say("「ねえ、パーティーしようよ =)」", "voice");
    }
    if (lv === "!" && !S.seen.arrR) { S.seen.arrR = true; haunt("走れ"); flicker(); }
    if (lv === "37" && !S.seen.arr37) { S.seen.arr37 = true; note("37"); }
  }
  function enter(to) {
    const from = LV();
    S.loc = to;
    describe(false);
    arrive(LV(), from);
  }
  // 正気が尽きると倒れる。三度目で、ウレッチになる
  function addSan(n, why) {
    if (S.done) return;
    if (why) say(why, n < 0 ? "warn" : "note");

    haunt(pick(["ここはどこ", "水", "黄色", "=)"]));
    S.san = 4;

  // 実体に襲われる。そのレベルの入口で目を覚ます

  }
  function respawn(loc, msg) {

    if (LEVEL_OF[loc] === "7") { S.row = 0; O.hatch.loc = null; }
    if (LEVEL_OF[loc] === "!") S.run = 0;
    if (LEVEL_OF[loc] === "3") { S.ssWait = 0; S.burnt = false; }
    gap();
    say(msg);
    S.loc = loc;

  }

  // ---- 動き ----
  function go(dir) {
    const lv = LV();
    if (S.smile && S.loc === "l3b") { hurt(4, "動いた瞬間、歯の列が、目の前いっぱいに広がった。"); return; }
    if (S.loc === "l6") { move6(dir); return; }
    if (S.loc === "lfun") { say("出口は、あの「!」の扉しかない。黄色い人たちが、道をふさぐように立っている。"); return; }
    if (S.loc === "l7a") { say("砂の先は海だ。ボートで「漕ぐ」しかない。"); return; }
    if (S.loc === "l7b") { say("櫂で「漕ぐ」しかない。"); return; }
    if (S.loc === "l0") { move0(dir); return; }
    if (S.loc === "l2j") { move2(dir); return; }
    if (S.loc === "l1c" && dir === "d" && !lightOn()) { say("暗すぎて、階段の一段目が分からない。踏み外したら終わりだ。灯りが要る。"); return; }
    if (S.loc === "l1c" && dir === "n") { say("通路は、すぐ先で行き止まりになっている。階段は、下にしかない。"); return; }
    if (S.loc === "l1a" && (dir === "s" || dir === "w")) {
      S.l1v = (S.l1v + 1 + rnd(2)) % 3;

    if (S.loc === "l5b" && dir === "w" && !S.boilerOpen) { say("ボイラー室の扉には、鍵がかかっている。"); return; }
    if (S.loc === "l5d" && dir === "d") { say("ボイラーの裏の梯子を降りる。熱が、一段ごとに遠のく。光も、一段ごとに遠のく。"); gap(); note("5"); enter("l6"); return; }
    if (S.loc === "l37b" && dir === "d") {
      say("深いプールに潜る。温かい水。白いタイルの壁が、下へ、下へと続く。潜っても、潜っても、底がない。");
      say("……息が切れる直前、気がつくと、プールルームのタイルの上に座っていた。髪が濡れている。");

    }

    if (!to) { say(`${DIR_JA[dir] || "そちら"}へは行けない。`); return; }
    if (S.loc === "l1c" && dir === "d") { say("懐中電灯の輪を頼りに、鉄の階段を降りる。一段ごとに、空気が熱く、重くなる。"); gap(); note("1"); }

  }
  function move0(dir) {
    if (dir === "u" || dir === "d") { say(dir === "u" ? "天井は、手の届かない高さにある。" : "床は、ただの湿ったカーペットだ。"); return; }
    S.l0.steps++;
    S.l0.idle = 0;
    const toward = dir === S.l0.foot;
    S.l0.i = (S.l0.i + 1 + rnd(YELLOW.length - 1)) % YELLOW.length;
    S.l0.seam = (S.l0.steps >= 4 && Math.random() < 0.35) || S.l0.steps >= 8;
    if (S.l0.seam) S.l0.steps = 0;
    O.seam.loc = S.l0.seam ? "l0" : null;
    if (S.l0.steps === 2 && O.page0.loc === null && !held("page0")) O.page0.loc = "l0";
    else if (O.page0.loc === "l0") O.page0.loc = "gone";
    describe(true);
    if (toward) {
      addSan(-1, "足音のしていたほうへ来た。……誰もいない。カーペットに、自分と同じ靴の足跡だけが残っている。まだ、温かい。");
      S.l0.foot = pick(["n", "s", "e", "w"].filter(d => d !== dir));
    } else if (Math.random() < 0.3) S.l0.foot = pick(["n", "s", "e", "w"]);
  }
  function move2(dir) {
    if (S.hound === 1) { hurt(3, "背を向けた瞬間、それが跳んだ。熱い管に叩きつけられる。"); note("hound"); return; }
    if (S.hound === 2) {
      S.hound = 3;
      say("目を逸らさないまま、ゆっくりと後ずさる。……それは低く唸り、やがて興味を失ったように、管の陰へ戻っていった。");
      O.hound.loc = null;
      note("hound");
      if (dir === "s") { S.j = 0; enter("l2a"); return; }
    }
    if (dir === "s") { S.j = 0; say("来た道を戻る。"); enter("l2a"); return; }
    if (dir === "u" || dir === "d") { say("管が邪魔で、上にも下にも行けない。"); return; }
    if (dir !== S.pipes[S.j]) {
      S.j = 0;
      say(`${DIR_JA[dir]}の管をたどって進む。……管は、途中で壁に潜りこんで消えた。気づくと、最初の分岐に戻っていた。`);
      addSan(-1, "");
      describe(true);
      return;
    }
    S.j++;
    say(`冷たい管をたどって、${DIR_JA[dir]}へ進む。`);

    if (S.j === 2 && S.hound === 0) {
      S.hound = 1;
      O.hound.loc = "l2j";
      describe(true);
      gap();
      say(isDark() ? "暗闇の奥で、何かが、こちらを見ている。荒い息。" : "懐中電灯の輪の端に、四つ足の何かがいた。こちらを見ている。", "warn");
      return;
    }
    describe(true);
  }
  function move6(dir) {
    if (S.smile6) { hurt(4, "一歩踏み出した瞬間、歯の列が、目の前いっぱいに広がった。"); note("smiler"); return; }

  function toSea() { S.l6 = 3; note("6"); enter("l7a"); }
  function liftDown() {
    if (!S.power) { say("ボタンは反応しない。電気が来ていない。"); return; }

  // ---- ヒント ----
  function hintText() {
    const water = ["water1", "water2"].find(id => held(id));
    if (S.san <= 3 && water) return `${O[water].name}を「飲む」。`;
    if (S.san <= 3 && LV() === "4") return "給水器で「飲む」。";
    if (LV() === "1" && S.blk > 0) return "動かずに「待つ」。";
    if (S.smile && S.loc === "l3b") return lightOn() ? "懐中電灯を「消す」。それから、動かずに「待つ」。" : "動かずに「待つ」。";
    if (S.smile6) return "動かずに「待つ」。";
    if (S.hound === 1 && S.loc === "l2j") return "走らない。背を向けない。ハウンドを「調べる」で見つめ返してから、ゆっくり離れる。";
    switch (LV()) {
      case "0":
        if (S.l0.seam) return "ずれた継ぎ目を「すり抜ける」。";
        return "歩きまわる。足音のするほうへは行かない（「耳をすます」で分かる）。壁紙の継ぎ目がずれている部屋を探す。";
      case "1":
        if (O.crate.closed && S.loc === "l1a") return "木箱を「開ける」。";
        if (!held("flashlight")) {
          if (S.loc !== "l1b") return "東の金網の基地へ。";
          if (S.radio === 0) return "無線機に「耳をすます」。";
          return O.lk7.closed ? "7番のロッカーを「開ける」。" : "懐中電灯を「取る」。生存手引きも。";
        }
        if (!lightOn()) return S.bat > 0 ? "懐中電灯を「点ける」。" : "電池を懐中電灯に「入れる」。";
        return S.loc === "l1c" ? "「下」へ。" : "北の暗い通路から、階段を「下」へ。";
      case "2":
        if (S.loc === "l2a") return "北の分岐へ。";
        if (S.loc === "l2j") return "三本の管に「触る」。冷たい管の方角へ進む。";
        return "「下」へ。";
      case "3":
        if (S.ss === 1) return "扉の向こうの声には、答えない。開けない。しばらく、ほかのことをして「待つ」。";
        if (!held("liftkey")) return S.loc === "l3a" ? "鉄扉を「開ける」。" : "廊下の鉄扉の向こうへ。";
        if (!S.power) return S.loc === "l3b" ? (held("card") ? "身分証のとおり、スイッチ1と3だけを「押す」（上げる）。ほかは下げておく。" : "スイッチを試す。ただし、全部は上げない。") : "東の配電室へ。";
        if (!S.keyIn) return S.loc === "l3c" ? "鍵を鍵穴に「入れる」。" : "北のエレベーターホールへ。";

      case "4":
        if (S.san < 8) return "給水器で「飲む」。";

        case "l7a": case "l7b": say(S.shadow > 0 ? "水の下から、とても低い、歌うような音。船底が、それに合わせて震えている。" : "波の音。ずっと下のほうで、何かが鳴いている。"); return;
        case "l37a": case "l37b": case "l37c": say(S.loc === "l37c" ? "水の反響。……その奥、排水口の下から、遠くで車の走る音。" : "水の反響。どこかで、誰かが水をかく音。"); return;
        case "lfun": say("音楽が大きすぎて、自分の声も聞こえない。黄色い人たちの、くすくす笑い。"); return;
        case "lrun": say("警報。後ろから、足音。すぐ後ろから。"); return;

    },
    help: () => say("遊び方：「命令を作る」で、動詞 → 物（「言う」ならことば）の順にタップする。十字キーで移動し、「上」「下」で上下に動く。困ったら「わからない」。", "note"),
    noclip: () => {
      if (S.loc === "l0") {
        if (!S.l0.seam) { say("壁に肩を押しつけてみた。ただの壁だ。……どこかに、継ぎ目のずれた壁があるはずだ。"); return; }
        say("ずれた継ぎ目に、肩から体を押しつける。壁紙が、水のように冷たくなった。");
        say("……体が、壁の中を通り抜けていく。");
        gap();
        flicker();
        say("落ちる。長くは落ちなかった。コンクリートの床に、膝から着いた。");
        note("0");
        enter("l1a");
        return;
      }
      say("壁に体を押しつけてみた。……ここの壁は、すり抜けられそうにない。");
    },
    run: () => {
      if (S.loc === "l2j" && (S.hound === 1 || S.hound === 2)) { hurt(3, "走り出した瞬間、背中に重いものが飛びついた。"); note("hound"); return; }
      if (S.loc === "lrun") return; // 赤い廊下では act の中で扱う
      if (S.loc === "l0") { say("走る。黄色い部屋が、次々に後ろへ流れていく。……どれだけ走っても、同じ部屋だ。"); move0(pick(["n", "s", "e", "w"])); return; }
      if (S.loc === "lfun") { say("走って出口を探す。黄色い人たちが、手をつないで輪になり、道をふさいだ。"); return; }
      say("走る理由が見つからない。走ると、何かに気づかれる気がする。");
    },
    row: () => {
      if (S.loc === "l7a") {
        S.row = 0; S.shadow = 0;
        say("ボートを海へ押し出し、乗りこむ。櫂を握る。");
        S.loc = "l7b";
        S.row = 1;
        say("一回目。ボートが、黒い水の上を滑りだす。");
        describe(true);
        return;
      }
      if (S.loc !== "l7b") { say("漕ぐものがない。"); return; }
      if (S.row >= 5) { say("ボートはブイに着いている。ハッチを開けるしかない。"); return; }
      if (S.shadow > 0) {
        S.shadow = 0;
        S.row = 0;
        note("7");
        hurt(3, "櫂が水を打った瞬間、船の下の影が、止まった。……ボートが、下から持ち上げられる。");
        return;
      }
      S.row++;
      say(`${["", "一", "二", "三", "四", "五"][S.row]}回目。櫂が、黒い水をかく。赤いブイの灯りが、近づく。`);
      if (S.row === 2 || S.row === 4) {
        S.shadow = 2;
        gap();
        say("ボートの下を、巨大な影が通りはじめた。ボートより、部屋より、ずっと大きい。", "warn");
        return;
      }
      if (S.row >= 5) say("ボートが、赤いブイにこつんと当たった。ブイのてっぺんに、丸いハッチがある。");
      if (S.row >= 5) O.hatch.loc = "l7b";
    },
    examine: (o) => {
      if (!need(o, "調べる")) return;
      if (o.id === "hound") {
        if (S.hound === 1) { S.hound = 2; say("目を逸らさずに、見つめ返す。それは低く唸り、前脚を止めた。……こちらが怖がるのを、待っている。"); note("hound"); return; }
        say(text(o.desc)); return;
      }
      if ((o.id === "sea" || o.id === "sea2") && S.shadow > 0) { addSan(-2, "影を、見てしまった。目が、いくつあるのか分からない。"); return; }
      say(text(o.desc) || `${o.name}に、特に変わったところはない。`);
    },
    read: (o) => {
      if (!need(o, "読む")) return;
      if (isDark() && !o.feel) { say("暗くて、字が読めない。"); return; }

    },
    take: (o) => {
      if (!need(o, "取る")) return;
      if (o.loc === "player") { say("もう持っている。"); return; }
      if (o.id === "bkey" && songOn()) {
        addSan(-2, "鍵に指が触れた瞬間、ワルツが止まった。誰もいない席から、いっせいに拍手。……手を引っこめると、また曲が始まった。");

      if (!o.take) { say(`${o.name}は取れない。`); return; }
      o.loc = "player";

      if (o.id === "book") {

    drop: (o) => {
      if (!need(o, "置く")) return;
      if (o.loc !== "player") { say(`${o.name}は持っていない。`); return; }

      say(`${o.name}を置いた。`);
    },
    put: (o, w) => {
      if (!need(o, "入れる")) return;
      const sm = o.id.match(/^sw([1-4])$/);
      if (sm) { if (!S.sw[+sm[1]]) toggleSwitch(+sm[1]); else say("もう上がっている。"); return; }
      if (o.battery) {
        if (!held("flashlight")) { say("懐中電灯を持っていない。"); return; }
        if (o.loc !== "player" && o.loc !== S.loc && !visible().includes(o)) { say(`${o.name}が手元にない。`); return; }
        o.loc = "gone";
        S.bat = Math.min(100, S.bat + 60);

      }
      if (o.id === "liftkey" || (o.id === "keyhole3" && w && w.id === "liftkey")) {
        if (S.loc !== "l3c") { say("ここに、鍵穴はない。"); return; }
        if (!held("liftkey")) { say("鍵を持っていない。"); return; }
        O.liftkey.loc = "keyhole3_in";
        S.keyIn = true;
        say("鍵を差して、回す。カチリ。ボタンの横の小さなランプが、緑に変わった。");

      }

    open: (o) => {
      if (!need(o, "開ける")) return;

        if (S.ss === 1) {

          S.ssWait = 0;

        enter("l3d");

      }
      if (o.id === "door3") { go("d"); return; }
      if (o.id === "door5") { say("「5」の防火扉を開け、階段を降りる。一階ぶんのはずが、長い。踊り場の絨毯が、途中から深紅に変わった。"); gap(); note("4"); enter("l5a"); return; }
      if (o.id === "doorb") {
        say("風船の扉を開ける。音楽が、どっとあふれてきた。");
        gap();
        flicker();
        note("4");
        enter("lfun");
        return;
      }
      if (o.id === "bdoor") {
        if (S.boilerOpen) { say("もう開いている。"); return; }
        if (!held("bkey")) { say("鍵がかかっている。"); return; }
        S.boilerOpen = true;
        say("重い鍵を回す。扉を引くと、熱気が顔を打った。");
        return;
      }
      if (o.id === "doorx") {
        say("「!」の扉に飛びつき、押し開ける。後ろで、黄色い人たちが、いっせいに笑うのをやめた。");
        gap();
        note("Fun");
        enter("lrun");
        say("背後で扉が閉まる。……すぐに、何かがその扉を叩きはじめた。", "warn");
        return;
      }
      if (o.id === "hatch") {
        say("ハッチを開ける。中は、白いタイルの縦穴だった。梯子を降りる。塩素の匂い。温かい空気。");
        gap();
        flicker();
        note("7");
        enter("l37a");
        return;
      }
      if (o.id === "drain") {
        if (S.drain) { say("もう外してある。"); return; }
        S.drain = true;
        say("格子に指をかけて、持ち上げる。思ったより軽い。下へ、細い梯子が続いている。遠くで、車の走る音。");
        return;
      }
      if (o.id === "boat") { VERB_DO.row(); return; }
      if (o.id === "page0" || o.id === "book" || o.id === "invite") { VERB_DO.read(o); return; }
      if (o.container) {
        if (!o.closed) { say("もう開いている。"); return; }
        o.closed = false;
        if (o.id === "crate") say("木箱の蓋を外す。おがくずの中に、アーモンド水のボトル、電池、銀色の包み。");
        else if (o.id === "lk2") addSan(-1, "2番のロッカーを開ける。……長い髪の束が、ずるりと垂れ下がった。");
        else if (o.id === "lk5") say("5番のロッカーを開ける。空っぽだ。内側に、爪で引っかいた字。「もどれない」");
        else if (o.id === "lk7") say("7番のロッカーを開ける。黄色い懐中電灯と、M.E.G. のバインダー。");
        else if (o.id === "drawer") say("引き出しを開ける。銀色の包みと、電池が一本。");
        else say(`${o.name}を開けた。`);
        return;
      }
      say(`${o.name}は、開けるものではない。`);
    },
    close: (o) => {
      if (!need(o, "閉める")) return;
      if (o.container) { if (o.closed) { say("もう閉まっている。"); return; } o.closed = true; say(`${o.name}を閉めた。`); return; }
      say(`${o.name}は、閉めるものではない。`);
    },
    lighton: (o) => {
      if (o && o.id !== "flashlight") { say(`${o.name}は、点けるものではない。`); return; }
      if (!held("flashlight")) { say("灯りになるものを持っていない。"); return; }
      if (LV() === "6") { S.light = true; say("スイッチを入れる。……光が、出ない。電池はあるのに。ここでは、光が光にならない。"); return; }
      if (S.bat <= 0) { say("電池が切れている。"); return; }
      if (S.light) { say("もう点いている。"); return; }
      S.light = true;
      say("懐中電灯を点けた。");
      if (S.smile && S.loc === "l3b") { say("歯の列が、ゆっくり、灯りのほうを向いた。", "warn"); S.smile.warn = true; return; }
      if (LV() === "1" && S.blk > 0) { say("灯りの輪の外で、何かが、立ち止まった。", "warn"); addSan(-1, ""); return; }

    },
    lightoff: (o) => {
      if (o && o.id !== "flashlight") { say(`${o.name}は、消すものではない。`); return; }
      if (!held("flashlight") || !S.light) { say("消す灯りがない。"); return; }
      S.light = false;
      say("懐中電灯を消した。");
      if (isDark()) say("真っ暗だ。");
    },
    drink: (o) => {
      if (!need(o, "飲む")) return;
      if (!o.drink) { say(`${o.name}は、飲めない。`); return; }
      if (o.tap) {
        if (S.san >= 10) { say("給水器から一杯飲んだ。甘い。もう、十分に頭ははっきりしている。"); note("water"); return; }
        note("water");
        addSan(3, "");
        say("紙コップで、給水器のアーモンド水を飲む。ほんのり甘い。（正気 +3）");
        return;
      }
      if (o.pain) {
        o.loc = "gone";
        addSan(-6, "赤い液体を飲んだ。……喉から、全身へ、焼けるような痛みが広がった。何も考えられない。");
        return;
      }
      if (!near(o.id)) { say(`ここに${o.name}はない。`); return; }
      drinkWater(o);
    },
    eat: (o) => {
      if (!need(o, "食べる")) return;
      if (o.id === "cake" || o.id === "partygoers") {
        say("ケーキを一口、食べた。甘い。とても甘い。", "warn");
        endParty();
        return;
      }
      if (!o.food) { say(`${o.name}は、食べられない。`); return; }
      if (!near(o.id)) { say(`ここに${o.name}はない。`); return; }
      o.loc = "gone";
      addSan(2, "");
      say("銀色の包みを開けて、食べる。ぱさぱさしているが、ちゃんと食べ物の味がする。（正気 +2）");
    },
    press: (o) => {
      if (!need(o, "押す")) return;
      const m = o.id.match(/^sw([1-4])$/);
      if (m) { toggleSwitch(+m[1]); return; }
      if (o.id === "liftbtn") { liftDown(); return; }
      if (o.id === "bell") {
        say("チン。……誰も来ない。廊下の奥で、どこかの扉が一つ、そっと閉まる音がした。");
        return;
      }
      if (o.id === "hound") { hurt(3, "手を伸ばした瞬間、それが跳んだ。"); return; }
      say(`${o.name}を押しても、何も起きない。`);
    },
    touch: (o) => {
      if (!need(o, "触る")) return;
      const m = o.id.match(/^pipe([new])$/);
      if (m) {
        const cold = S.pipes[S.j] === m[1];
        say(cold ? `${o.name}に触れる。……冷たい。ほかの管と違って、ひやりとしている。` : `${o.name}に触れる。熱い。思わず手を引っこめた。`);
        return;
      }
      if (o.id === "raincoat") { addSan(-1, "触れてしまった。……まだ、少し温かかった。"); return; }
      if (o.id === "faceling") { say("肩に触れる。顔のない人は、ゆっくり振り向き、こちらを「見た」。……それから、ホワイトボードのほうを指さした。"); S.facePointed = true; note("faceling"); return; }
      if (o.id === "hound") { hurt(3, "手を伸ばした瞬間、それが跳んだ。"); return; }
      if (o.id === "cake") { VERB_DO.eat(o); return; }
      if (o.id === "pools" || o.id === "deep") { say("水に手を入れる。体温と同じ温度。手を引き抜くのが、少し惜しい。"); return; }
      VERB_DO.examine(o);
    },
    listenTo: (o) => {
      if (o && o.id === "radio") {
        S.radio++;
        if (LOOP.n && S.radio % 3 === 0 && LOOP.echo.length) {
          say("（ノイズ）……ワンダラー用の周波数に、勝手に切り替わった。");
          say("自分の声だ。", "note");
          for (const t of LOOP.echo.slice(-3)) say(`「${t}」`, "voice");
          say("いつ言ったのか、覚えていない。", "note");
          return;
        }
        say("（ノイズ）……こちら M.E.G.、基地アルファ。全ワンダラーへ。……装備は、七番。くり返す、七番。……レベル37で、出口の目撃情報。……灯りが消えたら、動くな。……（ノイズ）");
        return;
      }
      if (o && o.id === "sdoor") { VERB_DO.listen(); return; }
      if (o && o.id === "drain") { say("排水口に耳を近づける。……遠くで、車の走る音。誰かの話し声。ずっと遠く。"); return; }
      VERB_DO.listen();
    },
    say: (w) => {
      if (!w) { say("何と言う？"); return; }
      if (w.ja === "わからない") { VERB_DO.dunno(); return; }
      const show = w.show || w.ja;
      say(`「${show}」`, "voice");
      if (S.loc === "lfun") {
        if (w.ja === "はい") { endParty(); return; }
        if (w.ja === "いいえ") { say("「えー、ざんねん =(」……誰も、帰り道を教えてくれない。黄色い人たちが、一歩近づく。"); return; }
        say("「パーティーのこと？　ねえ、パーティーしようよ =)」");
        return;
      }
      if (S.loc === "l3a" && S.ss === 1) {
        S.ssWait = 0;
        note("skin");
        addSan(-2, `扉の向こうで、声が言った。「${show}」……こちらと、まったく同じ声で。`);
        return;
      }
      if (S.loc === "l4b") {
        S.facePointed = true;
        note("faceling");
        say("顔のない人は、首をかしげた。それから立ち上がり、ホワイトボードに大きく「=)」と描いて、赤いペンでばつ印をつけた。その横に、矢印と「5」。");
        return;
      }
      if (S.loc === "l2j" && (S.hound === 1)) { hurt(3, "声を出した瞬間、それが跳んだ。"); note("hound"); return; }
      if (S.loc === "l6") { addSan(-1, "声は、暗闇に吸いこまれて、どこにも反響しない。……すぐそばで、誰かが、同じことばを囁いた。"); return; }
      say("……返事はない。蛍光灯のうなりだけが、少し大きくなった気がする。");
    },
    lookback: () => {
      if (S.loc === "lrun") return;
      if (S.loc === "l2j" && S.hound === 1) { hurt(3, "振り向いた瞬間、背中を見せた側から、それが跳んだ。"); return; }
      if (S.loc === "l0") { say("振り向く。今来た部屋は、もう別の部屋になっている。"); return; }
      say("振り向く。誰もいない。……振り向く前は、いた気がする。");
    },
    sleep: () => {
      if (LV() === "37") { S.calm += 1; say("白いタイルに横になる。水の音。……少しだけ眠った。何か大切なことを、夢の中に置いてきた気がする。"); return; }
      say("こんな場所では、眠れない。");
    },
    down: () => go("d"),
    up: () => go("u"),
  };
  function ssLine() {
    const lines = ["「おい、開けてくれ。M.E.G. の者だ。仲間とはぐれた」", "「頼む。ここは暗いんだ。暗いのは嫌なんだ」", "「……ねえ、きみの名前、なんだっけ。呼びたいんだ」", "「開けて。開けてよ。開けて」"];
    return lines[S.ssLine++ % lines.length];
  }

  // ---- 手が進むたびに起きること ----
  const META = ["hint", "help", "inventory", "look", "dunno"];
  function after(v) {
    if (S.done || S.broken || META.includes(v)) return;
    const lv = LV();
    // 懐中電灯の電池
    if (S.light && held("flashlight") && lv !== "6" && S.bat > 0) {
      S.bat = Math.max(0, S.bat - 3);
      if (S.bat === 0) { S.light = false; say("懐中電灯が、ふっと消えた。電池が切れた。", "warn"); }
    }
    // レベル1：灯りが消える
    if (lv === "1") {
      if (S.blk > 0) {
        S.blk--;
        if (S.blk === 0) { S.blkDone = true; say("……照明が、一本ずつ戻ってきた。床の水たまりに、とても大きな足跡が残っている。足跡は、こちらのすぐ横を通っていた。", "note"); }
        else say("暗闇の中を、何かが通りすぎていく。床の水が、はねる音。", "warn");
      } else if (S.blkArmed && !S.blkDone && v !== "take") {
        S.blkArmed = false;
        S.blk = 2;
        gap();
        flicker();
        say("照明が、いっせいに消えた。", "warn");
        say("遠くで、何か大きなものが、水たまりを踏む音。近づいてくる。");
      }
    }
    // レベル2：暑さ
    if (lv === "2") { S.heat++; if (S.heat % 5 === 0) addSan(-1, "暑さで、頭がぼんやりする。"); }

    sc.append(sv);
    if (s.bat !== null) sc.append(document.createTextNode(`　電池 ${s.bat}%${s.light ? "*" : ""}`));
    for (const b of document.querySelectorAll("[data-go]")) b.classList.toggle("open", s.exits.includes(b.dataset.go));
    document.body.className = document.body.className.replace(/\bt(\d+|fun|run)\b/g, "").trim();
    document.body.classList.add(s.theme);
  }
  function submit(label, en) {
    G.submit(label, en);
    render();
  }

  // ---- 入力 ----
  $("prompt").addEventListener("submit", e => {
    e.preventDefault();
    const v = cmdEl.value;
    cmdEl.value = "";
    submit(v);
  });
  $("pad").addEventListener("click", e => {
    const b = e.target.closest("[data-go],[data-cmd]");
    if (!b) return;
    if (b.dataset.go) submit(b.textContent, { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" }[b.dataset.go]);
    else submit(b.textContent, b.dataset.cmd);
  });
  cmdEl.addEventListener("focus", () => { document.body.classList.add("typing"); requestAnimationFrame(() => { screenEl.scrollTop = screenEl.scrollHeight; }); });
  cmdEl.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== cmdEl) document.body.classList.remove("typing"); }, 120));

  // ---- 命令を作る ----
  const builder = $("builder");
  const bs = { step: "verb", verb: null, obj1: null };
  const fill = (t, a, b) => t.replace("%", a).replace("#", b);
  function bButton(label, onClick, cls) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "bk" + (cls ? " " + cls : ""); b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }
  function emptyNote(list, msg) {
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = msg;
    list.append(p);
  }
  function renderBuilder() {
    const list = $("b-list");
    list.textContent = ""; list.scrollTop = 0;
    if (bs.step === "verb") {
      $("b-title").textContent = "何をする？"; $("b-preview").textContent = "";
      list.className = "verbs";
      for (const v of G.VERBS) list.append(bButton(v[0], () => {
        if (!v[1].includes("%")) { closeBuilder(); submit(v[2], v[1]); return; }
        bs.verb = v; bs.step = "obj"; renderBuilder();
      }));
      $("b-back").hidden = true;
      return;
    }
    $("b-back").hidden = false;
    list.className = "";
    const v = bs.verb, second = bs.step === "obj2";
    if (v[1].startsWith("say")) {
      $("b-title").textContent = "何と言う？";
      $("b-preview").textContent = "「…」と言う";
      const ws = G.wordsHere();
      for (const w of ws) list.append(bButton("「" + w.show + "」", () => { closeBuilder(); submit(`「${w.show}」と言う`, `say ${w.en}`); }));
      if (!ws.length) emptyNote(list, "口にできることばが、思いつかない。");
      return;
    }
    $("b-title").textContent = second ? "どこに？" : "何を？";
    $("b-preview").textContent = second ? fill(v[2], bs.obj1.name, "…") : fill(v[2], "…", "…");
    let items = G.visible();
    if (second) items = items.filter(o => o.id !== bs.obj1.id);
    items.sort((x, y) => (y.held ? 1 : 0) - (x.held ? 1 : 0));
    for (const o of items) {
      list.append(bButton(o.name + (o.held ? "（持）" : ""), () => {
        if (!second) {
          bs.obj1 = o;
          if (v[1].includes("#")) { bs.step = "obj2"; renderBuilder(); return; }
          closeBuilder();
          submit(fill(v[2], o.name, ""), fill(v[1], o.en, ""));
        } else {
          closeBuilder();
          submit(fill(v[2], bs.obj1.name, o.name), fill(v[1], bs.obj1.en, o.en));
        }
      }, o.held ? "held" : ""));
    }
    if (!items.length) emptyNote(list, "選べる物がない。");
  }
  function openBuilder() {
    if (G.status().done) return;
    bs.step = "verb"; bs.verb = null; bs.obj1 = null;
    builder.hidden = false;
    renderBuilder();
  }
  function closeBuilder() { builder.hidden = true; }
  $("build-btn").addEventListener("click", openBuilder);
  $("b-close").addEventListener("click", closeBuilder);
  builder.addEventListener("click", e => { if (e.target === builder) closeBuilder(); });
  $("b-back").addEventListener("click", () => { bs.step = bs.step === "obj2" ? "obj" : "verb"; renderBuilder(); });

  // ---- メニュー ----
  const sheet = $("sheet");
  function openSheet(open) {
    sheet.hidden = !open;
    $("menu-btn").setAttribute("aria-expanded", String(open));
    $("restart-yes").hidden = $("restart-no").hidden = true;
    $("restart-btn").hidden = false;
  }
  $("menu-btn").addEventListener("click", () => openSheet(sheet.hidden));
  $("close-sheet").addEventListener("click", () => openSheet(false));
  sheet.addEventListener("click", e => { if (e.target === sheet) openSheet(false); });
  $("restart-btn").addEventListener("click", () => { $("restart-btn").hidden = true; $("restart-yes").hidden = $("restart-no").hidden = false; });
  $("restart-no").addEventListener("click", () => openSheet(false));
  $("restart-yes").addEventListener("click", () => { openSheet(false); G.start(true); render(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeBuilder(); openSheet(false); } });

  G.start(false);
  render();
})();
</script>

</body>
</html>
