<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>夢網 保存会</title>
<meta name="theme-color" content="#0b0d1a">
<meta name="description" content="1999 年に終わった夢網の写しを巡回する、ミナモの物語その二">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@500&family=Kosugi+Maru&display=swap">
<style>
:root {
  --bg: #0b0d1a; --desk: #2a2457; --desk2: #231e4a; --win: #c9c6d6; --win-dark: #8a86a0; --win-light: #f1effa;
  --title: #4b2a7a; --title-text: #f6f0ff; --ink: #1a1a1a; --dim: #5d5a6e; --warn: #8c2b24; --green: #7fd18b;
  --deep: #061418; --deep-ink: #8fc9bf;
  --dot: "DotGothic16", "Noto Sans Mono CJK JP", ui-monospace, monospace;
  --mincho: "Shippori Mincho", "Noto Serif CJK JP", serif;
  --round: "Kosugi Maru", "DotGothic16", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--dot); font-size: 15px; line-height: 1.7; overflow: hidden;
  -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.14) 2px 3px); }
/* 水の音が近いとき：まわりから、ゆっくり暗くなる（点滅はしない） */
#dread { position: fixed; inset: 0; pointer-events: none; z-index: 45; opacity: 0; transition: opacity 3s;
  background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,8,10,.92) 100%); }
body.dread #dread { opacity: 1; }

.full { position: fixed; inset: 0; z-index: 30; background: #000; color: var(--green); padding: calc(1.2em + env(safe-area-inset-top, 0px)) 16px 16px; }
#power { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; text-align: center; color: #cfc8ff; background: #05040c; }
#power h1 { font-family: var(--mincho); font-weight: 500; letter-spacing: .4em; color: #e6e0ff; margin: 0; font-size: 1.5em; }
#power p { margin: 0; color: #6f6a90; font-size: .85em; max-width: 26em; }
#power input { background: #0d0b1c; border: 1px solid #3d3670; color: #e6e0ff; padding: .4em .6em; width: 12em; text-align: center; }
#power button { background: none; border: 1px solid #4b3f8a; color: #cfc8ff; padding: .5em 1.6em; border-radius: 3px; }
#power a { color: #6f6a90; font-size: .8em; }
#boot { background: #05040c; color: #b9b0ff; }
#boot pre { margin: 0; white-space: pre-wrap; font-family: var(--dot); font-size: .82em; line-height: 1.7; }
#boot.out { opacity: 0; transition: opacity .8s; }

#desk { position: fixed; inset: 0; display: flex; flex-direction: column;
  background: var(--desk) repeating-linear-gradient(135deg, var(--desk2) 0 2px, transparent 2px 7px); }
#bar { flex: none; display: flex; gap: .7em; align-items: center; padding: calc(.3em + env(safe-area-inset-top, 0px)) 10px .3em;
  background: var(--win); border-bottom: 2px solid var(--win-dark); font-size: .76em; white-space: nowrap; }
#bar .os { font-weight: bold; }
#bar .pts { color: var(--title); }
#bar .clock { margin-left: auto; }
#facedown { background: #1b1630; color: #e6e0ff; border: 2px outset #6c6496; padding: 0 .5em; font-size: .95em; }
#icons { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); align-content: start; gap: 1.2em .5em; padding: 1.6em 16px; overflow-y: auto; }
.icon { display: flex; flex-direction: column; align-items: center; gap: .3em; background: none; border: none; color: #eeeaff; cursor: pointer; position: relative; }
.icon .g { width: 3.2em; height: 3.2em; display: flex; align-items: center; justify-content: center; font-size: 1.15em;
  background: var(--win); color: var(--ink); border: 2px outset var(--win-light); box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.icon.deep .g { background: #0c2a2e; color: var(--deep-ink); border-color: #2c5a5e; }
.icon .t { font-size: .78em; text-shadow: 1px 1px 0 #000; }
.icon .badge { position: absolute; top: -.3em; right: calc(50% - 2.1em); background: var(--warn); color: #fff; font-size: .7em;
  border-radius: 999px; padding: 0 .45em; min-width: 1.5em; text-align: center; }
.icon.new .g { animation: nudge 1.6s ease-in-out 2; }
@keyframes nudge { 50% { transform: translateY(-3px); } }
#toast { position: fixed; left: 50%; bottom: calc(1.2em + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 46;
  background: var(--win); border: 2px outset var(--win-light); padding: .3em 1em; font-size: .82em; opacity: 0; transition: opacity .3s; pointer-events: none;
  max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
#warn { position: fixed; left: 8px; right: 8px; top: calc(2.3em + env(safe-area-inset-top, 0px)); z-index: 47; text-align: center;
  background: rgba(2,14,16,.92); color: #bfe9e1; border: 1px solid #2c5a5e; padding: .4em .6em; font-size: .9em; }
#warn .sec { color: #6fa59c; font-size: .8em; margin-left: .6em; }

#win { position: fixed; inset: calc(2.3em + env(safe-area-inset-top, 0px)) 6px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  display: flex; flex-direction: column; background: var(--win); border: 2px outset var(--win-light); box-shadow: 4px 4px 0 rgba(0,0,0,.45); }
#wbar { flex: none; display: flex; align-items: center; gap: .5em; background: var(--title); color: var(--title-text); padding: .15em .3em .15em .6em; font-size: .85em; }
#win.deep #wbar { background: #0c2a2e; color: var(--deep-ink); }
#wtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wbar button { background: var(--win); color: var(--ink); border: 2px outset var(--win-light); padding: 0 .55em; line-height: 1.4; }
/* ブラウザのボタンは、親指の届く下に */
#wfoot { flex: none; display: flex; align-items: flex-end; gap: .3em; padding: .3em; border-top: 1px solid var(--win-dark); }
#wtool { flex: 1; min-width: 0; display: flex; gap: .3em; align-items: center; flex-wrap: wrap; }
#wclose { margin-left: auto; flex: none; background: var(--win); color: var(--ink); border: 2px outset var(--win-light); padding: .1em .9em; font-size: 1.05em; }
#wclose:active { border-style: inset; }
#wtool:empty { display: none; }
#win.deep #wfoot { background: #0c2a2e; border-color: #123236; }
#wtool input { flex: 1; min-width: 6em; padding: .2em .4em; border: 2px inset var(--win-light); background: #fff; color: var(--ink); }
#win.deep #wtool input { flex-basis: 100%; }
#wtool .btn { padding: .05em .6em; font-size: .85em; }
#wtool .btn.on { border-style: inset; background: #b8b3cc; }
#wbody { flex: 1; overflow-y: auto; padding: .8em; background: var(--win-light); border: 2px inset var(--win-light); margin: 4px; overscroll-behavior: contain; }
#win.deep #wbody { background: var(--deep); color: var(--deep-ink); border-color: #123236; }
.btn { background: var(--win); border: 2px outset var(--win-light); padding: .2em 1em; cursor: pointer; color: var(--ink); }
.btn:active { border-style: inset; }
.btn[disabled] { color: var(--win-dark); }
.row { display: flex; gap: .5em; flex-wrap: wrap; margin-top: .8em; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { border-bottom: 1px dotted var(--win-dark); padding: .45em .2em; cursor: pointer; display: flex; gap: .6em; align-items: baseline; }
.list li .d { color: var(--dim); font-size: .78em; flex: none; }
.list li.unread { font-weight: bold; }
.list li.gone { color: var(--win-dark); text-decoration: line-through; }
.list li.closed { color: var(--win-dark); }
#win.deep .list li { border-color: #1d4247; }
#win.deep .list li .d { color: #4f7f78; }
.note { color: var(--dim); font-size: .8em; }
#win.deep .note { color: #4f7f78; }
.mail h3 { margin: 0 0 .3em; font-size: 1em; }
.mail .hd { color: var(--dim); font-size: .78em; margin-bottom: .8em; border-bottom: 1px solid var(--win-dark); padding-bottom: .4em; }
.mail p { margin: 0 0 .6em; white-space: pre-wrap; }
.task { background: #fff; border: 2px inset var(--win-light); padding: .4em .6em; margin: .4em 0 .8em; }
.rules li { margin-bottom: .4em; }
.shop li { cursor: default; flex-direction: column; align-items: stretch; }
.sent { color: var(--dim); font-size: .85em; margin-top: .8em; }

/* 夢網の頁（1999 年の個人の頁） */
.yp { margin: -.8em; padding: 1em .9em 1.4em; min-height: calc(100% + 1.6em); word-break: break-word; }
.yp.round { font-family: var(--round); } .yp.mincho { font-family: var(--mincho); } .yp.dot { font-family: var(--dot); }
.yp h2 { text-align: center; margin: .2em 0 .6em; font-size: 1.25em; }
.yp .by { text-align: center; font-size: .78em; opacity: .75; margin-bottom: .6em; }
.yp .marq { overflow: hidden; white-space: nowrap; border-top: 1px dashed currentColor; border-bottom: 1px dashed currentColor; margin: .4em 0 .9em; font-size: .85em; }
.yp .marq span { display: inline-block; padding-left: 100%; animation: marq 16s linear infinite; }
@keyframes marq { to { transform: translateX(-100%); } }
.yp p { margin: 0 0 .8em; white-space: pre-wrap; }
.yp .counter { text-align: center; font-size: .8em; margin: 1em 0; }
.yp .counter b { font-family: var(--dot); background: #000; color: #7fff7f; padding: 0 .3em; letter-spacing: .15em; }
.yp .guest { border-top: 2px groove currentColor; margin-top: 1em; padding-top: .5em; font-size: .9em; }
.yp .guest div { margin: .3em 0; }
.yp .tags { font-size: .78em; opacity: .8; margin-top: 1em; }
.yp .tags button { background: none; border: none; color: inherit; text-decoration: underline; padding: 0 .3em; }
.yp .midi button { display: block; width: 100%; text-align: left; margin: .4em 0; background: rgba(255,255,255,.55); border: 2px outset #fff; color: inherit; padding: .3em .5em; }
.yp a, .yp .lk { color: inherit; }
.gonepage { text-align: center; color: var(--dim); padding: 3em 1em; }
.flagbox { background: #fff; border: 2px inset var(--win-light); padding: .6em; margin-top: .6em; font-size: .9em; }
.zone h3 { margin: .8em 0 .2em; font-size: 1em; }
.banner { background: #000; color: #ffde6f; padding: .4em .6em; font-size: .82em; margin-bottom: .8em; }

/* 回線 */
.dial .disp { background: #0b1a12; color: var(--green); font-size: 1.2em; padding: .3em .6em; min-height: 1.9em; letter-spacing: .1em; border: 2px inset var(--win-light); }
.dial .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4em; margin: .6em 0; }
.dial .keys button { padding: .5em 0; }
.dial .book button { margin: .2em .3em .2em 0; font-size: .85em; }
.tabs { display: flex; gap: .3em; margin-bottom: .6em; }
.tabs .btn.on { border-style: inset; background: #b8b3cc; }
.bbs .post { border-bottom: 1px dotted var(--win-dark); padding: .5em 0; white-space: pre-wrap; }
.bbs .post .m { color: var(--dim); font-size: .78em; }
.bbs .post.nagi { color: #2b5f7a; }
.bbs .post.minamo { color: var(--warn); }
.bbs .file { background: #fff; border: 2px inset var(--win-light); padding: .5em; margin-top: .8em; }
.term { background: #0b1a12; color: var(--green); padding: .6em; min-height: 6em; white-space: pre-wrap; font-size: .85em; }
.prog { height: 10px; border: 2px inset var(--win-light); background: #fff; margin: .4em 0; }
.prog i { display: block; height: 100%; width: 0; background: var(--title); transition: width .3s; }

/* 深層 */
.deep p { margin: 0 0 .8em; white-space: pre-wrap; }
.deep h2 { font-family: var(--mincho); font-weight: 500; font-size: 1.15em; margin: .2em 0 .8em; color: #bfe9e1; }
.deep .ink { color: var(--deep); }
.deep.traced, .deep.traced * { background: rgba(58,110,165,.55); color: #fff; }
.deep .src { font-size: .8em; background: #000; color: #9fd3c7; padding: .6em; white-space: pre-wrap; margin-top: 1em; }
.deep .frag { display: inline-block; margin-top: .6em; background: #0c2a2e; color: #e6fff9; border: 1px solid #5fe0c0; padding: .3em 1em; }
.deep .loading { color: #4f7f78; }
.deep .rev { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px dotted #1d4247; color: var(--deep-ink); padding: .5em .2em; font-family: var(--mincho); }
.face { position: relative; width: 210px; height: 260px; margin: 1.2em auto; border: 2px solid #3d6f68; border-radius: 50% 50% 46% 46%; }
.face button { position: absolute; background: #0c2a2e; border: 2px solid #5fa89c; color: #9fd3c7; }
.face .eye { width: 44px; height: 26px; border-radius: 50%; top: 92px; }
.face .eye.l { left: 38px; } .face .eye.r { right: 38px; }
.face .mouth { width: 70px; height: 10px; left: 70px; top: 190px; border-radius: 4px; }
.frags { letter-spacing: .4em; font-size: 1.3em; text-align: center; margin: .4em 0; font-family: var(--mincho); }
.bottom p { font-family: var(--mincho); }
.bottom .yr { color: #e6fff9; padding-left: 1em; }

/* 画面を伏せる・映り込み・混線 */
#hideov { position: fixed; inset: 0; z-index: 48; background: #000; color: #2f3f3d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4em; text-align: center; padding: 16px; }
#hideov .t { font-size: .85em; min-height: 3.4em; white-space: pre-wrap; }
#hideov button { background: none; border: 1px solid #22302e; color: #4b6360; padding: .5em 1.6em; border-radius: 3px; }
#caught { position: fixed; inset: 0; z-index: 49; background: #020606; color: #cfe9e3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; text-align: center; padding: 16px; font-family: var(--mincho); }
#caught p { margin: 0; opacity: 0; transition: opacity 1.6s; }
#caught p.on { opacity: 1; }
#caught button { margin-top: 1.4em; background: none; border: 1px solid #2c5a5e; color: #8fc9bf; padding: .4em 1.4em; border-radius: 3px; font-family: var(--dot); }
#xt { position: fixed; inset: 0; z-index: 48; background: rgba(2,10,12,.94); color: #bfe9e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; padding: 16px; text-align: center; }
#xt .word { font-family: var(--mincho); font-size: 1.6em; letter-spacing: .3em; }
#xt .grid { display: grid; grid-template-columns: repeat(3, 4em); gap: .5em; }
#xt .grid button { height: 3.4em; background: #0c2a2e; border: 1px solid #2c5a5e; color: #e6fff9; font-size: 1.1em; font-family: var(--mincho); }
#xt .grid button.done { opacity: .25; }
#xt .whisper { color: #4f7f78; font-size: .85em; min-height: 1.6em; }
#xt .time { color: #6fa59c; font-size: .8em; }

#ending { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; text-align: center; color: #e6e0ff; background: #05040c; }
#ending h2 { font-family: var(--mincho); font-weight: 500; letter-spacing: .3em; margin: 0; }
#ending p { margin: 0; max-width: 28em; white-space: pre-wrap; }
#ending .small { color: #6f6a90; font-size: .8em; }
#ending .btns { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
#ending button, #ending a { background: none; border: 1px solid #4b3f8a; color: #cfc8ff; padding: .4em 1.2em; border-radius: 3px; text-decoration: none; font-size: .9em; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.box { max-width: 460px; width: 100%; background: #1a1f1d; color: #eef2f0; border: 1px solid #d9b25f; border-radius: 6px; padding: 1.2em;
  font-family: system-ui, sans-serif; line-height: 1.7; }
.box p { margin: 0 0 .8em; }
.box .row button { background: none; border: 1px solid #555; color: #eee; border-radius: 4px; padding: .4em 1em; }
@media (prefers-reduced-motion: reduce) { .icon.new .g, .yp .marq span { animation: none; } .yp .marq span { padding-left: 0; } }
</style>
</head>
<body>
<div id="power" class="full">
  <h1>夢網 保存会</h1>
  <p>1999 年の大晦日に終わった、眠っているあいだにつなぐネット「夢網」。その写しを公開する前に、巡回員として頁を一つずつ確かめてください。</p>
  <p>（作り話のホラーです。水の音がしたら、画面を伏せてください。イヤホン推奨。）</p>
  <input id="name" type="text" maxlength="12" autocomplete="off" placeholder="巡回員の名前">
  <button id="poweron" type="button">巡回を始める</button>
  <a href="./">ミナモ（面接アプリ）に戻る</a>
  <a href="archive.html">記録庫（物語その一）へ</a>
</div>
<div id="boot" class="full" hidden></div>

<div id="desk" hidden>
  <div id="bar"><span class="os">Y-NET 99</span><span class="pts" id="pts"></span><button id="facedown" type="button" hidden>伏せる</button><span class="clock" id="clock"></span></div>
  <div id="icons"></div>
</div>
<div id="win" hidden>
  <div id="wbar"><span id="wtitle"></span></div>
  <div id="wbody"></div>
  <div id="wfoot"><div id="wtool"></div><button id="wclose" type="button" aria-label="閉じる">×</button></div>
</div>
<div id="warn" hidden></div>
<div id="dread"></div>
<div id="hideov" hidden><div class="t" id="hidetext"></div><button id="lift" type="button">画面を起こす</button></div>
<div id="caught" hidden></div>
<div id="xt" hidden></div>
<div id="toast"></div>
<div id="ending" class="full" hidden></div>

<div id="crisis" class="overlay" hidden>
  <div class="box">
    <p><b>ここで、いったん物語を止めます。</b></p>
    <p>これは作り話のホラーです。</p>
    <p>もし今、本当につらい気持ちがあるなら、身近な人や、いのちの電話・よりそいホットラインなどの相談窓口に話してみてください。</p>
    <div class="row"><button id="crisis-stop" type="button">ここでやめる</button><button id="crisis-go" type="button">続ける</button></div>
  </div>
</div>

<script src="fx.js"></script>
<script src="minasoko-data.js"></script>
<script src="minasoko.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
</body>
</html>
