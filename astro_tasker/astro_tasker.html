<style>
:root{
  --bg:#01030c;--bg2:#030612;--bg3:#040918;
  --border:rgba(30,65,130,0.4);
  --sun:#ffd040;--moon:#ccdcf4;--blue:#5ec0ff;
  --green:#22e888;--txtbr:#ddeeff;--txt:#8aaccc;--dim:#3a5070;
  --above:#5ec0ff;--below:#070912;
  --mercury:#aab0c4;--venus:#f0dc58;--mars:#e05828;
  --jupiter:#e0a455;--saturn:#d4c46a;--uranus:#48d8d8;--neptune:#3858f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Rajdhani','Noto Sans JP',sans-serif;font-size:14px;color:var(--txt);overflow-x:hidden}

canvas#sf{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 0 50px}

/* ─── HEADER ─── */
.hdr{text-align:center;padding:10px 8px 6px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#02060f,transparent)}
.clock{font-family:'Orbitron',monospace;font-size:30px;font-weight:900;letter-spacing:4px;color:var(--txtbr);text-shadow:0 0 28px rgba(60,130,255,0.55)}
.dateline{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:2px}
.locline{font-size:12px;color:var(--dim);margin-top:3px;display:flex;align-items:center;justify-content:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite;display:inline-block;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

/* ─── STATUS ─── */
#status-bar{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;color:#1e3868;padding:3px 10px;border-bottom:1px solid var(--border);background:rgba(1,3,12,0.85);display:flex;justify-content:space-between}

/* ─── COMPASS WRAPPER ─── */
#cw{
  position:relative;width:100%;overflow:hidden;
  cursor:grab;user-select:none;touch-action:none;
  border-bottom:2px solid rgba(40,90,200,0.3);
  background:#01030c;
}
#cw:active{cursor:grabbing}
/* Single canvas (bg offscreen-blitted + bodies in one pass) */
#cc-main{position:absolute;top:0;left:0;display:block;transform-origin:center center;z-index:1}
/* center reticle */
#cw::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;z-index:3;
  background:linear-gradient(180deg,transparent,rgba(90,180,255,0.18) 32%,rgba(90,180,255,0.52) 55%,rgba(90,180,255,0.06) 70%,transparent);pointer-events:none}

/* Compass controls */
#compass-bar{position:absolute;bottom:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:linear-gradient(0deg,rgba(1,3,12,0.75),transparent);pointer-events:none}
#compass-bearing{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:rgba(100,190,255,0.95);letter-spacing:2px;background:rgba(1,4,18,0.8);padding:2px 8px;border-radius:3px;pointer-events:none;white-space:nowrap;border:1px solid rgba(40,90,180,0.35)}

.cbtn{pointer-events:all;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:1px;padding:4px 9px;border-radius:4px;border:1px solid rgba(40,100,200,0.55);background:rgba(4,12,50,0.9);color:rgba(80,160,230,0.85);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;margin-left:5px}
.cbtn.on{border-color:rgba(30,220,100,0.65);color:rgba(40,220,110,1.0);background:rgba(4,35,15,0.9);box-shadow:0 0 10px rgba(30,200,80,0.2)}
.cbtn.vr-on{border-color:rgba(200,100,255,0.7);color:rgba(210,120,255,1.0);background:rgba(25,5,50,0.9);box-shadow:0 0 12px rgba(180,80,255,0.25)}

#btns{display:flex;align-items:center}

/* VR FULLSCREEN OVERLAY */
#vr-overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:#000;
  flex-direction:column;
  align-items:stretch;
  justify-content:stretch;
}
#vr-overlay.active{display:flex}
#vr-canvas-wrap{
  position:relative;flex:1;overflow:hidden;
  touch-action:none;user-select:none;cursor:grab;
  background:#01030c;
  will-change:contents;
  transform:translateZ(0);
}
#vr-canvas-wrap:active{cursor:grabbing}
#vrc-main{position:absolute;top:0;left:0;display:block;transform-origin:center center;z-index:1}
#vr-canvas-wrap::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;z-index:3;background:linear-gradient(180deg,transparent,rgba(90,180,255,0.2) 35%,rgba(90,180,255,0.6) 50%,rgba(90,180,255,0.08) 68%,transparent);pointer-events:none}
#vr-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,0.8),transparent);
  pointer-events:none;
}
#vr-bearing{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:rgba(120,200,255,0.95);letter-spacing:3px;pointer-events:none}
#vr-sub{font-family:'Orbitron',monospace;font-size:9px;color:rgba(110,160,220,0.75);letter-spacing:1px;margin-top:2px;pointer-events:none;white-space:nowrap}
#vr-btns{display:flex;gap:6px}
#vr-close,#vr-sensor-btn{pointer-events:all}

/* RESIZE HANDLE */
#rh{width:100%;height:20px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;background:rgba(3,8,22,0.85);border-bottom:1px solid var(--border);touch-action:none;user-select:none}
#rh::before{content:'';display:block;width:38px;height:3px;border-radius:2px;background:rgba(50,100,200,0.4)}

/* ─── SECTIONS ─── */
section{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:11px 12px;margin-bottom:7px}
.sec-head{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
.sec-icon{font-size:16px}
.sun-h{color:var(--sun)}.moon-h{color:var(--moon)}.plan-h{color:var(--blue)}.star-h{color:#eeeeaa}

/* BADGE */
.badge{display:inline-block;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:3px;border:1px solid rgba(45,90,170,0.6);background:rgba(8,18,60,0.85);color:var(--blue)}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cell{display:flex;flex-direction:column}
.cell-lbl{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.cell-val{font-family:'Orbitron',monospace;font-size:15px;font-weight:700}
.val-sun{color:var(--sun)}.val-moon{color:var(--moon)}

/* RTS */
.rts{display:flex;justify-content:space-around;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 2px;margin:6px 0;text-align:center}
.rts-lbl{font-size:10px;color:var(--dim);letter-spacing:.5px}
.rts-val{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--txtbr)}

/* POS */
.pos-row{font-size:12px;color:var(--dim);margin-top:5px;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap}
.pos-lbl{color:#253050;min-width:28px;flex-shrink:0}
.const-str{color:#4a9855;font-size:12px;font-weight:700}
.arrow{color:#384060}

/* ARC ORBIT CANVAS */
#arc-canvas{display:block;width:100%;border-radius:4px;margin-bottom:8px}

/* MOON LAYOUT */
.moon-layout{display:flex;gap:12px;align-items:flex-start}
.moon-left{flex-shrink:0}
.moon-right{flex:1;min-width:0}
.moon-age-num{font-family:'Orbitron',monospace;font-size:21px;font-weight:900;color:var(--txtbr);line-height:1}
.moon-age-lbl{font-size:10px;color:var(--dim);letter-spacing:1px}
.moon-phase-jp{font-size:15px;font-weight:700;color:var(--moon);margin-top:3px}
.moon-phase-en{font-size:10px;color:var(--dim);letter-spacing:.5px}

/* BODY ROWS */
.body-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 4px;border-bottom:1px solid rgba(18,32,75,0.55);align-items:center}
.body-row:last-child{border-bottom:none}
.body-row.above{background:rgba(6,16,50,0.35)}
.body-row.above .body-name-jp{color:var(--blue)!important}
.body-row.above .body-name-en{color:#3060a0}
.body-row.above .body-const{color:#305840}
.body-row.above .badge{border-color:rgba(45,105,210,0.6);color:var(--blue)}
.body-row.below{background:var(--below)}
.body-row.below *{color:#111620!important;border-color:#0c0e16!important;background:transparent!important}
.body-name-jp{font-size:15px;font-weight:700;line-height:1.2}
.body-name-en{font-size:10px;letter-spacing:.5px;margin-top:1px}
.body-const{font-size:10px;margin-top:1px}
.body-right{text-align:right;flex-shrink:0}
.body-dir{margin-bottom:2px}
.body-alt{font-family:'Orbitron',monospace;font-size:11px;font-weight:700}
.alt-above{color:var(--green)}.alt-below{color:#111620}

/* Planet colors */
.above .mercury{color:var(--mercury)!important}.above .venus{color:var(--venus)!important}
.above .mars{color:var(--mars)!important}.above .jupiter{color:var(--jupiter)!important}
.above .saturn{color:var(--saturn)!important}.above .uranus{color:var(--uranus)!important}
.above .neptune{color:var(--neptune)!important}.above .star1{color:#eeeaaa!important}

.loading-msg{text-align:center;color:#182040;padding:12px;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px}
</style>

<script>
/* ══════════════════════════════════════
   STARFIELD
══════════════════════════════════════ */
(function(){
  var c=document.getElementById('sf');
  if(!c)return;
  var ctx=c.getContext('2d');
  if(!ctx)return;
  function draw(){
    c.width=innerWidth;c.height=innerHeight;ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<160;i++){
      var a=(Math.random()*.38+.06).toFixed(2);
      ctx.beginPath();ctx.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.2+.15,0,6.28);
      ctx.fillStyle='rgba(130,175,255,'+a+')';ctx.fill();
    }
  }
  draw();window.addEventListener('resize',draw);
})();

/* ══════════════════════════════════════
   ASTRONOMY
══════════════════════════════════════ */
var D2R=Math.PI/180, R2D=180/Math.PI;
let LAT=34.6037, LON=135.6842, LOC_READY=false;
const TZ=-new Date().getTimezoneOffset()/60;
let cachedBodies=[], nextUpdateTime=0;
const UPD=60*60*1000;

function norm(a,b=360){return((a%b)+b)%b}
function getJD(d=new Date()){return d.getTime()/86400000+2440587.5}
function getT(jd){return(jd-2451545)/36525}
function getGST(jd){const T=getT(jd);return norm(280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T-T*T*T/38710000)}
function getLST(jd,lon){return norm(getGST(jd)+lon)}
function getObl(T){return 23.439291111-.013004167*T-1.64e-7*T*T+5.04e-7*T*T*T+.00256*Math.cos(norm(125.04452-1934.136261*T)*D2R)}
function ecl2eq(lam,bet,eps){
  const lr=lam*D2R,br=bet*D2R,er=eps*D2R;
  return{ra:norm(Math.atan2(Math.sin(lr)*Math.cos(er)-Math.tan(br)*Math.sin(er),Math.cos(lr))*R2D),
         dec:Math.asin(Math.sin(br)*Math.cos(er)+Math.cos(br)*Math.sin(er)*Math.sin(lr))*R2D};
}
/* 赤道座標 → 地平座標。東・北・天頂の成分から atan2 で方位を出す
   （acos 方式は真北・真南の付近で数分角ずれるため） */
function eq2hor(ra,dec,l,lat){
  const Hr=(l-ra)*D2R,dr=dec*D2R,lr=lat*D2R;
  const cd=Math.cos(dr),sd=Math.sin(dr),cl=Math.cos(lr),sl=Math.sin(lr),cH=Math.cos(Hr);
  const E=-cd*Math.sin(Hr),N=sd*cl-cd*cH*sl,U=sd*sl+cd*cH*cl;
  return{alt:Math.asin(Math.max(-1,Math.min(1,U)))*R2D,az:norm(Math.atan2(E,N)*R2D)};
}
/* 歳差: J2000.0 の赤経・赤緯 → 観測日の平均分点（Meeus 21章） */
function precess(ra,dec,jd){
  const t=(jd-2451545)/36525,as=1/3600;
  const zeta=(2306.2181*t+.30188*t*t+.017998*t*t*t)*as;
  const z=(2306.2181*t+1.09468*t*t+.018203*t*t*t)*as;
  const th=(2004.3109*t-.42665*t*t-.041833*t*t*t)*as*D2R;
  const a=(ra+zeta)*D2R,d=dec*D2R;
  const A=Math.cos(d)*Math.sin(a);
  const B=Math.cos(th)*Math.cos(d)*Math.cos(a)-Math.sin(th)*Math.sin(d);
  const C=Math.sin(th)*Math.cos(d)*Math.cos(a)+Math.cos(th)*Math.sin(d);
  return{ra:norm(Math.atan2(A,B)*R2D+z),dec:Math.asin(Math.max(-1,Math.min(1,C)))*R2D};
}
/* 大気差（見かけの高度 − 真の高度、度）。Sæmundsson の式。
   空の表示（VR・コンパス）だけに使う。地平線の下ではなめらかに 0 にする */
function refraction(alt){
  if(alt<-3) return 0;
  const h=Math.max(alt,-1);
  const R=1.02/Math.tan((h+10.3/(h+5.11))*D2R)/60;
  return alt>=-1?R:R*(alt+3)/2;
}
const C16E=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const C16J=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
function az2c(az){const i=Math.round(norm(az)/22.5)%16;return{en:C16E[i],jp:C16J[i]}}
const Z13=[
  {s:0,e:25.77,en:'Pisces',jp:'うお座'},{s:25.77,e:53.41,en:'Aries',jp:'おひつじ座'},
  {s:53.41,e:90.45,en:'Taurus',jp:'おうし座'},{s:90.45,e:118.23,en:'Gemini',jp:'ふたご座'},
  {s:118.23,e:138.16,en:'Cancer',jp:'かに座'},{s:138.16,e:174.03,en:'Leo',jp:'しし座'},
  {s:174.03,e:217.81,en:'Virgo',jp:'おとめ座'},{s:217.81,e:241.55,en:'Libra',jp:'てんびん座'},
  {s:241.55,e:247.68,en:'Scorpius',jp:'さそり座'},{s:247.68,e:266.38,en:'Ophiuchus',jp:'へびつかい座'},
  {s:266.38,e:299.71,en:'Sagittarius',jp:'いて座'},{s:299.71,e:327.59,en:'Capricornus',jp:'やぎ座'},
  {s:327.59,e:351.65,en:'Aquarius',jp:'みずがめ座'},{s:351.65,e:360,en:'Pisces',jp:'うお座'},
];
function zodiac(l){const ll=norm(l);for(const z of Z13)if(ll>=z.s&&ll<z.e)return z;return Z13[0]}

/* ── Sun ── */
function getSun(jd){
  const T=getT(jd),L0=norm(280.46646+36000.76983*T+.0003032*T*T);
  const M=norm(357.52911+35999.05029*T-.0001537*T*T),Mr=M*D2R;
  const C=(1.914602-.004817*T-.000014*T*T)*Math.sin(Mr)+(0.019993-.000101*T)*Math.sin(2*Mr)+.000289*Math.sin(3*Mr);

    +.053322*Math.sin((2*D+M1)*D2R)+.045758*Math.sin((2*D-M)*D2R)

    +.010034*Math.sin(3*M1R)+.008548*Math.sin((4*D-2*M1)*D2R)
    -.007888*Math.sin((2*D+M-M1)*D2R)-.006766*Math.sin((2*D+M)*D2R)
    -.005163*Math.sin((D-M1)*D2R)+.004987*Math.sin((M+D)*D2R)
    +.004036*Math.sin((2*D-M+M1)*D2R)+.003994*Math.sin((2*D+2*M1)*D2R)
    +.003861*Math.sin(4*DR)+.003665*Math.sin((2*D-3*M1)*D2R)

function kxyz(a,e,i,O,w,M){
  const E=sk(M,e),v=2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
  const r=a*(1-e*Math.cos(E)),u=v+(w-O)*D2R,Or=O*D2R,ir=i*D2R;
  return{x:r*(Math.cos(Or)*Math.cos(u)-Math.sin(Or)*Math.sin(u)*Math.cos(ir)),

function helio(o,T){
  const k=i=>o.el[i]+o.rt[i]*T;

  /* 光が届くまでの時間だけ前の位置にする */
  p=helio(pl,T-dist*.0057755183/36525);
  x=p.x-E.x;y=p.y-E.y;z=p.z-E.z;dist=Math.sqrt(x*x+y*y+z*z);
  const lam=norm(Math.atan2(y,x)*R2D),bet=Math.asin(z/dist)*R2D;

/* ── RST ── */
function getRST(ra,dec,jd,lat,lon,h0){
  if(h0===undefined)h0=-.8333;
  const jd0=Math.floor(jd-.5)+.5,th0=getGST(jd0),m0=norm(ra-lon-th0)/360;
  const cH=(Math.sin(h0*D2R)-Math.sin(lat*D2R)*Math.sin(dec*D2R))/(Math.cos(lat*D2R)*Math.cos(dec*D2R));
  const toL=f=>norm(f*24+TZ,24);
  if(cH<-1)return{rise:null,transit:toL(m0),set:null};
  if(cH>1) return{rise:null,transit:toL(m0),set:null};
  const H0=Math.acos(cH)*R2D/360;
  function ref(m){
    const l=getLST(jd0+m,lon),{alt}=eq2hor(ra,dec,l,lat);
    const dH=(alt-h0)/(360*Math.cos(dec*D2R)*Math.cos(lat*D2R)*Math.sin(((l-ra+360)%360)*D2R)+1e-9);
    return norm(m+dH/24,1);
  }
  return{rise:toL(ref(norm(m0-H0,1))),transit:toL(norm(m0,1)),set:toL(ref(norm(m0+H0,1)))};
}
function fmt(h){if(h===null||h===undefined)return'—:—';h=((h%24)+24)%24;return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0')}

/* ── Moon canvas ── */
function drawMoonCanvas(cv,phase){
  var dpr=window.devicePixelRatio||1;
  var CSS=cv.offsetWidth||72;
  cv.width=CSS*dpr; cv.height=CSS*dpr;
  cv.style.width=CSS+'px'; cv.style.height=CSS+'px';
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var W=CSS,H=CSS,cx=W/2,cy=H/2,r=Math.min(cx,cy)-2;
  ctx.clearRect(0,0,W,H);

  /* 影側（暗め灰）で円全体を塗る */
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#252830'; ctx.fill();

  /* 光っている側をclip内で描く */
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();

  /* lit: 0=新月, 1=満月 */
  var lit=phase<=0.5?phase*2:(1-phase)*2;
  /* 楕円のx半径: lit=0→r（細い三日月端）, lit=0.5→0（半月）, lit=1→r（反対端） */
  var ex=r*(1-2*lit); /* 正=光側に張り出す, 負=光側に凹む */

  ctx.beginPath();
  if(phase<0.5){
    /* 上弦方向（waxing）: 右側が光る
       右半円 = top→bottom clockwise（false）、右側を通る */
    ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2,false);
    /* 楕円でクレセント形成: ex>0なら右に張り出し三日月、ex<0なら左に引っ込み半月超 */
    ctx.ellipse(cx,cy,Math.abs(ex),r,0,Math.PI/2,-Math.PI/2,ex>0);
  } else {
    /* 下弦方向（waning）: 左側が光る
       左半円 = top→bottom counterclockwise（true）、左側を通る */
    ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2,true);
    /* 楕円でクレセント形成 */
    ctx.ellipse(cx,cy,Math.abs(ex),r,0,Math.PI/2,-Math.PI/2,ex<=0);
  }
  ctx.closePath();
  ctx.fillStyle='#a4a8ae'; ctx.fill();
  ctx.restore();

  /* 縁 */
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,185,220,0.35)'; ctx.lineWidth=1.2; ctx.stroke();
}

let compassCenter=180;   /* 画面中央の方位（度） */

function focalPx(){return R2D/degPerPx();}   /* 画面中央での 1ラジアンあたりのピクセル数 */

function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.sqrt(vdot(a,a));}
function vunit(a){const l=vlen(a);return l>1e-9?[a[0]/l,a[1]/l,a[2]/l]:a;}

function azAltVec(az,alt){
  const a=az*D2R,h=alt*D2R,ch=Math.cos(h);
  return[ch*Math.sin(a),ch*Math.cos(a),Math.sin(h)];
}
/* 方位・高度だけで決める視線（ドラッグ操作用。画面は傾けない） */
function camFromAzAlt(az,alt){
  const a=az*D2R,h=alt*D2R,ca=Math.cos(a),sa=Math.sin(a),ch=Math.cos(h),sh=Math.sin(h);
  return{f:[ch*sa,ch*ca,sh],r:[ca,-sa,0],u:[-sh*sa,-sh*ca,ch]};
}
function curCam(){return(sensorMode&&SENS.cam)?SENS.cam:camFromAzAlt(compassCenter,tiltCenter);}

/* 世界のベクトル → カメラ座標 [右, 上, 奥] */
function toCam(v){
  const c=CAM;
  return[v[0]*c.r[0]+v[1]*c.r[1]+v[2]*c.r[2],
         v[0]*c.u[0]+v[1]*c.u[1]+v[2]*c.u[2],
         v[0]*c.f[0]+v[1]*c.f[1]+v[2]*c.f[2]];
}
const ZNEAR=0.02;   /* 視線から約89°より後ろは描かない */
function camToScreen(p,W,H){
  const F=focalPx();
  return{x:W/2+p[0]/p[2]*F,y:H/2-p[1]/p[2]*F};
}
function project(az,alt,W,H){
  const p=toCam(azAltVec(az,alt));
  return p[2]>ZNEAR?camToScreen(p,W,H):null;
}
/* 天体は大気差で浮き上がった位置（見かけの位置）に描く */
function projectApparent(az,alt,W,H){return project(az,alt+refraction(alt),W,H);}

/* カメラ座標の点列を線でつなぐ。視線の後ろに回る区間は手前で切る */
function cut3(a,b){
  const t=(ZNEAR-a[2])/(b[2]-a[2]);
  return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,ZNEAR];
}
function pathCam(ctx,pts,W,H,closed){
  const n=pts.length,m=closed?n:n-1;
  let pen=false;
  ctx.beginPath();
  for(let i=0;i<m;i++){
    let a=pts[i],b=pts[(i+1)%n];
    const ina=a[2]>ZNEAR,inb=b[2]>ZNEAR;
    if(!ina&&!inb){pen=false;continue;}
    if(!ina){a=cut3(a,b);pen=false;}
    else if(!inb){b=cut3(a,b);}
    if(!pen){const s=camToScreen(a,W,H);ctx.moveTo(s.x,s.y);pen=true;}
    const s=camToScreen(b,W,H);ctx.lineTo(s.x,s.y);
    if(!inb)pen=false;
  }
}
function circlePts(alt,step){
  const pts=[];
  for(let az=0;az<360;az+=step)pts.push(toCam(azAltVec(az,alt)));
  return pts;
}
function meridianPts(az,step){
  const pts=[];
  for(let h=-90;h<=90;h+=step)pts.push(toCam(azAltVec(az,h)));
  return pts;
}
/* 線の上で、画面内のいちばん左の点（目盛りの数字を置く場所） */
function leftmostOnScreen(pts,W,H){
  let best=null;
  for(const p of pts){
    if(p[2]<=ZNEAR)continue;
    const s=camToScreen(p,W,H);
    if(s.x<0||s.x>W||s.y<10||s.y>H-4)continue;
    if(!best||s.x<best.x)best=s;
  }
  return best;
}
/* 凸多角形を「s(p)>=0 の側」で切り取る */
function clipHalf(poly,s){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],sa=s(a),sb=s(b);
    if(sa>=0)out.push(a);
    if((sa>=0)!==(sb>=0)){const t=sa/(sa-sb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  }
  return out;
}

const DIRS=[
  {az:0,s:'N',t:2},{az:22.5,s:'NNE',t:0},{az:45,s:'NE',t:1},{az:67.5,s:'ENE',t:0},
  {az:90,s:'E',t:2},{az:112.5,s:'ESE',t:0},{az:135,s:'SE',t:1},{az:157.5,s:'SSE',t:0},
  {az:180,s:'S',t:2},{az:202.5,s:'SSW',t:0},{az:225,s:'SW',t:1},{az:247.5,s:'WSW',t:0},
  {az:270,s:'W',t:2},{az:292.5,s:'WNW',t:0},{az:315,s:'NW',t:1},{az:337.5,s:'NNW',t:0},
];
const ALT_CIRCLES=[-75,-60,-45,-30,-15,15,30,45,60,75];

let cachedEcliptic=[];
let cachedZodiac=[];

/* ══════════════════════════════════════
   RENDERER  —  Single canvas per view
   描画は 30fps まで。VR を開いている間は VR だけ描く
══════════════════════════════════════ */
let bgDirty=true;
let frameDirty=true;
let lastFrameT=-9999;            // 初回フレームを確実に描画させる
const FRAME_MS=1000/30;

function setDirty(){bgDirty=true;frameDirty=true;}

/* ── 背景: 空と地面・高度線・方位線・地平線 ── */
function drawBG(ctx,W,H){
  const c=CAM,F=focalPx(),L=Math.max(W,H);
  /* 画面の点(x,y)を通る視線の「天頂向きの成分」。正なら空、負なら地面。x,y の1次式 */
  const g=(x,y)=>c.f[2]+(x-W/2)/F*c.r[2]-(y-H/2)/F*c.u[2];

  ctx.fillStyle='#010614'; ctx.fillRect(0,0,W,H);
  const gx=c.r[2]/F,gy=-c.u[2]/F,gl=Math.hypot(gx,gy);
  if(gl*F>1e-4){
    const ux=gx/gl,uy=gy/gl;               /* 画面上で「空の高い方」へ向かう向き */
    const t0=-g(W/2,H/2)/gl;
    const hx=W/2+ux*t0,hy=H/2+uy*t0;       /* 地平線上で画面中央にいちばん近い点 */
    const span=Math.max(F*Math.PI/2,L*.5);
    const sg=ctx.createLinearGradient(hx,hy,hx+ux*span,hy+uy*span);
    sg.addColorStop(0,'#0c2058');sg.addColorStop(.45,'#081a3c');sg.addColorStop(1,'#010614');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    const poly=clipHalf([[0,0],[W,0],[W,H],[0,H]],p=>-g(p[0],p[1]));
    if(poly.length>=3){
      const ug=ctx.createLinearGradient(hx,hy,hx-ux*span*.7,hy-uy*span*.7);
      ug.addColorStop(0,'#0a100a');ug.addColorStop(.4,'#060a06');ug.addColorStop(1,'#020405');
      ctx.fillStyle=ug;
      ctx.beginPath(); poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill();
    }
  } else if(c.f[2]<0){
    ctx.fillStyle='#020405'; ctx.fillRect(0,0,W,H);
  }

  ctx.font='7px Orbitron,monospace'; ctx.textAlign='left';
  ctx.setLineDash([3,7]);
  /* 高度線（15°ごと） */
  for(const a of ALT_CIRCLES){
    const pts=circlePts(a,4),major=Math.abs(a)%30===0,above=a>0;
    ctx.strokeStyle=above?('rgba(30,70,155,'+(major?.28:.11)+')'):('rgba(20,55,20,'+(major?.22:.09)+')');
    ctx.lineWidth=major?.9:.5;
    pathCam(ctx,pts,W,H,true); ctx.stroke();
    const lp=leftmostOnScreen(pts,W,H);
    if(lp){
      ctx.fillStyle=above?'rgba(35,75,140,0.5)':'rgba(30,65,30,0.45)';
      ctx.fillText(a+'°',Math.max(3,lp.x+3),lp.y-2);
    }
  }
  /* 方位線（45°ごと。天頂と天底で1点に集まる） */
  for(let az=0;az<360;az+=45){
    const main=az%90===0;
    ctx.strokeStyle=main?'rgba(50,110,210,0.30)':'rgba(40,90,170,0.16)';
    ctx.lineWidth=main?.8:.5;
    pathCam(ctx,meridianPts(az,3),W,H,false); ctx.stroke();
  }
  ctx.setLineDash([]);

  /* 地平線 */
  const hp=circlePts(0,2);
  ctx.strokeStyle='rgba(55,120,250,0.7)'; ctx.lineWidth=1.5;
  pathCam(ctx,hp,W,H,true); ctx.stroke();
  const hl=leftmostOnScreen(hp,W,H);
  if(hl){ctx.fillStyle='rgba(55,120,250,0.4)';ctx.fillText('HORIZON  0°',Math.max(4,hl.x+4),hl.y-3);}

  /* 天頂・天底 */
  [[90,'ZENITH  +90°','rgba(40,80,150,0.55)'],[-90,'NADIR  −90°','rgba(30,70,30,0.45)']].forEach(z=>{
    const p=project(0,z[0],W,H);
    if(!p||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)return;
    ctx.strokeStyle=z[2]; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(p.x-5,p.y); ctx.lineTo(p.x+5,p.y); ctx.moveTo(p.x,p.y-5); ctx.lineTo(p.x,p.y+5); ctx.stroke();
    ctx.fillStyle=z[2]; ctx.fillText(z[1],p.x+7,p.y+10);
  });
}

/* ── 方位の文字（地平線の上。地平線が画面の外なら、その方位の線が画面に入るところ） ── */
function drawDirs(ctx,W,H,isVR){
  ctx.textAlign='center';
  const yMax=H-(isVR?64:30);   /* 下のボタン帯に隠れない高さ */
  for(const d of DIRS){
    const hc=toCam(azAltVec(d.az,0));
    if(hc[2]<=ZNEAR)continue;
    const p=camToScreen(hc,W,H);
    let x,y,onHorizon=true;
    if(p.x>-22&&p.x<W+22&&p.y>-20&&p.y<H+20){
      x=p.x; y=Math.max(8,Math.min(H-18,p.y));
    } else {
      if(d.t<1)continue;
      /* その方位の線のうち、画面に入っているいちばん低い点 */
      let best=null;
      for(let h=2;h<=80&&!best;h+=2){
        const q=project(d.az,h,W,H);
        if(q&&q.x>=10&&q.x<=W-10&&q.y>=14&&q.y<=yMax)best=q;
      }
      if(!best)continue;
      x=best.x; y=best.y-14; onHorizon=false;
    }
    if(d.t===2){
      ctx.fillStyle='rgba(105,195,255,0.95)'; ctx.font='bold '+(isVR?14:12)+'px Orbitron,monospace';
      ctx.fillText(d.s,x,y+16);
      if(onHorizon){
        ctx.strokeStyle='rgba(90,180,255,0.7)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+8); ctx.stroke();
      }
    } else if(d.t===1){
      ctx.fillStyle='rgba(60,130,210,0.6)'; ctx.font=(isVR?11:9)+'px Orbitron,monospace';
      ctx.fillText(d.s,x,y+13);
    } else {
      ctx.fillStyle='rgba(38,88,155,0.4)'; ctx.font=(isVR?9:7)+'px Orbitron,monospace';
      ctx.fillText(d.s,x,y+11);
    }
  }
  ctx.textAlign='left';
}

/* ── フレーム全描画（BG+天体 → 単一canvas） ── */
function drawFrame(ctx,W,H,bodies,isVR){
  CAM=curCam();
  drawBG(ctx,W,H);
  drawDirs(ctx,W,H,isVR);

  const margin=isVR?120:80;
  const fontSize=isVR?12:9;

  /* チルトインジケーター */
  {
    const bx=W-14,bw=6,barT=8,barB=H-8,barH=barB-barT;
    const a2b=a=>barB-(a+90)/180*barH;
    ctx.fillStyle='rgba(20,35,70,0.5)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx-1,barT,bw+2,barH,3);
    else ctx.rect(bx-1,barT,bw+2,barH);
    ctx.fill();
    ctx.fillStyle='rgba(20,50,120,0.55)'; ctx.fillRect(bx,a2b(90),bw,a2b(0)-a2b(90));
    ctx.fillStyle='rgba(15,40,15,0.55)';  ctx.fillRect(bx,a2b(0),bw,a2b(-90)-a2b(0));
    ctx.strokeStyle='rgba(60,120,240,0.65)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bx-2,a2b(0)); ctx.lineTo(bx+bw+2,a2b(0)); ctx.stroke();
    const ty=a2b(tiltCenter);
    ctx.fillStyle='rgba(120,210,255,0.92)';
    ctx.beginPath(); ctx.moveTo(bx-4,ty); ctx.lineTo(bx,ty-4); ctx.lineTo(bx,ty+4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(90,170,230,0.7)'; ctx.font='7px Orbitron,monospace'; ctx.textAlign='right';
    ctx.fillText((tiltCenter>=0?'+':'')+Math.round(tiltCenter)+'°',W-18,ty+3);
    ctx.textAlign='left';
  }

  /* 黄道線 */
  if(cachedEcliptic.length>0){
    ctx.strokeStyle='rgba(255,200,50,0.26)'; ctx.lineWidth=isVR?1.8:1.2;
    ctx.setLineDash([4,5]);
    pathCam(ctx,cachedEcliptic.map(pt=>toCam(azAltVec(pt.az,pt.alt+refraction(pt.alt)))),W,H,true);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* 黄道星座マーカー */
  if(cachedZodiac.length>0){
    const sr=isVR?8:6, sf=isVR?14:11, lf=isVR?10:8;
    for(const z of cachedZodiac){
      const p=projectApparent(z.az,z.alt,W,H);
      if(!p||p.x<-margin||p.x>W+margin||p.y<-margin||p.y>H+margin) continue;
      ctx.globalAlpha=.78;
      ctx.fillStyle='rgba(255,195,40,0.16)'; ctx.beginPath(); ctx.arc(p.x,p.y,sr,0,6.28); ctx.fill();
      ctx.strokeStyle='rgba(255,200,60,0.5)'; ctx.lineWidth=.8; ctx.beginPath(); ctx.arc(p.x,p.y,sr,0,6.28); ctx.stroke();
      ctx.textAlign='center';
      ctx.font=sf+'px serif'; ctx.fillStyle='rgba(255,210,80,0.88)'; ctx.fillText(z.sym,p.x,p.y+4);
      ctx.font=lf+'px Orbitron,monospace'; ctx.fillStyle='rgba(230,185,50,0.6)'; ctx.fillText(z.en,p.x,p.y+(isVR?20:16));
      ctx.globalAlpha=1;
    }
    ctx.textAlign='left';
  }

  /* 星型パスを描く共通ヘルパー (5角星) */
  function starPath(cx,cy,outer,inner){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=Math.PI/2+i*Math.PI/5;
      const r=i%2===0?outer:inner;
      i===0?ctx.moveTo(cx+r*Math.cos(a),cy-r*Math.sin(a))
           :ctx.lineTo(cx+r*Math.cos(a),cy-r*Math.sin(a));
    }
    ctx.closePath();
  }

  /* 天体プロット */
  for(const b of bodies){
    const p=projectApparent(b.az,b.alt,W,H);
    if(!p||p.x<-margin||p.x>W+margin||p.y<-margin||p.y>H+margin) continue;
    const x=p.x, y=p.y;
    const above=b.alt>=-0.5;
    const label=isVR?b.enLabel:b.label;
    const dotR=isVR?b.r*1.35:b.r;
    const isStar=b.type==='star';
    ctx.save();
    ctx.globalAlpha=above?1:.55;
    if(b.r>=5){
      const g=ctx.createRadialGradient(x,y,0,x,y,dotR*3.5);
      g.addColorStop(0,b.glow||'rgba(90,180,255,0.1)'); g.addColorStop(1,'rgba(0,0,0,0.0)');
      ctx.fillStyle=g; ctx.fillRect(x-dotR*4,y-dotR*4,dotR*8,dotR*8);
    }
    if(isStar){
      const sr=dotR*2.2;
      const sg=ctx.createRadialGradient(x,y,0,x,y,sr);
      sg.addColorStop(0,'rgba(235,235,180,0.18)'); sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg; ctx.fillRect(x-sr,y-sr,sr*2,sr*2);
      starPath(x,y,dotR*1.5,dotR*0.62);
      ctx.fillStyle=above?b.color:'rgba(80,80,60,0.5)'; ctx.fill();
      ctx.strokeStyle=above?b.rim:'rgba(70,80,100,0.3)'; ctx.lineWidth=0.7; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x,y,dotR,0,6.28);
      ctx.fillStyle=b.color; ctx.fill();
      ctx.strokeStyle=above?b.rim:'rgba(70,80,100,0.45)'; ctx.lineWidth=.9; ctx.stroke();
    }
    ctx.textAlign='center';
    ctx.font=(b.bold?'bold ':'')+fontSize+'px Rajdhani,sans-serif';
    const ly=y-(isStar?dotR*1.5:dotR)*1.3-3;
    const pw=isVR?58:44;
    ctx.fillStyle='rgba(2,4,14,0.48)';
    ctx.fillRect(x-pw/2,ly-fontSize+1,pw,fontSize+1);
    ctx.fillStyle=above?b.lc:'rgba(160,170,190,0.5)';
    ctx.fillText(label,x,ly);
    ctx.restore();
  }
  ctx.textAlign='left';

  /* VR: 画面中央の照準（スマホの背面が向いている方向） */
  if(isVR){
    ctx.strokeStyle='rgba(140,210,255,0.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(W/2,H/2,10,0,6.28); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W/2-18,H/2); ctx.lineTo(W/2-12,H/2); ctx.moveTo(W/2+12,H/2); ctx.lineTo(W/2+18,H/2);
    ctx.stroke();
  }
}

function getCanvas(id,W,H){
  const cv=document.getElementById(id);
  if(cv.width!==W) cv.width=W;
  if(cv.height!==H) cv.height=H;
  return cv;
}

function altStr(a){return(a>=0?'+':'−')+Math.abs(Math.round(a))+'°';}

function redrawWidget(){
  var wrap=document.getElementById('cw');
  var W=wrap.offsetWidth||wrap.clientWidth||320;
  var H=wrap.offsetHeight||wrap.clientHeight||220;
  const cv=getCanvas('cc-main',W,H);
  const ctx=cv.getContext('2d');
  if(!ctx) return;
  drawFrame(ctx,W,H,cachedBodies,false);
  bgDirty=false;
  const comp=az2c(compassCenter);
  document.getElementById('compass-bearing').textContent=
    Math.round(norm(compassCenter))%360+'°  '+comp.en+' / '+comp.jp+'  '+altStr(tiltCenter);
}

function redrawVR(){
  var wrap=document.getElementById('vr-canvas-wrap');
  var W=wrap.offsetWidth||wrap.clientWidth||320;
  var H=wrap.offsetHeight||wrap.clientHeight||600;
  const cv=getCanvas('vrc-main',W,H);
  const ctx=cv.getContext('2d');
  if(!ctx) return;
  drawFrame(ctx,W,H,cachedBodies,true);
  const comp=az2c(compassCenter);
  document.getElementById('vr-bearing').textContent=
    Math.round(norm(compassCenter))%360+'°  '+comp.en+'  '+altStr(tiltCenter);
  const info=sensorInfo(), el=document.getElementById('vr-sub');
  if(el&&el.textContent!==info) el.textContent=info;
}

/* ══════════════════════════════════════
   SENSOR + DRAG  (shared state)
══════════════════════════════════════ */
const DRAG={active:false,startX:0,startY:0,startCenter:180,startTilt:0,startOffset:0};

function startDrag(x,y){
  DRAG.active=true;
  DRAG.startX=x; DRAG.startY=y;
  DRAG.startCenter=compassCenter;
  DRAG.startTilt=tiltCenter;
  DRAG.startOffset=headingOffset;
}
function moveDrag(x,y){
  if(!DRAG.active)return;
  /* 画面中央の空が指に 1:1 でついてくるように、高度が高いほど方位を大きく回す */
  const dAz=(DRAG.startX-x)*degPerPx()/Math.max(.25,Math.cos(DRAG.startTilt*D2R));
  if(sensorMode){
    /* センサー中: 左右のドラッグで方位のずれだけを手で合わせる */
    headingOffset=norm(DRAG.startOffset+dAz+180)-180;
    SENS.calibrated=true;
    updateCam();
    return;
  }
  const newAz=norm(DRAG.startCenter+dAz);
  const newTilt=Math.max(-90,Math.min(90,
    DRAG.startTilt+(y-DRAG.startY)*degPerPx())); // 下へドラッグで上を見る
  compassCenter=newAz;
  tiltCenter=newTilt;
  setDirty();
}
['mouseup','touchend'].forEach(ev=>document.addEventListener(ev,()=>DRAG.active=false));

/* ── ピンチズーム: CSS transform でリアルタイムプレビュー → touchendで確定 ── */
let pActive=false, startDist=1, lastDist=1, startZoom=1;
function pinchDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}

function addPinchZoom(el){
  const getLayerId=()=> el===CW ? 'cc-main' : 'vrc-main';

  function setCSS(ratio){
    const el2=document.getElementById(getLayerId());
    if(el2) el2.style.transform=ratio===1?'':'scale('+ratio+')';
  }

  el.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      DRAG.active=false; pActive=true;
      startDist=lastDist=pinchDist(e.touches);
      startZoom=zoomLevel;
    }
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(pActive&&e.touches.length>=2){
      lastDist=pinchDist(e.touches);
      const newZ=Math.max(0.35,Math.min(6, startZoom*lastDist/startDist));
      const ratio=newZ/zoomLevel;             // 現在のcanvasサイズに対するプレビュー倍率
      setCSS(ratio);                           // GPUだけで拡縮、JS再描画なし
    }
  },{passive:true});

  el.addEventListener('touchend',e=>{
    if(pActive&&e.touches.length<2){
      zoomLevel=Math.max(0.35,Math.min(6, startZoom*lastDist/startDist));
      setCSS(1);                               // CSSリセット
      pActive=false; setDirty();              // 確定サイズでcanvas再描画
    }
  },{passive:true});

  /* ダブルタップでズーム・チルトリセット */
  let lastTap=0;
  el.addEventListener('touchend',e=>{
    if(e.touches.length>0||pActive)return;
    const now=Date.now();
    if(now-lastTap<320){ zoomLevel=1.0; tiltCenter=0; setCSS(1); setDirty(); }
    lastTap=now;
  },{passive:true});
}

/* ── センサー ──
   alpha/beta/gamma から端末の回転行列を作り、スマホの背面が向く方向を視線にする。
   方位を alpha だけで出すと、スマホを立てた姿勢（beta≈90°）で値が跳ぶ（ジンバルロック）。
   行列で扱えば、空に向けても横に傾けても正しい向きになる。 */
let sensorMode=false;
let headingOffset=0;   /* ドラッグ・CAL で足す方位の補正（度、時計回りが正） */
const SENS={cam:null,fS:null,uS:null,dF:[0,0,0],dU:[0,0,0],t:0,
            abs:false,needInit:false,calibrated:false,listeners:[],timer:0};

/* 1€フィルタ（One Euro Filter）:
   ・止めているとき → 強くなめらかにして手ぶれ・センサーのノイズを消す
   ・速く振ったとき → 遅れを小さくする
   止めれば必ずセンサーの値に追いつく（前の不感帯のように数度ずれたまま残らない） */
const OEF={minCut:0.4,beta:0.02,dCut:1.0};
function oeAlpha(cut,dt){const tau=1/(2*Math.PI*cut);return 1/(1+tau/dt);}

function screenAngle(){
  let a=0;
  if(screen.orientation&&typeof screen.orientation.angle==='number') a=screen.orientation.angle;
  else if(typeof window.orientation==='number') a=window.orientation;
  return norm(a);
}
/* 天頂の軸のまわりに回す（方位が deg 増える向き） */
function rotUp(v,deg){
  const d=deg*D2R,c=Math.cos(d),s=Math.sin(d);
  return[v[0]*c+v[1]*s,-v[0]*s+v[1]*c,v[2]];
}
/* 端末の向き → 視線 f（背面の向き）と画面の上 u（東・北・天頂の成分） */
function deviceCam(alpha,beta,gamma,angle){
  const a=alpha*D2R,b=beta*D2R,g=gamma*D2R;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  /* 端末の x(右)・y(上)・z(画面の手前) の向き。W3C の Z-X'-Y'' 回転 */
  const X=[ca*cg-sa*sb*sg, sa*cg+ca*sb*sg, -cb*sg];
  const Y=[-sa*cb, ca*cb, sb];
  const Z=[ca*sg+sa*sb*cg, sa*sg-ca*sb*cg, cb*cg];
  /* 横持ちのときは画面の上が端末の横になる */
  const th=angle*D2R,ct=Math.cos(th),st=Math.sin(th);
  return{f:[-Z[0],-Z[1],-Z[2]],
         u:[st*X[0]+ct*Y[0],st*X[1]+ct*Y[1],st*X[2]+ct*Y[2]]};
}

function onOrient(e){
  if(!sensorMode) return;
  if(e.alpha==null||e.beta==null||e.gamma==null||isNaN(e.alpha)) return;
  const abs=e.type==='deviceorientationabsolute'||e.absolute===true;
  let{f,u}=deviceCam(e.alpha,e.beta,e.gamma,screenAngle());
  if(abs){
    /* 磁北 → 真北 */
    f=rotUp(f,MAG_DECLINATION); u=rotUp(u,MAG_DECLINATION);
  } else if(SENS.needInit){
    /* 相対センサー（北がわからない）: 最初は、いま画面に出ている方位に合わせる */
    headingOffset=norm(compassCenter-Math.atan2(f[0],f[1])*R2D+180)-180;
  }
  SENS.abs=abs; SENS.needInit=false;
  filterStep(f,u,e.timeStamp||performance.now());
}

function filterStep(f,u,t){
  if(!SENS.fS){
    SENS.fS=f; SENS.uS=u; SENS.dF=[0,0,0]; SENS.dU=[0,0,0];
  } else {
    let dt=(t-SENS.t)/1000;
    if(!(dt>.001&&dt<.5)) dt=1/60;
    const ad=oeAlpha(OEF.dCut,dt);
    for(let i=0;i<3;i++){
      SENS.dF[i]+=((f[i]-SENS.fS[i])/dt-SENS.dF[i])*ad;
      SENS.dU[i]+=((u[i]-SENS.uS[i])/dt-SENS.dU[i])*ad;
    }
    const speed=Math.max(vlen(SENS.dF),vlen(SENS.dU))*R2D;   /* 度/秒 */
    const a=oeAlpha(OEF.minCut+OEF.beta*speed,dt);
    const fS=SENS.fS,uS=SENS.uS;
    SENS.fS=vunit([fS[0]+(f[0]-fS[0])*a,fS[1]+(f[1]-fS[1])*a,fS[2]+(f[2]-fS[2])*a]);
    SENS.uS=[uS[0]+(u[0]-uS[0])*a,uS[1]+(u[1]-uS[1])*a,uS[2]+(u[2]-uS[2])*a];
  }
  SENS.t=t;
  /* u を f に直交させる */
  const fS=SENS.fS,d=vdot(SENS.uS,fS);
  SENS.uS=vunit([SENS.uS[0]-d*fS[0],SENS.uS[1]-d*fS[1],SENS.uS[2]-d*fS[2]]);
  updateCam();
}

/* フィルタ後の向きに方位補正をかけて、表示用のカメラを作る */
function updateCam(){
  if(!SENS.fS) return;
  const f=rotUp(SENS.fS,headingOffset),u=rotUp(SENS.uS,headingOffset);
  SENS.cam={f,u,r:vcross(f,u)};
  compassCenter=norm(Math.atan2(f[0],f[1])*R2D);
  tiltCenter=Math.asin(Math.max(-1,Math.min(1,f[2])))*R2D;
  frameDirty=true;
}

function sensorInfo(){
  if(!sensorMode) return 'DRAG';
  if(!SENS.cam) return 'SENSOR …';
  const sg=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1)+'°';
  let s=SENS.abs?'MAG '+sg(MAG_DECLINATION):'REL';
  if(SENS.calibrated) s+='  CAL '+sg(headingOffset);
  else if(!SENS.abs) s+='  天体に向けて CAL';
  return s;
}

/* 方位センサーを登録する。deviceorientationabsolute（北が基準）を優先し、
   来なければ deviceorientation（北が不明）に切り替える。両方は同時に登録しない */
function sensorStart(){
  sensorStop();
  let gotAbs=false;
  const onAbs=e=>{ if(e.alpha==null)return; gotAbs=true; onOrient(e); };
  window.addEventListener('deviceorientationabsolute',onAbs,true);
  SENS.listeners=[['deviceorientationabsolute',onAbs]];
  SENS.timer=setTimeout(()=>{
    if(gotAbs) return;
    window.removeEventListener('deviceorientationabsolute',onAbs,true);
    window.addEventListener('deviceorientation',onOrient,true);
    SENS.listeners=[['deviceorientation',onOrient]];
  },400);
}
function sensorStop(){
  clearTimeout(SENS.timer);
  SENS.listeners.forEach(l=>window.removeEventListener(l[0],l[1],true));
  SENS.listeners=[];
}

/* キャリブレーション:
   スマホの背面を月・惑星・明るい星（昼は太陽）に向け、照準の円に入れて CAL を押す。
   いちばん近い天体（20°以内）の方位にぴったり合わせる。
   大きくずれているときは、先に左右ドラッグで大まかに合わせてから CAL。 */
const CAL_MAX_SEP=20;
function calibrate(){
  if(!sensorMode||!SENS.cam) return;
  const f=SENS.cam.f;
  let best=null,bs=CAL_MAX_SEP;
  for(const b of cachedBodies){
    if(b.alt<-1) continue;
    const s=Math.acos(Math.max(-1,Math.min(1,vdot(azAltVec(b.az,b.alt+refraction(b.alt)),f))))*R2D;
    if(s<bs){bs=s;best=b;}
  }
  let msg;
  if(best){
    headingOffset=norm(headingOffset+best.az-Math.atan2(f[0],f[1])*R2D+180)-180;
    SENS.calibrated=true;
    updateCam();
    msg='✓ '+best.enLabel.replace(/^[☀☽] /,'');
  } else msg='✕ NO TARGET';
  document.querySelectorAll('#cal-btn,#vr-cal-btn').forEach(b=>{
    b.textContent=msg; b.style.color=best?'#22e888':'#ff7766';
    clearTimeout(b._t);
    b._t=setTimeout(()=>{ b.textContent='◎ CAL'; b.style.color=''; },1600);
  });
}

function toggleSensor(){
  const btns=document.querySelectorAll('#sensor-btn,#vr-sensor-btn');
  const calBtns=document.querySelectorAll('#cal-btn,#vr-cal-btn');
  if(!sensorMode){
    const enable=()=>{
      sensorMode=true; headingOffset=0;
      SENS.fS=null; SENS.cam=null; SENS.abs=false; SENS.needInit=true; SENS.calibrated=false;
      sensorStart();
      btns.forEach(b=>{ b.textContent='⊙ SENSOR'; b.classList.add('on'); });
      calBtns.forEach(b=>b.style.display='');
    };
    if(typeof DeviceOrientationEvent!=='undefined'&&
       typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission()
        .then(s=>{ if(s==='granted')enable(); else btns.forEach(b=>b.textContent='✕ DENIED'); })
        .catch(()=>btns.forEach(b=>b.textContent='✕ ERR'));
    }else enable();
  }else{
    sensorMode=false; headingOffset=0; sensorStop(); SENS.cam=null;
    btns.forEach(b=>{ b.textContent='⊕ SENSOR'; b.classList.remove('on'); });
    calBtns.forEach(b=>b.style.display='none');
    setDirty();
  }
}

var arcHeights=[260,380,520];

function cycleArcH(){
  arcHIdx=(arcHIdx+1)%arcHeights.length;
  var btn=document.getElementById('arc-expand-btn');
  if(btn) btn.textContent=arcHIdx===0?'EXPAND ↕':arcHIdx===1?'LARGER ↕':'RESET ↕';
  drawArcCanvas();

function drawArcCanvas(){
  var cv=document.getElementById('arc-canvas');
  if(!cv)return;
  var W=cv.offsetWidth||cv.parentElement.clientWidth||400;
  if(W<10)W=400;

  /* devicePixelRatioで高解像度化 */
  var dpr=window.devicePixelRatio||1;
  var H=arcHeights[arcHIdx];
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  if(!ctx)return;
  ctx.scale(dpr,dpr);  /* 以降の座標はCSSピクセル基準でそのまま書ける */

  /* ─ レイアウト ─ */
  var pL=10, pR=10, pT=30, pB=24;
  var cw=W-pL-pR, ch=H-pT-pB;
  var horizY=pT+ch*0.52;
  var scaleUp=ch*0.46;
  var scaleDn=ch*0.40;

  function toX(h){ return pL+((((h%24)+24)%24)/24)*cw; }
  function toY(alt){ return horizY-(alt>=0?alt*scaleUp:alt*scaleDn); }
  function fmtH(h){
    if(h===null||h===undefined)return'--:--';
    h=((h%24)+24)%24;
    return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');
  }

  /* ─ データ ─ */
  var now=new Date();
  var nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  var sunBody =cachedBodies.filter(function(b){return b.type==='sun'; })[0];
  var moonBody=cachedBodies.filter(function(b){return b.type==='moon';})[0];
  var sRise=sunBody ?sunBody.data.rst.rise   :null;
  var sSet =sunBody ?sunBody.data.rst.set    :null;
  var sNoon=sunBody ?sunBody.data.rst.transit:null;
  var mRise=moonBody?moonBody.data.rst.rise   :null;
  var mSet =moonBody?moonBody.data.rst.set    :null;
  var mNoon=moonBody?moonBody.data.rst.transit:null;

  /* ─ 高度カーブ（cos弧、rise〜setの外側も自然に地平線下へ） ─ */
  function bodyAlt(h, rise, set, noon){
    if(rise===null||set===null)return null;
    var s=set<rise?set+24:set;
    var n=noon!==null?(noon<rise?noon+24:noon):(rise+s)/2;
    var period=s-rise;
    var dh=h-n; while(dh>12)dh-=24; while(dh<-12)dh+=24;
    if(dh<-period||dh>period)return null; /* 厳密不等号で端点(alt=0)を含む */
    return Math.cos(dh/period*Math.PI);     /* +1(南中)〜0(出没)〜-1(最低) */
  }
  function sunAlt(h) { return bodyAlt(h,sRise,sSet,sNoon); }
  function moonAlt(h){ return bodyAlt(h,mRise,mSet,mNoon); }

  /* ─ 背景 ─ */
  ctx.fillStyle='#070b12'; ctx.fillRect(0,0,W,H);

  /* 昼間グラデーション */
  if(sRise!==null&&sSet!==null){
    var gDay=ctx.createLinearGradient(0,pT,0,horizY);
    gDay.addColorStop(0,'rgba(255,165,35,0.09)');
    gDay.addColorStop(1,'rgba(255,165,35,0.00)');
    ctx.fillStyle=gDay;
    ctx.fillRect(toX(sRise),pT,toX(sSet)-toX(sRise),horizY-pT);
  }

  /* ─ 薄明帯（塗り） ─ */
  if(sRise!==null&&sSet!==null){
    var maxDeg=90-Math.abs(LAT-(23.45*Math.sin(2*Math.PI*(284+172)/365)));
    maxDeg=Math.min(85,Math.max(20,maxDeg));
    /* 各閾値のY座標（地平線下） */
    var yH =horizY;                          /* 0°  地平線 */
    var yC =toY(-6 /maxDeg);                 /* -6°  市民 */
    var yN =toY(-12/maxDeg);                 /* -12° 航海 */
    var yA =toY(-18/maxDeg);                 /* -18° 天文 */
    var yBot=Math.min(H-pB, yA+4);           /* 下端 */

    /* clampしてキャンバス外にはみ出ないように */
    function cy2(y){ return Math.max(horizY, Math.min(H-pB, y)); }

    /* 市民薄明帯: 地平線〜-6° */
    var gC=ctx.createLinearGradient(0,yH,0,cy2(yC));
    gC.addColorStop(0,'rgba(200,140,50,0.28)');
    gC.addColorStop(1,'rgba(160,100,30,0.08)');
    ctx.fillStyle=gC; ctx.fillRect(pL,yH,cw,cy2(yC)-yH);

    /* 航海薄明帯: -6°〜-12° */
    var gN=ctx.createLinearGradient(0,cy2(yC),0,cy2(yN));
    gN.addColorStop(0,'rgba(60,90,180,0.20)');
    gN.addColorStop(1,'rgba(30,50,150,0.10)');
    ctx.fillStyle=gN; ctx.fillRect(pL,cy2(yC),cw,cy2(yN)-cy2(yC));

    /* 天文薄明帯: -12°〜-18° */
    var gA=ctx.createLinearGradient(0,cy2(yN),0,cy2(yA));
    gA.addColorStop(0,'rgba(20,30,120,0.14)');
    gA.addColorStop(1,'rgba(5,10,60,0.06)');
    ctx.fillStyle=gA; ctx.fillRect(pL,cy2(yN),cw,cy2(yA)-cy2(yN));

    /* 帯境界線＋ラベル */
    [
      {y:yC, label:'市民 −6°',  col:'rgba(200,150,70,0.55)'},
      {y:yN, label:'航海 −12°', col:'rgba(80,110,200,0.50)'},
      {y:yA, label:'天文 −18°', col:'rgba(50,70,180,0.42)'},
    ].forEach(function(tw){
      var ty=cy2(tw.y);
      if(ty>=H-pB) return;
      ctx.strokeStyle=tw.col; ctx.lineWidth=0.7;
      ctx.beginPath(); ctx.moveTo(pL,ty); ctx.lineTo(pL+cw,ty); ctx.stroke();
      ctx.font='7px Orbitron,monospace'; ctx.fillStyle=tw.col;
      ctx.textAlign='right'; ctx.fillText(tw.label, pL+cw, ty-2);
    });
  }

  /* ─ 地平線 ─ */
  ctx.strokeStyle='rgba(55,90,155,0.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pL,horizY); ctx.lineTo(pL+cw,horizY); ctx.stroke();
  ctx.fillStyle='rgba(60,95,165,0.40)'; ctx.font='8px Orbitron,monospace';
  ctx.textAlign='right'; ctx.fillText('Horizon',pL+cw,horizY-3);

  /* ─ 時刻目盛 ─ */
  ctx.textAlign='center'; ctx.font='9px Orbitron,monospace';
  [0,4,8,12,16,20].forEach(function(h){
    var x=toX(h);
    ctx.strokeStyle='rgba(40,60,100,0.4)'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,horizY-2); ctx.lineTo(x,horizY+4); ctx.stroke();
    ctx.fillStyle='rgba(55,80,120,0.75)';
    ctx.fillText(String(h),x,H-5);
  });

  function yc(alt){ return horizY - alt*scaleUp; }

  /* 地平線下弧（slope連続: amplitude = period_under/period_above） */
  function drawBelowArc(rise, set, col, lineW, alpha){
    if(rise===null||set===null)return;
    var STEP=0.04;
    var s=set<rise?set+24:set;
    var periodAbove=s-rise;
    var periodUnder=24-periodAbove;
    var amp=periodUnder/periodAbove; /* これで出没点の傾きが上弧と一致 */
    var availH=H-pB-horizY;
    var scaleBel=Math.min(scaleUp, availH/amp); /* 収まるスケールに調整 */
    ctx.save();
    ctx.strokeStyle=col; ctx.lineWidth=lineW*0.6; ctx.globalAlpha=alpha;
    ctx.beginPath(); var pen=false;
    for(var dh=0; dh<=periodUnder+STEP; dh+=STEP){
      var alt=-amp*Math.sin(dh/periodUnder*Math.PI);
      var x=toX(s+dh), y=horizY+(-alt)*scaleBel;
      if(!pen){ctx.moveTo(x,y);pen=true;}
      else ctx.lineTo(x,y);
    }
    if(pen)ctx.stroke();
    ctx.restore();
  }

  /* ─ 曲線描画（地平線上、yc統一） ─ */
  function drawBody(altFn, aboveCol, glowCol, lineW, lineAlpha){
    var STEP=0.04;

    /* 地平線上グロー塗り */
    ctx.save(); ctx.globalAlpha=0.13;
    var cp=new Path2D(); cp.rect(pL,pT,cw,horizY-pT);
    ctx.clip(cp);
    ctx.fillStyle=glowCol;
    ctx.beginPath(); var pen=false;
    for(var h=0;h<=24+STEP;h+=STEP){
      var hh=h>24?24:h;
      var alt=altFn(hh);
      if(alt===null||alt<0){
        if(pen){ctx.lineTo(toX(hh),horizY);ctx.closePath();ctx.fill();ctx.beginPath();pen=false;}
        continue;
      }
      if(!pen){ctx.moveTo(toX(hh),horizY);pen=true;}
      ctx.lineTo(toX(hh),yc(alt));
    }
    if(pen){ctx.lineTo(toX(24),horizY);ctx.closePath();ctx.fill();}
    ctx.restore();

    /* 地平線上実線 */
    ctx.save();
    var cp2=new Path2D(); cp2.rect(pL,pT,cw,horizY-pT);
    ctx.clip(cp2);
    ctx.strokeStyle=aboveCol; ctx.lineWidth=lineW; ctx.globalAlpha=lineAlpha;
    ctx.beginPath(); pen=false;
    for(var h=0;h<=24+STEP;h+=STEP){
      var hh=h>24?24:h;
      var alt=altFn(hh);
      if(alt===null||alt<0){if(pen){ctx.stroke();pen=false;ctx.beginPath();}continue;}
      if(!pen){ctx.moveTo(toX(hh),yc(alt));pen=true;}
      else ctx.lineTo(toX(hh),yc(alt));
    }
    if(pen)ctx.stroke();
    ctx.restore();
  }

  var STEP=0.04;
  drawBelowArc(mRise,mSet,'rgba(140,165,190,1)',1.5,0.45);
  drawBody(moonAlt,'rgba(210,215,222,1)','rgba(200,210,220,1)',1.5,0.88);
  drawBelowArc(sRise,sSet,'rgba(200,165,50,1)',2.2,0.40);
  drawBody(sunAlt,'rgba(225,220,200,1)','rgba(245,198,55,1)',2.2,0.92);

  /* ─ 現在時刻ライン ─ */
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(toX(nowH),pT); ctx.lineTo(toX(nowH),H-pB+4); ctx.stroke();
  ctx.setLineDash([]);

  /* ─ 現在位置ドット ─ */
  function drawDot(altFn, dotCol, glowCol, radius){
    var a=altFn(nowH);
    if(a===null) return;
    var dx=toX(nowH), dy=toY(a);
    var g=ctx.createRadialGradient(dx,dy,0,dx,dy,radius*2.8);
    g.addColorStop(0,glowCol); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(dx-radius*3,dy-radius*3,radius*6,radius*6);
    ctx.fillStyle=dotCol; ctx.beginPath(); ctx.arc(dx,dy,radius,0,6.28); ctx.fill();
  }
  function drawDotBelow(rise, set, dotCol, glowCol, radius){
    if(rise===null||set===null)return;
    var s=set<rise?set+24:set;
    var periodAbove=s-rise;
    var periodUnder=24-periodAbove;
    var amp=periodUnder/periodAbove;
    var availH=H-pB-horizY;
    var scaleBel=Math.min(scaleUp, availH/amp);
    /* nowH を没後の経過時間に変換（drawBelowArcのdhと同じ） */
    var t=nowH; while(t<s-0.001)t+=24;
    var dh=t-s;
    if(dh<0||dh>periodUnder)return;
    var alt=-amp*Math.sin(dh/periodUnder*Math.PI);
    var dx=toX(nowH), dy=horizY+(-alt)*scaleBel;
    var g=ctx.createRadialGradient(dx,dy,0,dx,dy,radius*2.8);
    g.addColorStop(0,glowCol); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(dx-radius*3,dy-radius*3,radius*6,radius*6);
    ctx.fillStyle=dotCol; ctx.beginPath(); ctx.arc(dx,dy,radius,0,6.28); ctx.fill();
  }
  drawDot(sunAlt,  '#f5c640','rgba(255,220,80,0.45)',  5.5);
  drawDotBelow(sRise,sSet,'#f5c640','rgba(255,220,80,0.45)',5.5);
  drawDot(moonAlt, '#b0c8dc','rgba(180,215,238,0.30)', 4.0);
  drawDotBelow(mRise,mSet,'#b0c8dc','rgba(180,215,238,0.30)',4.0);

  /* ─ ラベル ─ */
  function label(h, altVal, timeStr, kanji, col, above){
    if(h===null)return;
    var x=toX(h);
    var y=above?toY(altVal)-7:horizY+2;
    var dir=above?-1:1;
    ctx.textAlign='center';
    ctx.font='8px Orbitron,monospace';
    ctx.fillStyle=col+'80'; ctx.fillText(kanji, x, y+dir*2);
    ctx.font='bold 9px Orbitron,monospace';
    ctx.fillStyle=col; ctx.fillText(timeStr, x, y+dir*13);
  }

  var sNA=sNoon!==null?sunAlt(sNoon):0.98;
  var mMid=mNoon!==null?mNoon:(mRise!==null&&mSet!==null?(function(){
    var ms=mSet<mRise?mSet+24:mSet; return((mRise+ms)/2)%24;
  })():null);
  var mNA=mMid!==null?moonAlt(mMid):0.5;

  label(sRise,0,     fmtH(sRise),'出',  '#f5c640',false);
  label(sNoon,sNA,   fmtH(sNoon),'南中','#f5c640',true);
  label(sSet, 0,     fmtH(sSet), '没',  '#f5c640',false);
  label(mRise,0,     fmtH(mRise),'出',  '#aac8de',false);
  label(mMid, mNA,   fmtH(mMid), '南中','#aac8de',true);
  label(mSet, 0,     fmtH(mSet), '没',  '#aac8de',false);

  /* 凡例 */
  ctx.textAlign='left'; ctx.font='8px Orbitron,monospace';
  ctx.fillStyle='rgba(245,198,60,0.72)';  ctx.fillText('☀ SUN',  pL, 11);
  ctx.fillStyle='rgba(165,200,228,0.72)'; ctx.fillText('☽ MOON', pL+50, 11);
}
const DAYS_JP=['日','月','火','水','木','金','土'];
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
  document.getElementById('dateline').textContent=
    n.getFullYear()+'/'+(n.getMonth()+1+'').padStart(2,'0')+'/'+(n.getDate()+'').padStart(2,'0')+'（'+DAYS_JP[n.getDay()]+'）';
  const rem=Math.max(0,Math.ceil((nextUpdateTime-Date.now())/60000));
  document.getElementById('status-next').textContent='NEXT: '+rem+'min';
}

/* ══════════════════════════════════════
   COMPUTE
══════════════════════════════════════ */
function computeAndRender(){
  cachedBodies=buildAll();
  nextUpdateTime=Date.now()+UPD;
  renderAll();
  setTimeout(drawArcCanvas,50);  // DOM更新後に描画
  setDirty();
  /* WebView安全策: rAFのts問題に関係なく即座に1フレーム描画 */
  redrawWidget();
}

/* ══════════════════════════════════════
   LOCATION  — Tasker Location v2
   URL: file:///sdcard/astro_tasker.html?lat=%loclat&lon=%loclon
══════════════════════════════════════ */
function parseURLLoc(){
  if(!window.location.search)return null;
  const map={};
  new URLSearchParams(window.location.search).forEach((v,k)=>map[k.toLowerCase()]=v.trim());
  function pair(k1,k2){
    const a=map[k1],b=map[k2];
    if(a&&b){const la=parseFloat(a),lo=parseFloat(b);if(!isNaN(la)&&!isNaN(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180)return{lat:la,lon:lo};}
    return null;
  }
  return pair('lat','lon')||pair('loclat','loclon')||pair('latitude','longitude')||
    (()=>{const s=map['loc'];if(!s)return null;const p=s.split(',');if(p.length<2)return null;const la=parseFloat(p[0]),lo=parseFloat(p[1]);return(!isNaN(la)&&!isNaN(lo))?{lat:la,lon:lo}:null;})();
}
function applyLoc(lat,lon){
  LAT=lat;LON=lon;LOC_READY=true;
  document.getElementById('locstr').textContent=lat.toFixed(4)+'°N, '+lon.toFixed(4)+'°E';
  computeAndRender();
}
function initLoc(){
  /* 平群町固定座標 */
  applyLoc(34.6037, 135.6842);
}

/* ══════════════════════════════════════
   START — WebView対応: レイアウト完了後に初期化
══════════════════════════════════════ */
function startApp(){
  updateClock();
  setInterval(updateClock,1000);
  setInterval(function(){if(LOC_READY)computeAndRender();},UPD);
  /* 空の表示用の位置は10秒ごとに計算し直す（空は1分で0.25°動く。1時間おきだと最大15°ずれる） */
  setInterval(function(){if(LOC_READY){cachedBodies=buildAll();setDirty();}},10000);
  requestAnimationFrame(rafLoop);
  initLoc();
}
/* 300ms待ってからスタート（WebViewのレイアウト完了を待つ） */
setTimeout(startApp, 300);
</script>
