<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050605">
<title>灰の迷宮</title>
<style>
:root {
  --bg: #050605; --panel: #0e110c; --line: #3b4234; --text: #ece8d6; --dim: #9a9a86;
  --accent: #ffcf6e; --good: #9be37f; --bad: #ff7a6b; --btn: #161a12; --btn2: #20261a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: "Noto Sans Mono CJK JP", "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", monospace;
  font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; user-select: none;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app { max-width: 520px; margin: 0 auto; padding: 8px 10px 24px; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 8px; color: var(--accent); font-weight: bold; }
.hdr span:last-child { color: var(--dim); font-weight: normal; font-size: 13px; text-align: right; }
.tag { display: inline-block; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 4px; margin-right: 4px; font-size: 12px; }
.btn {
  font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line); border-radius: 8px;
  min-height: 46px; padding: 8px 10px; width: 100%; text-align: center; touch-action: manipulation;
}
.btn:active { background: var(--btn2); border-color: var(--accent); }
.btn:disabled { opacity: .35; }
.btn.main { border-color: #6f6a45; color: var(--accent); font-weight: bold; }
.btn.ghost { background: transparent; color: var(--dim); }
.btn.danger { border-color: #6e2f29; color: var(--bad); background: transparent; }
.btn.sm { min-height: 40px; width: 52px; padding: 4px; font-size: 18px; }
.btn.wide { width: 100%; }
.menu { display: grid; gap: 8px; margin: 10px 0; }
.grid2 { grid-template-columns: 1fr 1fr; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
.pad.two { grid-template-columns: 1fr 1fr; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; min-height: 2.6em; white-space: normal; }
.note.warn { border-color: #6e2f29; color: #ffb3a8; font-size: 13px; }
.note.small, .small { font-size: 13px; color: var(--dim); }
.big { font-size: 20px; color: var(--accent); }
.view { display: block; width: 100%; aspect-ratio: 4 / 3; max-height: 42vh; background: #000; border: 1px solid var(--line); border-radius: 6px; }
.mapc { display: block; width: 100%; aspect-ratio: 1 / 1; background: #000; border: 1px solid var(--line); border-radius: 6px; }
.msg { height: 5.9em; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; margin: 6px 0; font-size: 14px; }
.msg div { min-height: 1.4em; }
.ptable { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 13.5px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 4.2em 2.4em 5.6em 2.6em; gap: 4px; padding: 3px 8px; border-top: 1px solid #1d2219; align-items: center; }
.prow.head { border-top: none; color: var(--dim); font-size: 12px; background: var(--panel); }
.prow.head .ps { color: var(--dim); }
.prow span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pa, .prow .ph { text-align: right; }
.prow .ps { color: var(--bad); }
.prow i { font-style: normal; font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 2px; margin-left: 2px; }
.prow.down { color: #8d6b66; }
.prow.low .ph { color: var(--bad); }
.empty { padding: 10px; color: var(--dim); text-align: center; }
.ebox { min-height: 5.2em; background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 16px; }
.erow { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #22281e; }
.cmd { margin-top: 8px; }
.who { color: var(--accent); margin: 2px 0 8px; }
.title { text-align: center; padding-top: 8vh; }
.logo { font-size: 40px; letter-spacing: .3em; color: var(--accent); text-shadow: 0 0 12px #6a5320; }
.logo2 { color: var(--dim); letter-spacing: .2em; font-size: 12px; margin-bottom: 24px; }
.story { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 16px 0; font-size: 14px; }
.alloc { display: grid; gap: 6px; margin: 8px 0; }
.arow { display: grid; grid-template-columns: 1fr 3em 52px 52px; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.av { font-size: 20px; text-align: right; color: var(--accent); }
#ov .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .72); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 10; }
.mbox { background: #10140d; border: 1px solid #5b6150; border-radius: 10px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 12px; box-shadow: 0 6px 30px #000; }
.mtext { white-space: normal; padding: 6px 4px 12px; font-size: 15px; }
.mtitle { color: var(--accent); padding: 4px 2px 10px; }
.mtitle2 { color: var(--accent); margin: 10px 0 6px; font-size: 14px; }
.mlist { display: grid; gap: 6px; }
.mbtns { margin-top: 10px; display: grid; gap: 8px; }
.mbtns.row { grid-template-columns: 1fr 1fr; }
.btn.opt { text-align: left; min-height: 44px; }
.btn .sub { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.lv { font-size: 11px; color: var(--dim); margin-left: 4px; }
.ng { color: var(--bad); margin-right: 4px; }
.eq { color: var(--good); margin-right: 6px; font-weight: normal; }
.eq0 { color: var(--line); margin-right: 6px; }
.cur { color: var(--bad); font-size: 11px; border: 1px solid var(--bad); border-radius: 3px; margin-left: 4px; padding: 0 2px; }
.inp, .ta { width: 100%; font: inherit; color: var(--text); background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 10px; user-select: text; }
.ta { height: 40vh; font-size: 11px; word-break: break-all; }
.sheet { color: var(--text); font-size: 14px; }
.sheet .sh1 { font-size: 18px; color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 8px; margin: 6px 0; padding: 6px; background: #000; border-radius: 6px; }
.stats b { color: var(--dim); font-weight: normal; font-size: 12px; }

</style>
</head>

<script>
// ---- data.js ----
// ===== 乱数・さいころ =====
let rnd = Math.random;
function setRng(f) { rnd = f; }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }   // a..b
function pct(p) { return rnd() * 100 < p; }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function dice(d) {                                                  // [n, s, plus]
  if (!d) return 0;
  let t = d[2] || 0;
  for (let i = 0; i < d[0]; i++) t += ri(1, d[1]);
  return t;
}
function dstr(d) { return d[0] + 'd' + d[1] + (d[2] > 0 ? '+' + d[2] : d[2] < 0 ? d[2] : ''); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ===== 能力・種族・性格 =====

  if (L <= 1) return 0;
  if (L <= 14) return Math.round(250 * Math.pow(1.65, L - 2));

// ===== 迷宮 =====
// 壁の値: 0=通路 1=壁 2=扉 3=隠し扉 4=鍵のかかった扉
const MW = 20, MH = 20, NFLOORS = 10;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const DIR_N = ['北', '東', '南', '西'];
const W_OPEN = 0, W_WALL = 1, W_DOOR = 2, W_SECRET = 3, W_LOCK = 4;

function inb(x, y) { return x >= 0 && y >= 0 && x < MW && y < MH; }
function ci(x, y) { return y * MW + x; }

function makeFloor(f) {
  return {
    f, walls: new Uint8Array(MW * MH * 4).fill(W_WALL),
    room: new Int16Array(MW * MH).fill(-1), rooms: [],
    sp: {},             // 特別なマス: ci -> {t, ...}
    up: null, down: null, lock: null, guardRoom: -1,
  };
}
function getW(F, x, y, d) { return F.walls[ci(x, y) * 4 + d]; }
function setW(F, x, y, d, v) {
  F.walls[ci(x, y) * 4 + d] = v;
  const nx = x + DX[d], ny = y + DY[d];
  if (inb(nx, ny)) F.walls[ci(nx, ny) * 4 + ((d + 2) & 3)] = v;
}
function passable(v, opts) {
  if (v === W_OPEN || v === W_DOOR || v === W_SECRET) return true;
  if (v === W_LOCK) return !!(opts && opts.keys);
  return false;
}
function bfs(F, sx, sy, opts) {
  const dist = new Int16Array(MW * MH).fill(-1);
  const q = [ci(sx, sy)]; dist[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], x = c % MW, y = (c / MW) | 0;
    for (let d = 0; d < 4; d++) {
      const v = getW(F, x, y, d);
      if (opts && opts.noSecret && v === W_SECRET) continue;
      if (!passable(v, opts)) continue;
      const nx = x + DX[d], ny = y + DY[d];
      if (!inb(nx, ny)) continue;
      const n = ci(nx, ny);
      if (dist[n] < 0) { dist[n] = dist[c] + 1; q.push(n); }
    }
  }
  return dist;
}
function openSides(F, x, y) {
  let n = 0;
  for (let d = 0; d < 4; d++) if (passable(getW(F, x, y, d), { keys: 1 })) n++;
  return n;
}

function genFloor(f, up, R) {
  const F = makeFloor(f);
  F.up = up;
  // 部屋
  const nRooms = 4 + (f % 4);
  for (let t = 0; t < 400 && F.rooms.length < nRooms; t++) {
    const w = 2 + Math.floor(R() * 3), h = 2 + Math.floor(R() * 3);
    const x0 = Math.floor(R() * (MW - w)), y0 = Math.floor(R() * (MH - h));
    let ok = true;
    for (let y = y0 - 1; y <= y0 + h && ok; y++) for (let x = x0 - 1; x <= x0 + w && ok; x++) {
      if (!inb(x, y)) continue;
      if (F.room[ci(x, y)] >= 0) ok = false;
      if (Math.abs(x - up.x) + Math.abs(y - up.y) <= 2) ok = false;
    }
    if (!ok) continue;
    const id = F.rooms.length, cells = [];
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { F.room[ci(x, y)] = id; cells.push(ci(x, y)); }
    for (const c of cells) {
      const x = c % MW, y = (c / MW) | 0;
      for (let d = 1; d <= 2; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (inb(nx, ny) && F.room[ci(nx, ny)] === id) setW(F, x, y, d, W_OPEN);
      }
    }
    F.rooms.push({ id, x: x0, y: y0, w, h, cells });
  }
  // 穴掘り（深さ優先）。部屋は1つのかたまりとして扱う
  const vis = new Uint8Array(MW * MH);
  const stack = [];
  const visit = c => {
    const r = F.room[c];
    if (r >= 0) { for (const rc of F.rooms[r].cells) { vis[rc] = 1; stack.push(rc); } }
    else { vis[c] = 1; stack.push(c); }
  };
  visit(ci(up.x, up.y));
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % MW, y = (c / MW) | 0;
    const opts = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (inb(nx, ny) && !vis[ci(nx, ny)]) opts.push(d);
    }
    if (!opts.length) { stack.pop(); continue; }
    const d = opts[Math.floor(R() * opts.length)];
    const nx = x + DX[d], ny = y + DY[d], n = ci(nx, ny);
    const roomEdge = F.room[c] >= 0 || F.room[n] >= 0;
    setW(F, x, y, d, roomEdge ? W_DOOR : (R() < 0.08 ? W_DOOR : W_OPEN));
    visit(n);
  }
  // 行き止まりをいくつか、つなげて輪にする
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const c = ci(x, y);
    if (F.room[c] >= 0 || openSides(F, x, y) !== 1 || R() > 0.4) continue;
    const ds = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (inb(nx, ny) && getW(F, x, y, d) === W_WALL) ds.push(d);
    }
    if (!ds.length) continue;
    const d = ds[Math.floor(R() * ds.length)];
    setW(F, x, y, d, F.room[ci(x + DX[d], y + DY[d])] >= 0 ? W_DOOR : W_OPEN);
  }
  // 下り階段
  const dist = bfs(F, up.x, up.y);
  let maxd = 0; for (let i = 0; i < dist.length; i++) maxd = Math.max(maxd, dist[i]);
  const lockKey = LOCKS[f];
  if (f < NFLOORS) {
    let cand = [];
    for (let c = 0; c < MW * MH; c++) {
      const x = c % MW, y = (c / MW) | 0;
      if (F.room[c] >= 0 || dist[c] < maxd * 0.55 || (x === up.x && y === up.y)) continue;
      if (lockKey && openSides(F, x, y) !== 1) continue;
      cand.push(c);
    }
    if (!cand.length) throw new Error('no down stairs candidate f=' + f);
    cand.sort((a, b) => dist[b] - dist[a]);
    cand = cand.slice(0, Math.max(1, Math.ceil(cand.length / 3)));
    const c = cand[Math.floor(R() * cand.length)];
    F.down = { x: c % MW, y: (c / MW) | 0 };
    if (lockKey) {
      for (let d = 0; d < 4; d++) if (passable(getW(F, F.down.x, F.down.y, d))) {
        setW(F, F.down.x, F.down.y, d, W_LOCK);
        F.lock = { x: F.down.x, y: F.down.y, d, key: lockKey };
      }
    }
  }
  // 番人の部屋（一番遠い部屋）
  if (GUARDS[f]) {
    let best = -1, bd = -1;
    for (const r of F.rooms) {
      let md = 1e9; for (const c of r.cells) if (dist[c] >= 0) md = Math.min(md, dist[c]);
      if (md < 1e9 && md > bd) { bd = md; best = r.id; }
    }
    F.guardRoom = best;
  }
  return F;
}

// 隠し扉：通れなくしても、行くべき場所に行けるものだけにする
function addSecrets(F, R, n) {
  const free = bfs(F, F.up.x, F.up.y, { noSecret: 1 });
  const must = [];
  if (F.down) must.push(ci(F.down.x, F.down.y));
  if (F.guardRoom >= 0) must.push(F.rooms[F.guardRoom].cells[0]);
  let placed = 0;
  for (let t = 0; t < 300 && placed < n; t++) {
    const x = Math.floor(R() * MW), y = Math.floor(R() * MH), d = 1 + Math.floor(R() * 2);
    const nx = x + DX[d], ny = y + DY[d];
    if (!inb(nx, ny)) continue;
    const v = getW(F, x, y, d);
    if (v !== W_OPEN && v !== W_DOOR) continue;
    if (F.room[ci(x, y)] >= 0 && F.room[ci(x, y)] === F.room[ci(nx, ny)]) continue;
    if (free[ci(x, y)] < 0) continue;
    setW(F, x, y, d, W_WALL);
    const dd = bfs(F, F.up.x, F.up.y, { keys: 1, noSecret: 1 });
    let ok = must.every(c => dd[c] >= 0);
    // 部屋はどこからでも入れるように
    for (const r of F.rooms) if (dd[r.cells[0]] < 0 && free[r.cells[0]] >= 0) ok = false;
    setW(F, x, y, d, ok ? W_SECRET : v);
    if (ok) placed++;
  }
}

// 特別なマスを置く
function placeSpecials(floors, R) {
  for (let f = 1; f <= NFLOORS; f++) {
    const F = floors[f];
    const free = bfs(F, F.up.x, F.up.y, { noSecret: 1 });  // 鍵の扉・隠し扉を通らずに行ける所
    F.free = free;
    const cand = [];
    for (let c = 0; c < MW * MH; c++) {
      const x = c % MW, y = (c / MW) | 0;
      if (free[c] < 3 || F.room[c] >= 0) continue;
      if (F.down && x === F.down.x && y === F.down.y) continue;
      cand.push(c);
    }
    const used = new Set();
    const take = () => {
      for (let t = 0; t < 200; t++) {
        const c = cand[Math.floor(R() * cand.length)];
        if (!used.has(c) && !F.sp[c]) { used.add(c); return c; }
      }
      return -1;
    };
    const put = (t, extra) => { const c = take(); if (c >= 0) F.sp[c] = Object.assign({ t }, extra || {}); return c; };
    (FLOOR_MSG[f] || []).forEach((m, i) => put('msg', { m: i }));
    const nPit = 1 + Math.floor(f / 2), nSpin = f >= 2 ? 1 + Math.floor(f / 3) : 0;
    const nTele = f >= 4 ? Math.floor(f / 3) : 0, nDark = f >= 3 ? 1 + Math.floor(f / 4) + (f === 9 ? 2 : 0) : 0;
    const nAnti = f >= 6 ? 2 : 0;
    for (let i = 0; i < nPit; i++) put('pit');
    for (let i = 0; i < nSpin; i++) put('spin');
    for (let i = 0; i < nTele; i++) put('tele');
    if (f === 2 || f === 6) put('fount');
    // 暗闇・魔法の効かない場所は、かたまりで置く
    const cluster = (t, size) => {
      let c = take(); if (c < 0) return;
      F.sp[c] = { t };
      for (let i = 1; i < size; i++) {
        const x = c % MW, y = (c / MW) | 0, ds = [];
        for (let d = 0; d < 4; d++) {
          const nx = x + DX[d], ny = y + DY[d];
          if (!inb(nx, ny) || !passable(getW(F, x, y, d))) continue;
          const n = ci(nx, ny);
          if (F.sp[n] || F.room[n] >= 0 || free[n] < 3 || (F.down && nx === F.down.x && ny === F.down.y)) continue;
          ds.push(n);
        }
        if (!ds.length) break;
        c = ds[Math.floor(R() * ds.length)]; F.sp[c] = { t }; used.add(c);
      }
    };
    for (let i = 0; i < nDark; i++) cluster('dark', 3 + Math.floor(R() * 4));
    for (let i = 0; i < nAnti; i++) cluster('anti', 2 + Math.floor(R() * 2));
    // 落とし戸（下の階へ落ちる）。鍵の扉を飛び越さない階だけ
    if ([2, 5, 6, 8].includes(f)) {
      const G = floors[f + 1], gfree = bfs(G, G.up.x, G.up.y, { noSecret: 1 });
      for (let t = 0; t < 50; t++) {
        const c = cand[Math.floor(R() * cand.length)];
        if (F.sp[c] || gfree[c] < 0 || G.room[c] >= 0) continue;
        F.sp[c] = { t: 'chute' }; break;
      }
    }
  }
}

let WORLD = null;
function buildWorld() {
  const R = mulberry32(20261014);
  const floors = [null];
  let up = { x: 0, y: MH - 1 };
  for (let f = 1; f <= NFLOORS; f++) {
    const F = genFloor(f, up, R);
    floors.push(F);
    if (F.down) up = { x: F.down.x, y: F.down.y };
  }
  for (let f = 1; f <= NFLOORS; f++) addSecrets(floors[f], R, 2 + Math.floor(f / 2));
  placeSpecials(floors, R);
  WORLD = floors;
  return floors;
}

// ----- キャラクター -----
function byId(id) { return S.roster.find(c => c.id === id); }

function inTown(c) { return !S.party.includes(c.id) && !c.maze; }
function isGone(c) { return c.status === 'dead' || c.status === 'ash' || c.status === 'lost'; }
function canAct(c) { return c.status === 'ok'; }
function isDown(c) { return isGone(c) || c.status === 'stoned' || c.status === 'paralyzed'; }
const STATUS_N = { ok: '', sleep: '眠り', paralyzed: '麻痺', stoned: '石化', dead: '死亡', ash: '灰', lost: '消失' };
function statusText(c) {

}

function rollBonus() {
  let b = ri(5, 9);
  if (pct(12)) { b += 10; if (pct(15)) b += 10; }
  return b;
}
function classOk(cls, st, al) {
  if (!cls.al[al]) return false;
  for (let i = 0; i < 6; i++) if (st[i] < cls.req[i]) return false;
  return true;
}
function statBonus(v) { return v >= 18 ? 3 : v === 17 ? 2 : v === 16 ? 1 : v <= 3 ? -2 : v <= 5 ? -1 : 0; }
function hpRoll(cls, vit) { return Math.max(1, ri(1, cls.hd) + statBonus(vit)); }

function newChar(name, raceId, al, st, clsId) {
  const cls = CLS[clsId], race = RACES.find(r => r.id === raceId);
  const hd = cls.hd;
  const mhp = Math.max(2, ri(Math.ceil(hd / 2), hd) + Math.ceil(hd / 2) + statBonus(st[3]) + (cls.bonusHp || 0));
  const c = {
    id: S.nextId++, name, race: race.id, al, cls: clsId, lv: 1, exp: 0,
    hp: mhp, mhp, st: st.slice(), status: 'ok', poison: 0, items: [],
    mp: { m: [0, 0, 0, 0, 0, 0, 0], p: [0, 0, 0, 0, 0, 0, 0] },
    keep: { m: [0, 0, 0, 0, 0, 0, 0], p: [0, 0, 0, 0, 0, 0, 0] },
    maze: null, honor: 0, kills: 0,

  restoreMp(c);

}
function slotsBy(cls, lv, school, stat) {
  const spec = school === 'm' ? cls.mag : cls.pri;
  const out = [0, 0, 0, 0, 0, 0, 0];
  if (!spec) return out;
  for (let L = 1; L <= 7; L++) {
    const u = spec[0] + spec[1] * (L - 1);
    if (lvOk(lv, u)) {
      const n = spec[1] >= 3 ? 1 + Math.floor((lv - u) / 3) : 2 + Math.floor((lv - u) / 2);
      out[L - 1] = Math.min(9, n + (stat >= 17 ? 1 : 0));
    }
  }
  return out;
}
function lvOk(lv, u) { return lv >= u; }
function maxSlots(c, school) {
  const cls = CLS[c.cls];
  const a = slotsBy(cls, c.lv, school, school === 'm' ? c.st[1] : c.st[2]);
  return a.map((v, i) => Math.max(v, c.keep[school][i]));
}
function restoreMp(c) { c.mp.m = maxSlots(c, 'm'); c.mp.p = maxSlots(c, 'p'); }
function knownSpells(c) {
  const m = maxSlots(c, 'm'), p = maxSlots(c, 'p');
  return SPELLS.filter(s => (s.s === 'm' ? m : p)[s.lv - 1] > 0);
}
function canCast(c, sp) { return c.mp[sp.s][sp.lv - 1] > 0; }

function expNeed(c, L) { return Math.round(expBase(L) * CLS[c.cls].xm); }

function equipped(c, kind) { const it = c.items.find(i => i.eq && IT[i.id].kind === kind); return it ? IT[it.id] : null; }
function charAC(c) {
  let ac = 10;
  for (const i of c.items) if (i.eq) ac -= IT[i.id].ac;
  const cls = CLS[c.cls];
  if (cls.naked) {
    const arm = equipped(c, 'arm'), shd = equipped(c, 'shd');
    if ((!arm || arm.ninOK) && !shd) ac -= Math.floor(c.lv / 3) + 2;
  }
  return ac;
}
function hitSkill(c) {
  const cls = CLS[c.cls];
  let h = cls.hit === 3 ? 2 + Math.floor(c.lv / 2) : cls.hit === 2 ? 1 + Math.floor(c.lv / 3) : Math.floor(c.lv / 4);
  h += statBonus(c.st[0]);
  for (const i of c.items) if (i.eq) h += IT[i.id].hit || 0;
  return h;
}
function numAttacks(c) {
  const cls = CLS[c.cls];
  if (!cls.multi) return 1;
  return Math.min(5, 1 + Math.floor(c.lv / cls.multi));
}
function weaponDmg(c) {
  const w = equipped(c, 'wep');
  if (w) return w.dmg;
  if (CLS[c.cls].naked) return [2, 4, Math.floor(c.lv / 3)];
  return [1, 2, 0];
}
function critChance(c) {
  let p = 0;
  if (CLS[c.cls].crit) p = Math.min(40, c.lv * 2);
  const w = equipped(c, 'wep'); if (w && w.crit) p += w.crit;
  return p;
}
function resistChance(c, kind) {   // 状態異常をはね返す確率
  const race = RACES.find(r => r.id === c.race);
  let p = 15 + c.lv * 3 + Math.max(0, c.st[5] - 8) * 2 + ((race.res || {})[kind] || 0) + (kind === 'sleep' ? 20 : 0);
  if (kind === 'poison' && c.items.some(i => i.eq && IT[i.id].noPoison)) return 100;
  if (kind === 'drain' && c.items.some(i => i.eq && IT[i.id].noDrain)) return 100;
  return clamp(p, 0, 90);
}

// ----- レベルアップ（宿屋で） -----
function levelUp(c) {
  const msgs = [];
  const cls = CLS[c.cls];
  const beforeKnown = knownSpells(c).map(s => s.id);
  c.lv++;
  const gain = hpRoll(cls, c.st[3]);
  c.mhp += gain; c.hp += gain;
  msgs.push(`${c.name}は レベル${c.lv}になった！（HP +${gain}）`);
  const ch = [];
  for (let i = 0; i < 6; i++) {
    if (c.st[i] < 18 && pct(28)) { c.st[i]++; ch.push(STATS[i] + '+1'); }
    else if (c.st[i] > 3 && pct(4)) { c.st[i]--; ch.push(STATS[i] + '-1'); }
  }
  if (ch.length) msgs.push('　' + ch.join('　'));
  const newSp = knownSpells(c).filter(s => !beforeKnown.includes(s.id));
  if (newSp.length) msgs.push('　新しい呪文：' + newSp.map(s => s.n).join('・'));
  return msgs;
}
function drainLevel(c, n) {
  const old = c.lv;
  c.lv = Math.max(1, c.lv - n);
  if (c.lv === old) return false;
  c.mhp = Math.max(1, Math.round(c.mhp * c.lv / old));
  c.hp = Math.min(c.hp, c.mhp);
  c.exp = expNeed(c, c.lv);
  for (const s of ['m', 'p']) {
    const mx = maxSlots(c, s);
    c.mp[s] = c.mp[s].map((v, i) => Math.min(v, mx[i]));
  }
  return true;
}

// ----- 持ち物 -----
function itemName(it) { const d = IT[it.id]; return it.idf || d.kind === 'key' ? d.n : d.unk; }
function canEquipCls(c, d) { return d.cls.includes(CLS[c.cls].s); }
function addItem(c, id, idf) {

}
function giveItemToParty(id, idf) {

function hasKey(key) { return partyChars().some(c => c.items.some(i => i.id === key)); }
function rosterHasKey(key) { return S.roster.some(c => c.items.some(i => i.id === key)); }
function equipItem(c, idx) {

  if (!canEquipCls(c, d)) return CLS[c.cls].n + 'には装備できない。';

  if (cur && cur.cur) return `${itemName(cur)}が呪われていて外せない！`;

// 敵の群れを作る
function makeGroup(mid, n) {

  const lvMax = Math.max(1, ...partyChars().map(c => c.lv));

}
function randomEncounter(f) {

  if (f <= 1 && ng > 2) ng = 2;
  const groups = [], cap = f === 1 ? 5 : f === 2 ? 7 : 9;
  let total = 0;
  for (let i = 0; i < ng && total < cap; i++) {

    const n = Math.min(ri(m.g[0], m.g[1]), cap - total);

}

}

// 宝箱
function makeChest(f) {

  if (r > 25 - f) trap = ri(1, Math.min(8, 3 + Math.floor(f / 2) + 1));
  return { f, trap, gold: f * ri(25, 75) + ri(0, 50), item: pct(55 + f * 2) ? randomItemId(f) : null };
}
function randomItemId(f) {
  const cand = [], w = [];
  for (const d of ITEMS) {
    if (d.kind === 'key') continue;
    const dep = d.dep || 1;
    if (dep > f + 1 || dep < f - 4) continue;
    cand.push(d.id); w.push(dep >= f - 1 ? 3 : 1);
  }
  let t = w.reduce((a, b) => a + b, 0) * rnd();
  for (let i = 0; i < cand.length; i++) { t -= w[i]; if (t < 0) return cand[i]; }
  return cand[cand.length - 1];
}
function disarmChance(c) {

}

// 罠が働く。返り値: {msgs, tele, alarm}
function springTrap(chest, c) {

  const t = TRAPS[chest.trap];
  if (!chest.trap) return out;
  msgs.push(`しまった！　${t}だ！`);
  const ps = partyChars().filter(p => !isGone(p) && p.status !== 'stoned');
  const hurt = (p, d) => {
    p.hp -= d;
    msgs.push(`${p.name}に ${d}のダメージ。`);
    if (p.hp <= 0) { p.hp = 0; p.status = 'dead'; p.poison = 0; msgs.push(`${p.name}は 死んだ。`); }
  };
  switch (chest.trap) {
    case 1: if (!pct(resistChance(c, 'poison'))) { c.poison = 1; msgs.push(`${c.name}は 毒をうけた。`); } else msgs.push(`${c.name}は 毒をよけた。`); break;
    case 2: hurt(c, dice([f, 6, 0])); break;
    case 3: for (const p of ps) if (!pct(resistChance(p, 'poison'))) { p.poison = 1; msgs.push(`${p.name}は 毒をうけた。`); } break;
    case 4: for (const p of ps) hurt(p, dice([Math.ceil(f / 2), 6, 0])); break;
    case 5: if (!pct(resistChance(c, 'paralyze'))) { c.status = 'paralyzed'; msgs.push(`${c.name}は 体がしびれて動けない！`); } break;
    case 6: if (!pct(resistChance(c, 'stone'))) { c.status = 'stoned'; msgs.push(`${c.name}は 石になった！`); } break;

// ----- 戦闘の外で呪文・道具を使う -----
// 戻り値 {msgs, warp?, home?}
function applyAllySpell(sp, target, fromItem) {
  const msgs = [], fx = sp.fx;
  if (fx.heal) {
    if (isGone(target)) { msgs.push(`${target.name}には 効かない。`); return msgs; }
    const before = target.hp;
    target.hp = fx.heal === 'full' ? target.mhp : Math.min(target.mhp, target.hp + dice(fx.heal));
    msgs.push(`${target.name}の HPが ${target.hp - before} 回復した。`);
  }
  if (fx.cure) {
    let done = false;
    if (fx.cure.includes('poison') && target.poison) { target.poison = 0; done = true; msgs.push(`${target.name}の 毒が消えた。`); }
    if (fx.cure.includes(target.status)) { msgs.push(`${target.name}の ${STATUS_N[target.status]}が治った。`); target.status = 'ok'; done = true; }
    if (!done && !fx.heal) msgs.push('何も起こらなかった。');
  }
  if (fx.raise) {
    const st = target.status;
    if (st === 'dead' || (st === 'ash' && fx.raise === 2)) {
      const p = clamp((fx.raise === 2 ? 60 : 40) + target.st[3] * 3 - (st === 'ash' ? 15 : 0), 10, 98);
      if (pct(p)) {
        target.status = 'ok'; target.hp = fx.raise === 2 ? target.mhp : 1;
        if (target.st[3] > 3) target.st[3]--;
        msgs.push(`${target.name}は 生き返った！`);
      } else if (st === 'dead') { target.status = 'ash'; msgs.push(`失敗した……　${target.name}は 灰になった。`); }
      else { target.status = 'lost'; msgs.push(`失敗した……　${target.name}は 消え失せた。`); }
    } else msgs.push(`${target.name}には 効かない。`);
  }
  return msgs;
}
function campSpell(sp, target) {
  const fx = sp.fx, out = { msgs: [] };
  if (cellSp(S.pos.f, S.pos.x, S.pos.y) && cellSp(S.pos.f, S.pos.x, S.pos.y).t === 'anti') {
    out.msgs.push('呪文は かき消された……（魔法の効かない場所だ）'); return out;
  }
  if (fx.light) { S.light = Math.max(S.light, fx.light); out.msgs.push('あたりが明るくなった。'); }
  if (fx.levit) { S.levit = Math.max(S.levit, fx.levit); out.msgs.push('体が ふわりと浮いた。'); }
  if (fx.reveal) { revealAround(fx.reveal); out.msgs.push('まわりの様子が 頭に浮かんだ。（地図を見よう）'); }
  if (fx.warp) out.warp = true;
  if (fx.home) out.home = true;
  if (fx.heal || fx.cure || fx.raise) out.msgs.push(...applyAllySpell(sp, target));
  return out;
}

// ===== 戦闘 =====
let B = null;

function startBattle(groups, opt) {
  opt = opt || {};
  B = {
    groups, round: 0, chest: !!opt.chest, guard: opt.guard || 0, boss: !!opt.boss,
    cs: {}, stop: 0, exp: 0, gold: 0, over: null, msgs: [], surprise: null,
    startText: opt.text || null,
  };
  for (const c of partyChars()) B.cs[c.id] = { ac: 0, sil: 0, parry: 0 };
  if (!opt.guard) {
    const r = rnd() * 100;

  }
  S.battles++;
  return B;
}
function gname(g) { const m = MN[g.mid]; return g.known ? m.n : m.unk; }
function liveUnits(g) { return g.units.filter(u => u.st !== 'dead'); }
function snap() {
  return {
    p: partyChars().map(c => ({ hp: c.hp, st: c.status, poison: c.poison })),
    g: B.groups.map(g => ({ n: gname(g), a: liveUnits(g).length, s: g.units.filter(u => u.st === 'sleep').length })),
  };
}
function log(t) { B.msgs.push({ t, snap: snap() }); }
function battleAC(c) { const s = B.cs[c.id] || {}; return charAC(c) - (s.ac || 0) - (s.parry ? 2 : 0); }
function inAnti() { const s = cellSp(S.pos.f, S.pos.x, S.pos.y); return !!(s && s.t === 'anti'); }

function killUnit(g, u, killer) {
  u.st = 'dead'; u.hp = 0;
  const m = MN[g.mid];
  B.exp += monExp(m);
  B.gold += m.lv * ri(1, 6);
  if (killer) killer.kills = (killer.kills || 0) + 1;
}
function hurtUnit(g, u, d, killer) {
  u.hp -= d;
  if (u.hp <= 0) { killUnit(g, u, killer); return true; }
  return false;
}
function hurtChar(c, d) {
  c.hp -= d;
  if (c.hp <= 0) { c.hp = 0; c.status = 'dead'; c.poison = 0; return true; }
  if (c.status === 'sleep' && pct(50)) c.status = 'ok';
  return false;
}
function frontTargets() {
  const ps = partyChars();
  const ok = c => !isGone(c) && c.status !== 'stoned';
  const f = ps.slice(0, 3).filter(ok);
  return f.length ? f : ps.filter(ok);
}
function magicSave(c) { return clamp(c.lv * 3 + (c.st[5] - 8) * 2, 0, 75); }

// ---- 味方の行動 ----
function doFight(c, act) {
  let g = B.groups[act.g] || B.groups[0];
  if (!g || !liveUnits(g).length) g = B.groups.find(x => liveUnits(x).length);
  if (!g) return;
  const m = MN[g.mid];
  let left = numAttacks(c);
  while (left > 0) {
    const lu = liveUnits(g);
    if (!lu.length) break;
    const u = pick(lu);
    let hits = 0, dmg = 0, dead = false, crit = false;
    while (left > 0 && !dead) {
      left--;
      const ac = m.ac + g.acMod + (u.st === 'sleep' ? 5 : 0);
      if (!pct(clamp(30 + 5 * hitSkill(c) + 4 * ac, 5, 95))) continue;
      hits++;
      if (!m.boss && pct(critChance(c))) { crit = true; dead = true; killUnit(g, u, c); break; }
      let d = Math.max(1, dice(weaponDmg(c)) + statBonus(c.st[0]));
      const w = equipped(c, 'wep');
      if (w && w.vsU && m.fl.includes('U')) d *= w.vsU;
      if (w && w.vsR && m.fl.includes('R')) d *= w.vsR;
      dmg += d;
      if (u.st === 'sleep' && pct(30)) u.st = 'ok';
      if (hurtUnit(g, u, d, c)) dead = true;
    }
    const nm = gname(g);
    if (crit) log(`${c.name}は ${nm}の 急所を突いた！　一撃でたおした！`);
    else if (!hits) log(`${c.name}の攻撃は ${nm}に 当たらない。`);
    else {
      log(`${c.name}は ${nm}に ${hits}回あたり、${dmg}のダメージ。`);
      if (dead) log(`${nm}を たおした！`);
    }
    if (!dead) break;
  }
}
function castOnEnemies(c, sp, gi, power) {
  const fx = sp.fx;
  const targets = sp.tg === 'all' ? B.groups.slice() : [B.groups[gi] || B.groups.find(x => liveUnits(x).length)].filter(Boolean);
  for (const g of targets) {
    const m = MN[g.mid], nm = gname(g);
    let units = liveUnits(g);
    if (!units.length) continue;
    if (sp.tg === 'one') units = [pick(units)];
    if (fx.dmg) {
      let killed = 0, resisted = 0, total = 0, hit = 0;
      for (const u of units) {
        if (!fx.pierce && m.mr && pct(m.mr)) { resisted++; continue; }
        const d = dice(fx.dmg); total += d; hit++;
        if (hurtUnit(g, u, d, c)) killed++;
      }
      if (hit) log(`${nm}${units.length > 1 ? 'たち' : ''}に ${sp.tg === 'one' ? total : '平均' + Math.round(total / hit)}のダメージ。`);
      if (resisted) log(`${nm}${resisted > 1 ? resisted + '体' : ''}は 呪文を はね返した。`);
      if (killed) log(killed > 1 || units.length > 1 ? `${nm}を ${killed}体たおした！` : `${nm}を たおした！`);
    }
    if (fx.sleep) {
      let n = 0;
      for (const u of units) {
        if (u.st !== 'ok' || m.fl.includes('X') || m.fl.includes('U')) continue;
        if (m.mr && pct(m.mr)) continue;
        if (pct(clamp(85 - 6 * m.lv, 5, 85))) { u.st = 'sleep'; n++; }
      }
      log(n ? `${nm}が ${n}体 眠った。` : `${nm}は 眠らなかった。`);
    }
    if (fx.acmod) { g.acMod = Math.min(9, g.acMod + fx.acmod); log(`${nm}の 守りが 弱まった。`); }
    if (fx.silence) {
      let n = 0;
      for (const u of units) if (!(m.mr && pct(m.mr)) && pct(clamp(80 - 3 * m.lv, 10, 80))) { u.sil = 1; n++; }
      log(n ? `${nm}${n > 1 ? n + '体' : ''}の 声が 封じられた。` : `${nm}には 効かなかった。`);
    }
    if (fx.death) {
      let n = 0;
      for (const u of units) {
        if (m.boss || m.fl.includes('U')) continue;
        if (m.mr && pct(m.mr)) continue;
        if (pct(clamp(80 - 4 * m.lv + (power || 0), 5, 80))) { killUnit(g, u, c); n++; }
      }
      log(n ? `${nm}が ${n}体 息絶えた！` : `${nm}には 効かなかった。`);
    }
    if (fx.undead) {
      if (!m.fl.includes('U')) { log(`${nm}には 効かない。`); continue; }
      let n = 0;
      for (const u of units) if (pct(clamp(60 + 5 * (c.lv - m.lv), 10, 95))) { killUnit(g, u, c); n++; }
      log(n ? `${nm}が ${n}体 消え去った！` : `${nm}は 消えなかった。`);
    }
  }
}
function applySpellInBattle(c, sp, act) {
  const fx = sp.fx;
  if (inAnti()) { log('呪文は かき消された……'); return; }
  if (sp.tg === 'one' || sp.tg === 'grp' || sp.tg === 'all') castOnEnemies(c, sp, act.g);
  if (fx.pac) { for (const p of partyChars()) if (B.cs[p.id]) B.cs[p.id].ac += fx.pac; log('味方の守りが 固くなった。'); }
  if (fx.stop) { B.stop = 1; log('時が 止まった！'); }
  if (fx.home) { B.over = 'home'; log('一行は 光に包まれた……'); }
  if (sp.tg === 'ally') {
    const t = byId(act.t);
    if (t) applyAllySpell(sp, t).forEach(log);
  }
}
function doSpell(c, act) {
  const sp = SP[act.sp];
  if (B.cs[c.id] && B.cs[c.id].sil) { log(`${c.name}は 声が出せず、呪文を唱えられない！`); return; }
  if (!canCast(c, sp)) { log(`${c.name}は ${sp.n}を もう唱えられない。`); return; }
  c.mp[sp.s][sp.lv - 1]--;
  log(`${c.name}は ${sp.n}を 唱えた。`);
  applySpellInBattle(c, sp, act);
}
function doItem(c, act) {
  const it = c.items[act.i];
  if (!it || it.id !== act.id) { log(`${c.name}は 道具を見つけられなかった。`); return; }
  const d = IT[it.id], sp = SP[d.use];
  log(`${c.name}は ${itemName(it)}を 使った。`);
  it.idf = 1;
  applySpellInBattle(c, sp, act);
  if (pct(d.brk || 0)) { c.items.splice(c.items.indexOf(it), 1); if (d.brk < 100) log(`${d.n}は 壊れてしまった。`); }
}
function doDispel(c, act) {
  const g = B.groups[act.g] || B.groups[0];
  if (!g) return;
  log(`${c.name}は 祈りを捧げ、不死の者を はらおうとした。`);
  castOnEnemies(c, { tg: 'grp', fx: { undead: 1 } }, B.groups.indexOf(g));
}
function canDispel(c) { const d = CLS[c.cls].dispel; return !!d && c.lv >= d; }

// ---- 敵の行動 ----
function monSpell(g, u, spId) {
  const m = MN[g.mid], sp = SP[spId], fx = sp.fx, nm = gname(g);
  log(`${nm}は ${sp.n}を 唱えた！`);
  if (inAnti()) { log('呪文は かき消された……'); return; }
  const ps = partyChars().filter(c => !isGone(c) && c.status !== 'stoned');
  if (fx.heal) {
    let best = null;
    for (const gg of B.groups) for (const x of liveUnits(gg)) if (!best || x.mhp - x.hp > best.mhp - best.hp) best = x;
    if (best) { const before = best.hp; best.hp = fx.heal === 'full' ? best.mhp : Math.min(best.mhp, best.hp + dice(fx.heal)); log(`敵の傷が ${best.hp - before} 回復した。`); }
    return;
  }
  if (fx.dmg) {
    const tg = sp.tg === 'one' ? [pick(frontTargets())].filter(Boolean) : ps;
    for (const c of tg) {
      let d = dice(fx.dmg);
      if (pct(magicSave(c))) d = Math.ceil(d / 2);
      log(`${c.name}に ${d}のダメージ。`);
      if (hurtChar(c, d)) log(`${c.name}は 死んだ。`);
    }
  }
  if (fx.sleep) {
    for (const c of ps) if (c.status === 'ok' && !pct(resistChance(c, 'sleep'))) { c.status = 'sleep'; log(`${c.name}は 眠ってしまった。`); }
  }
  if (fx.acmod) { for (const c of ps) if (B.cs[c.id]) B.cs[c.id].ac -= fx.acmod; log('味方の守りが 弱まった。'); }
  if (fx.silence) {
    for (const c of ps) if (B.cs[c.id] && !pct(magicSave(c))) { B.cs[c.id].sil = 1; log(`${c.name}は 声を封じられた。`); }
  }
  if (fx.death) {
    for (const c of ps) if (!pct(clamp(resistChance(c, 'death') + magicSave(c), 0, 95))) { c.hp = 0; c.status = 'dead'; c.poison = 0; log(`${c.name}は 息絶えた！`); }
  }
}
function monBreath(g, u) {
  const nm = gname(g);
  log(`${nm}は 炎を吐いた！`);
  const base = Math.max(1, Math.floor(u.hp / 2));
  for (const c of partyChars()) {
    if (isGone(c) || c.status === 'stoned') continue;
    let d = base;
    if (pct(magicSave(c))) d = Math.ceil(d / 2);
    log(`${c.name}に ${d}のダメージ。`);
    if (hurtChar(c, d)) log(`${c.name}は 死んだ。`);
  }
}
function monMelee(g, u) {
  const m = MN[g.mid], nm = gname(g);
  const t = pick(frontTargets());
  if (!t) return;
  let hits = 0, dmg = 0;
  const effects = [];
  for (const a of m.atk) {
    if (!pct(clamp(25 + 5 * m.lv + 4 * battleAC(t) + (t.status === 'sleep' ? 20 : 0), 5, 95))) continue;
    hits++; dmg += dice(a);
  }
  if (!hits) { log(`${nm}は ${t.name}に 襲いかかったが、外れた。`); return; }
  log(`${nm}は ${t.name}に ${hits}回あたり、${dmg}のダメージ。`);
  if (hurtChar(t, dmg)) { log(`${t.name}は 死んだ。`); return; }
  const fl = m.fl;
  if (fl.includes('C') && pct(7) && !pct(resistChance(t, 'death'))) { t.hp = 0; t.status = 'dead'; t.poison = 0; log(`${nm}は ${t.name}の 首をはねた！`); return; }
  if (fl.includes('D') && pct(30) && !pct(resistChance(t, 'drain'))) { if (drainLevel(t, 1)) log(`${t.name}は 生気を吸われた！　レベルが ${t.lv}に下がった。`); }
  if (fl.includes('S') && pct(25) && !pct(resistChance(t, 'stone'))) { t.status = 'stoned'; log(`${t.name}は 石になった！`); return; }
  if (fl.includes('Z') && pct(30) && !pct(resistChance(t, 'paralyze'))) { t.status = 'paralyzed'; log(`${t.name}は 体がしびれた！`); return; }
  if (fl.includes('P') && !t.poison && pct(30) && !pct(resistChance(t, 'poison'))) { t.poison = 1; log(`${t.name}は 毒をうけた。`); }
}
function monAct(g, u) {
  const m = MN[g.mid];
  const gi = B.groups.indexOf(g);
  if (m.sp && !u.sil && pct(m.caster || 40)) {
    let opts = m.sp.slice();
    const hurt = B.groups.some(gg => liveUnits(gg).some(x => x.hp < x.mhp * 0.6));
    if (!hurt) opts = opts.filter(s => !SP[s].fx.heal);
    if (opts.length) { monSpell(g, u, pick(opts)); return; }
  }
  if (m.br && pct(m.br)) { monBreath(g, u); return; }
  if (gi < 2) monMelee(g, u);
}

// ---- 1回分の戦い ----
// acts: {charId: {type, g, sp, t, i, id}}
function resolveRound(acts, mode) {
  B.msgs = [];
  B.round++;
  for (const id in B.cs) B.cs[id].parry = 0;
  const actors = [];
  if (mode !== 'enemy') {
    for (const c of partyChars()) {
      const a = acts[c.id];
      if (!a || !canAct(c)) continue;
      if (a.type === 'parry') { B.cs[c.id].parry = 1; continue; }
      actors.push({ c, a, init: ri(1, 10) + statBonus(c.st[4]) * 2 + (CLS[c.cls].id === 'NIN' ? 2 : 0) });
    }
  }
  let monsStop = false;
  if (mode !== 'party') {
    if (B.stop) { monsStop = true; B.stop = 0; log('敵は 止まった時の中で 動けない。'); }
    else for (const g of B.groups) for (const u of g.units) if (u.st === 'ok') actors.push({ g, u, init: ri(1, 10) + Math.floor(MN[g.mid].lv / 4) });
  }
  actors.sort((a, b) => b.init - a.init);
  for (const a of actors) {
    if (B.over) break;
    if (!B.groups.some(g => liveUnits(g).length)) break;
    if (partyChars().every(isDown)) break;
    if (a.c) {
      if (!canAct(a.c)) continue;
      const t = a.a.type;
      if (t === 'fight') doFight(a.c, a.a);
      else if (t === 'spell') doSpell(a.c, a.a);
      else if (t === 'item') doItem(a.c, a.a);
      else if (t === 'dispel') doDispel(a.c, a.a);
    } else {
      if (a.u.st !== 'ok') continue;
      monAct(a.g, a.u);
    }
  }
  endOfRound();
  return B.msgs;
}
function endOfRound() {
  for (const c of partyChars()) {
    if (c.status === 'sleep' && pct(40)) { c.status = 'ok'; log(`${c.name}は 目を覚ました。`); }
    if (c.poison && !isGone(c) && c.status !== 'stoned') {
      if (hurtChar(c, 1)) log(`${c.name}は 毒で 力尽きた……`);
    }
  }
  for (const g of B.groups) for (const u of g.units) if (u.st === 'sleep' && pct(20)) u.st = 'ok';
  B.groups = B.groups.filter(g => liveUnits(g).length);
  if (!B.over) {
    if (!B.groups.length) B.over = 'win';
    else if (partyChars().every(isDown)) B.over = 'lose';
  }
}
function tryFlee() {
  B.msgs = [];
  const ps = partyChars().filter(c => !isDown(c));
  const pl = ps.reduce((a, c) => a + c.lv, 0) / Math.max(1, ps.length);
  let ml = 0, n = 0;
  for (const g of B.groups) for (const u of liveUnits(g)) { ml += MN[g.mid].lv; n++; }
  ml = n ? ml / n : 1;
  const p = clamp(55 + 4 * (pl - ml) - (B.guard ? 40 : 0), 5, 95);
  if (pct(p)) { B.over = 'fled'; log('一行は 逃げ出した。'); return true; }
  log('逃げられなかった！');
  return false;
}
// 勝ったとき
function battleRewards() {
  const msgs = [];
  const ps = partyChars().filter(c => !isGone(c) && c.status !== 'stoned');
  const each = ps.length ? Math.floor(B.exp / ps.length) : 0;
  for (const c of ps) c.exp += each;
  for (const c of partyChars()) if (c.status === 'sleep') c.status = 'ok';
  if (each) msgs.push(`ひとりにつき ${each}の 経験値を 得た。`);
  if (B.gold) { S.gold += B.gold; msgs.push(`金貨を ${B.gold}枚 拾った。`); }
  for (const c of ps) if (c.exp >= expNeed(c, c.lv + 1)) { msgs.push('（宿屋で休むと、レベルが上がる者がいる）'); break; }
  return msgs;
}

// ---- view.js ----
// ===== 描画（ワイヤーフレームの迷宮・地図） =====
const COL = { line: '#e9e6d8', door: '#e9e6d8', lock: '#ff8a65', bg: '#000', floor: '#7d8a6a', dim: '#3a3f35' };
const FONT = '"Noto Sans Mono CJK JP","Noto Sans CJK JP","Noto Sans JP",monospace';

function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawView(cv) {
  const { ctx, w: W, h: H } = fitCanvas(cv);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const { f, x, y, d } = S.pos;
  ctx.lineJoin = 'round';
  if (isDark(f, x, y)) {
    ctx.fillStyle = COL.dim; ctx.font = `16px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('暗闇の中だ。何も見えない。', W / 2, H / 2);
    return;
  }
  const e = 0.75;
  const P = (X, z, Y) => [W / 2 + X * W * e / (z + e), H / 2 + Y * H * e / (z + e)];
  const R = (d + 1) & 3, L = (d + 3) & 3;
  let maxD = S.light > 0 ? 5 : 3;
  for (let dd = 1; dd <= maxD; dd++) {
    const cx = x + DX[d] * dd, cy = y + DY[d] * dd;
    if (!inb(cx, cy) || isDark(f, cx, cy)) { maxD = dd - 1; break; }
  }
  const lw = Math.max(1.2, W / 260);
  const poly = (pts, fill, stroke) => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  };
  // 壁1枚：(X1,z1)-(X2,z2) の縦の面
  const wall = (X1, z1, X2, z2, v) => {
    if (v === W_OPEN) return;
    poly([P(X1, z1, -0.5), P(X2, z2, -0.5), P(X2, z2, 0.5), P(X1, z1, 0.5)], COL.bg, COL.line);
    if (v === W_DOOR || v === W_LOCK) {
      const at = (u, Y) => P(X1 + (X2 - X1) * u, z1 + (z2 - z1) * u, Y);
      poly([at(0.22, 0.5), at(0.22, -0.28), at(0.78, -0.28), at(0.78, 0.5)], null, v === W_LOCK ? COL.lock : COL.door);
      if (v === W_LOCK) {
        const k = at(0.66, 0.12), r = Math.max(1.5, (at(0.78, 0)[0] - at(0.22, 0)[0]) * 0.04);
        ctx.beginPath(); ctx.arc(k[0], k[1], Math.abs(r), 0, Math.PI * 2); ctx.fillStyle = COL.lock; ctx.fill();
      }
    }
  };
  const stairs = (dd, l, up) => {
    const a = P(l - 0.3, dd + 0.2, 0.5), b = P(l + 0.3, dd + 0.2, 0.5), c = P(l + 0.3, dd + 0.8, 0.5), e2 = P(l - 0.3, dd + 0.8, 0.5);
    poly([a, b, c, e2], null, COL.floor);
    for (let i = 1; i < 4; i++) {
      const z = dd + 0.2 + 0.15 * i;
      const p1 = P(l - 0.3, z, 0.5), p2 = P(l + 0.3, z, 0.5);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.strokeStyle = COL.floor; ctx.lineWidth = lw; ctx.stroke();
    }
    if (dd <= 2) {
      const m = P(l, dd + 0.5, 0.5);
      const fs = Math.round(13 * (1.6 / (dd + 1.2)));
      ctx.font = `${fs}px ${FONT}`; ctx.textAlign = 'center';
      const tw = ctx.measureText('上り').width;
      ctx.fillStyle = COL.bg; ctx.fillRect(m[0] - tw / 2 - 3, m[1] - fs * 0.9, tw + 6, fs * 1.2);
      ctx.fillStyle = COL.floor; ctx.fillText(up ? '上り' : '下り', m[0], m[1]);
    }
  };
  const F = WORLD[f];
  for (let dd = maxD; dd >= 0; dd--) {
    for (const l of [-3, 3, -2, 2, -1, 1, 0]) {
      const cx = x + DX[d] * dd + DX[R] * l, cy = y + DY[d] * dd + DY[R] * l;
      if (!inb(cx, cy)) continue;
      if (dd > 0 && isDark(f, cx, cy)) continue;
      if (F.up && F.up.x === cx && F.up.y === cy) stairs(dd, l, true);
      if (F.down && F.down.x === cx && F.down.y === cy) stairs(dd, l, false);
      wall(l - 0.5, dd + 1, l + 0.5, dd + 1, viewWall(f, cx, cy, d));
      if (l <= 0) wall(l - 0.5, dd, l - 0.5, dd + 1, viewWall(f, cx, cy, L));
      if (l >= 0) wall(l + 0.5, dd, l + 0.5, dd + 1, viewWall(f, cx, cy, R));
    }
  }
}

// 地図
function drawMap(cv, f) {
  const { ctx, w: W, h: H } = fitCanvas(cv);
  ctx.fillStyle = '#050805'; ctx.fillRect(0, 0, W, H);
  const cs = Math.floor(Math.min(W, H) / MW), ox = Math.floor((W - cs * MW) / 2), oy = Math.floor((H - cs * MH) / 2);
  const F = WORLD[f];
  ctx.strokeStyle = '#1c241c'; ctx.lineWidth = 1;
  for (let i = 0; i <= MW; i++) {
    ctx.beginPath(); ctx.moveTo(ox + i * cs + 0.5, oy); ctx.lineTo(ox + i * cs + 0.5, oy + cs * MH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy + i * cs + 0.5); ctx.lineTo(ox + cs * MW, oy + i * cs + 0.5); ctx.stroke();
  }
  const seg = (x1, y1, x2, y2, col, w) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); };
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!isSeen(f, x, y)) continue;
    const px = ox + x * cs, py = oy + y * cs;
    ctx.fillStyle = F.room[ci(x, y)] >= 0 ? '#22301f' : '#172016';
    ctx.fillRect(px + 1, py + 1, cs - 1, cs - 1);
    const sp = F.sp[ci(x, y)];
    for (let d = 0; d < 4; d++) {
      let v = getW(F, x, y, d);
      if (v === W_SECRET) v = secretFound(f, x, y, d) ? W_DOOR : W_WALL;
      if (v === W_OPEN) continue;
      const pts = [[px, py, px + cs, py], [px + cs, py, px + cs, py + cs], [px, py + cs, px + cs, py + cs], [px, py, px, py + cs]][d];
      seg(pts[0], pts[1], pts[2], pts[3], '#d8e6c8', 2);
      if (v === W_DOOR || v === W_LOCK) {
        const mx = (pts[0] + pts[2]) / 2, my = (pts[1] + pts[3]) / 2, q = cs * 0.22;
        if (d === 0 || d === 2) seg(mx - q, my, mx + q, my, v === W_LOCK ? COL.lock : '#7fb0ff', 3);
        else seg(mx, my - q, mx, my + q, v === W_LOCK ? COL.lock : '#7fb0ff', 3);
      }
    }
    let mark = '';
    if (F.up && F.up.x === x && F.up.y === y) mark = f === 1 ? '出' : '上';
    else if (F.down && F.down.x === x && F.down.y === y) mark = '下';
    else if (sp && sp.t === 'fount') mark = '泉';
    else if (sp && sp.t === 'msg') mark = '文';
    if (mark) {
      ctx.fillStyle = '#ffe082'; ctx.font = `${Math.floor(cs * 0.62)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(mark, px + cs / 2, py + cs / 2 + 1);
    }
  }
  // 亡骸
  for (const c of S.roster) if (c.maze && c.maze.f === f) {
    ctx.fillStyle = '#ff8a80'; ctx.font = `${Math.floor(cs * 0.7)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('†', ox + c.maze.x * cs + cs / 2, oy + c.maze.y * cs + cs / 2);
  }
  // 自分の位置
  if (S.inMaze && S.pos.f === f) {
    const cx = ox + S.pos.x * cs + cs / 2, cy = oy + S.pos.y * cs + cs / 2, r = cs * 0.38;
    const a = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][S.pos.d];
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    ctx.lineTo(cx + Math.cos(a + 2.5) * r, cy + Math.sin(a + 2.5) * r);
    ctx.lineTo(cx + Math.cos(a - 2.5) * r, cy + Math.sin(a - 2.5) * r);
    ctx.closePath(); ctx.fillStyle = '#ffeb3b'; ctx.fill();
  }
  ctx.textBaseline = 'alphabetic';
}

// ---- ui.js ----
// ===== 画面の部品 =====
const $ = s => document.querySelector(s);
const UI = { busy: false, playing: false, skip: null, screen: null };
let ACT = {}, PEND = {}, actN = 0;   // PEND: 作ったばかりで、まだ画面に出していないボタン
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function br(s) { return esc(s).replace(/\n/g, '<br>'); }
function b(label, fn, cls, dis) {
  const id = 'a' + (actN++); PEND[id] = fn;
  return `<button class="btn ${cls || ''}" data-a="${id}"${dis ? ' disabled' : ''}>${label}</button>`;
}
function render(html) { ACT = PEND; PEND = {}; $('#app').innerHTML = html; }
document.addEventListener('click', e => {
  if (UI.playing && UI.skip) { UI.skip(); return; }
  if ($('#ov').childElementCount) return;
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a];
  if (fn) fn();
});
function vib(ms) { try { if (S && S.opts.vib && navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }
function wait(ms) { return new Promise(r => { const t = setTimeout(r, ms); UI.skip = () => { clearTimeout(t); UI.skip = null; r(); }; }); }

// ---- モーダル ----
function modal(inner, setup) {
  return new Promise(resolve => {
    const ov = $('#ov');
    const box = document.createElement('div');
    box.className = 'modal';
    box.innerHTML = `<div class="mbox">${inner}</div>`;
    ov.appendChild(box);
    const close = v => { box.remove(); resolve(v); };
    setup(box, close);
  });
}
function alertMsg(text, btn) {
  return modal(`<div class="mtext">${br(text)}</div><div class="mbtns"><button class="btn wide" data-v="ok">${btn || 'OK'}</button></div>`,
    (box, close) => box.querySelector('[data-v]').onclick = () => close(true));
}
function askYesNo(text, yes, no) {
  return modal(`<div class="mtext">${br(text)}</div><div class="mbtns row"><button class="btn" data-v="1">${yes || 'はい'}</button><button class="btn" data-v="0">${no || 'いいえ'}</button></div>`,
    (box, close) => box.querySelectorAll('[data-v]').forEach(el => el.onclick = () => close(el.dataset.v === '1')));
}
// opts: [{label, value, dis, sub}] / 戻る付き
function choose(title, opts, cancel) {
  const tt = typeof title === 'object' ? title.html : br(title);
  const items = opts.map((o, i) => `<button class="btn opt" data-i="${i}"${o.dis ? ' disabled' : ''}>${o.label}${o.sub ? `<span class="sub">${o.sub}</span>` : ''}</button>`).join('');
  return modal(`<div class="mtitle">${tt}</div><div class="mlist">${items}</div>` +
    (cancel !== false ? `<div class="mbtns"><button class="btn wide ghost" data-c="1">${cancel || '戻る'}</button></div>` : ''),
    (box, close) => {
      box.querySelectorAll('[data-i]').forEach(el => el.onclick = () => close(opts[+el.dataset.i].value));
      const c = box.querySelector('[data-c]'); if (c) c.onclick = () => close(null);
    });
}
function inputText(title, def, max) {
  return modal(`<div class="mtitle">${br(title)}</div><input class="inp" maxlength="${max || 8}" value="${esc(def || '')}"><div class="mbtns row"><button class="btn" data-v="1">決める</button><button class="btn ghost" data-v="0">戻る</button></div>`,
    (box, close) => {
      const inp = box.querySelector('input');
      setTimeout(() => inp.focus(), 50);
      box.querySelectorAll('[data-v]').forEach(el => el.onclick = () => close(el.dataset.v === '1' ? inp.value.trim() : null));
    });
}
function textArea(title, val, ro) {
  return modal(`<div class="mtitle">${br(title)}</div><textarea class="ta"${ro ? ' readonly' : ''}>${esc(val || '')}</textarea><div class="mbtns row">${ro ? '<button class="btn" data-v="copy">写す</button>' : '<button class="btn" data-v="1">読み込む</button>'}<button class="btn ghost" data-v="0">閉じる</button></div>`,
    (box, close) => {
      const ta = box.querySelector('textarea');
      box.querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
        if (el.dataset.v === 'copy') {
          ta.select();
          try { navigator.clipboard.writeText(ta.value).then(() => el.textContent = '写した', () => { document.execCommand('copy'); el.textContent = '写した'; }); }
          catch (e) { try { document.execCommand('copy'); el.textContent = '写した'; } catch (e2) { } }
          return;
        }
        close(el.dataset.v === '1' ? ta.value : null);
      });
    });
}
async function pickChar(title, chars, sub) {
  if (!chars.length) return null;
  return choose(title, chars.map(c => ({ label: esc(c.name), sub: sub ? sub(c) : `${CLS[c.cls].n} Lv${c.lv} ${statusText(c) || 'HP' + c.hp}`, value: c })));
}

// ---- メッセージ欄 ----
function setMsg(t) { const m = $('#msg'); if (m) m.innerHTML = t ? `<div>${br(t)}</div>` : ''; }
function addMsg(t) {
  const m = $('#msg'); if (!m) return;
  const d = document.createElement('div'); d.innerHTML = br(t); m.appendChild(d);
  while (m.childElementCount > 40) m.firstChild.remove();
  m.scrollTop = m.scrollHeight;
}
const SPEED = [1100, 650, 300];
async function play(list, keep) {
  if (!list || !list.length) return;
  UI.playing = true;
  if (!keep) setMsg('');
  for (const it of list) {
    const t = typeof it === 'string' ? it : it.t;
    addMsg(t);
    if (it.snap) {
      const prev = UI.lastSnap;
      if (prev && it.snap.p.some((p, i) => prev.p[i] && p.hp < prev.p[i].hp)) vib(40);
      applySnap(it.snap);
    }
    await wait(SPEED[S.opts.speed] || 650);
  }
  UI.playing = false; UI.skip = null;
}
function applySnap(sn) {
  UI.lastSnap = sn;
  const el = $('#party'); if (el) el.innerHTML = partyRows(sn.p);
  const g = $('#enemies'); if (g && sn.g) g.innerHTML = enemyRows(sn.g);
}

// ---- パーティ表 ----
function partyRows(snapP) {
  const ps = partyChars();
  if (!ps.length) return '<div class="empty">パーティに誰もいない</div>';

    const s = snapP && snapP[i] ? snapP[i] : { hp: c.hp, st: c.status, poison: c.poison };
    const stt = s.st !== 'ok' ? STATUS_N[s.st] : s.poison ? '毒' : '';
    const low = s.st === 'ok' && s.hp < c.mhp * 0.3;
    return `<div class="prow ${s.st !== 'ok' && s.st !== 'sleep' ? 'down' : ''} ${low ? 'low' : ''}" data-ci="${i}">

      <span class="pa">${charAC(c) - (typeof B !== 'undefined' && B && B.cs[c.id] ? B.cs[c.id].ac : 0)}</span>
      <span class="ph">${s.hp}/${c.mhp}</span>
      <span class="ps">${stt}</span></div>`;

}
function partyBox() {
  return `<div class="ptable"><div class="prow head"><span class="pn">名前</span><span class="pc">職</span><span class="pa">AC</span><span class="ph">HP</span><span class="ps">状態</span></div><div id="party">${partyRows()}</div></div>`;
}
function enemyRows(gs) {
  if (!gs.length) return '<div class="erow">敵はいない</div>';
  return gs.map((g, i) => `<div class="erow"><span>${i + 1}) ${esc(g.n)}</span><span>×${g.a}${g.s ? `（眠り${g.s}）` : ''}</span></div>`).join('');
}
function header(title, extra) {

}

// ---- キャラクターの詳細 ----
function charSheetHtml(c) {
  const race = RACES.find(r => r.id === c.race);
  const next = expNeed(c, c.lv + 1);
  const stat = c.st.map((v, i) => `<div><b>${STATS[i]}</b> ${v}</div>`).join('');
  const m = maxSlots(c, 'm'), p = maxSlots(c, 'p');
  const sl = (a, b) => a.some(v => v) ? a.map((v, i) => `${b[i]}/${v}`).join(' ') : 'なし';
  const sp = knownSpells(c).map(s => s.n).join('・') || 'なし';
  return `<div class="sheet">
    <div class="sh1">${esc(c.name)}${c.honor ? ' ★' : ''}</div>
    <div>${ALIGNS[c.al]}の${race.n}　${CLS[c.cls].n}　レベル${c.lv}</div>
    <div>HP ${c.hp}/${c.mhp}　AC ${charAC(c)}　${statusText(c) || '健康'}</div>
    <div>経験値 ${c.exp}（次まで ${Math.max(0, next - c.exp)}）　倒した数 ${c.kills || 0}</div>
    <div class="stats">${stat}</div>
    <div>魔術 ${sl(c.mp.m, m)}</div><div>祈祷 ${sl(c.mp.p, p)}</div>
    <div class="small">覚えた呪文：${sp}</div>
  </div>`;
}
function itemLine(it) {
  const d = IT[it.id];
  return `${it.eq ? '<b class="eq">装</b>' : '<span class="eq0">・</span>'}${esc(itemName(it))}${it.cur ? '<span class="cur">呪</span>' : ''}<span class="sub">${KIND_N[d.kind]}</span>`;
}
// where: 'town' | 'camp'
async function charSheet(c, where) {
  for (;;) {
    const opts = c.items.map((it, i) => ({ label: itemLine(it), value: i }));
    const r = await choose({ html: charSheetHtml(c) + '<div class="mtitle2">持ち物（押すと使い方を選べる）</div>' }, opts.length ? opts : [{ label: '持ち物はない', value: -1, dis: true }], '閉じる');
    if (r === null) return;
    await itemMenu(c, r, where);
    saveGame();
    if (where === 'camp' && typeof refreshCamp === 'function') refreshCamp();
  }
}
async function itemMenu(c, idx, where) {
  const it = c.items[idx]; if (!it) return;
  const d = IT[it.id];
  const o = [];
  if (EQ_KINDS.includes(d.kind)) o.push(it.eq ? { label: '外す', value: 'un' } : { label: '装備する', value: 'eq', dis: !canEquipCls(c, d) || isDown(c) });
  if (d.use) o.push({ label: '使う', value: 'use', dis: where !== 'camp' || !SP[d.use].w.includes('c') || !canAct(c) });
  if (d.kind !== 'key') o.push({ label: '仲間に渡す', value: 'give', dis: !!it.eq });
  if (!it.idf && d.kind !== 'key') o.push({ label: '司教が鑑定する', value: 'ident' });
  if (d.kind !== 'key') o.push({ label: '捨てる', value: 'drop', dis: !!it.eq });
  const info = it.idf ? itemInfo(d) : 'まだ正体がわからない。';
  const r = await choose(`${itemName(it)}\n${info}`, o);
  if (!r) return;
  if (r === 'eq') await alertMsg(equipItem(c, idx));
  else if (r === 'un') await alertMsg(unequipItem(c, idx));
  else if (r === 'give') {
    const others = (where === 'camp' ? partyChars() : partyChars().concat(S.roster.filter(inTown))).filter(x => x !== c);
    const t = await pickChar('誰に渡す？', others, x => `持ち物 ${x.items.length}/${MAXI}`);
    if (!t) return;
    if (t.items.length >= MAXI) { await alertMsg(`${t.name}は もう持てない。`); return; }
    c.items.splice(idx, 1); t.items.push(it);
    await alertMsg(`${t.name}に 渡した。`);
  } else if (r === 'drop') {
    if (await askYesNo(`${itemName(it)}を 捨てるか？`)) c.items.splice(idx, 1);
  } else if (r === 'ident') {
    const bs = (where === 'camp' ? partyChars() : partyChars().concat(S.roster.filter(inTown))).filter(x => CLS[x.cls].ident && canAct(x));
    if (!bs.length) { await alertMsg('鑑定できる司教がいない。'); return; }
    const bi = bs.length === 1 ? bs[0] : await pickChar('誰が鑑定する？', bs, x => `成功率 ${identifyChance(x)}%`);
    if (!bi) return;
    if (pct(identifyChance(bi))) { it.idf = 1; await alertMsg(`${bi.name}は 鑑定した。\nこれは ${d.n}だ。`); }
    else await alertMsg(`${bi.name}にも わからなかった。`);
  } else if (r === 'use') {
    await useItemCamp(c, idx);
  }
}
function itemInfo(d) {
  const a = [];
  if (d.dmg) a.push(`威力 ${dstr(d.dmg)}`);
  if (d.hit) a.push(`命中 ${d.hit > 0 ? '+' : ''}${d.hit}`);
  if (d.ac) a.push(`AC ${d.ac > 0 ? '-' : '+'}${Math.abs(d.ac)}`);
  if (d.use) a.push(`使うと「${SP[d.use].n}」`);
  if (d.regen) a.push('歩くとHPが回復');
  if (d.drain) a.push('歩くとHPが減る');
  if (d.noPoison) a.push('毒を防ぐ');
  if (d.noDrain) a.push('生気を吸われない');
  if (d.vsU) a.push('不死の敵に強い');
  if (d.vsR) a.push('竜に強い');
  if (d.crit) a.push('急所を突きやすい');
  if (d.curse) a.push('呪われている');
  if (d.kind !== 'key' && d.kind !== 'use') a.push('装備：' + (d.cls === ALLC ? '全員' : d.cls));
  return a.join('　');
}

function alignClash(c) {
  const als = partyChars().map(x => x.al);
  return (c.al === 0 && als.includes(2)) || (c.al === 2 && als.includes(0));
}
async function tavernAdd() {
  for (;;) {
    const waiting = S.roster.filter(inTown);
    if (S.party.length >= MAXP || !waiting.length) break;
    const c = await pickChar('誰を仲間に入れる？', waiting, x => `${ALIGNS[x.al]} ${CLS[x.cls].n} Lv${x.lv} ${statusText(x)}`);
    if (!c) break;
    if (alignClash(c)) { await alertMsg('善の者と悪の者は、一緒に行こうとしない。'); continue; }
    S.party.push(c.id); saveGame();
    scrTavern(`${c.name}が 仲間に入った。`);
  }
  scrTavern();
}
async function tavernRemove() {
  const c = await pickChar('誰を外す？', partyChars());
  if (!c) return;
  S.party = S.party.filter(id => id !== c.id); saveGame();
  scrTavern(`${c.name}は 酒場で待つことにした。`);
}
async function reorderParty() {
  const left = partyChars().slice(), order = [];
  while (left.length > 1) {
    const c = await pickChar(`${order.length + 1}番目は誰？\n（1〜3番目が前に出て戦う）`, left);
    if (!c) return;
    order.push(c); left.splice(left.indexOf(c), 1);
  }
  order.push(left[0]);
  S.party = order.map(c => c.id); saveGame();
}

async function shopBuy() {
  const who = await pickChar('誰が買う？', shopMembers().filter(c => !isGone(c)), c => `持ち物 ${c.items.length}/${MAXI}`);
  if (!who) return;
  for (;;) {
    const list = shopList().sort((a, b) => EQ_KINDS.concat(['use']).indexOf(a.kind) - EQ_KINDS.concat(['use']).indexOf(b.kind) || a.price - b.price);
    const opts = list.map(d => {
      const ok = d.kind === 'use' || canEquipCls(who, d);
      const stock = d.dep ? `　残り${S.shop[d.id]}` : '';
      return { label: `${ok ? '' : '<span class="ng">×</span>'}${d.n}　<b>${d.price}G</b>`, sub: `${KIND_N[d.kind]}　${itemInfo(d)}${stock}`, value: d };
    });
    const d = await choose(`${who.name}が買う（所持金 ${S.gold}G・持ち物 ${who.items.length}/${MAXI}）\n×は${CLS[who.cls].n}には装備できない`, opts);
    if (!d) break;
    if (S.gold < d.price) { await alertMsg('「お金が足りないね」'); continue; }
    if (who.items.length >= MAXI) { await alertMsg(`${who.name}は もう持てない。`); continue; }
    S.gold -= d.price; addItem(who, d.id, 1);
    if (d.dep) S.shop[d.id]--;
    if (EQ_KINDS.includes(d.kind) && canEquipCls(who, d) && await askYesNo(`${d.n}を買った。\nすぐに装備するか？`)) await alertMsg(equipItem(who, who.items.length - 1));
    saveGame();
  }
  scrShop();
}
async function shopSell() {
  const who = await pickChar('誰が売る？', shopMembers().filter(c => c.items.length), c => `持ち物 ${c.items.length}/${MAXI}`);
  if (!who) return;
  for (;;) {
    const opts = who.items.map((it, i) => ({ label: itemLine(it), sub: it.eq ? '装備中' : IT[it.id].kind === 'key' ? '売れない' : `${sellPrice(it)}G${it.idf ? '' : '（正体不明なので安い）'}`, value: i, dis: !!it.eq || IT[it.id].kind === 'key' }));
    if (!opts.length) break;
    const i = await choose(`${who.name}が売る（所持金 ${S.gold}G）`, opts);
    if (i === null) break;
    const it = who.items[i], p = sellPrice(it);

    LOR: '強い戦士。祈祷の呪文も覚える', NIN: '素手で急所を突く。罠も外せる',

const AUTO_NAMES = ['アレス', 'ボルグ', 'セラ', 'リュカ', 'ミーナ', 'ノエル', 'ガルド', 'エリン', 'トーマ', 'ユーリ', 'カイ', 'リラ', 'ダン', 'フィオ', 'オルン', 'シエラ'];
function autoParty() {
  const spec = [['FIG', 'hum', 1, [0, 3, 4]], ['FIG', 'dwa', 1, [0, 3, 4]], ['PRI', 'dwa', 0, [2, 3, 0]], ['THI', 'hob', 1, [4, 5, 3]], ['MAG', 'elf', 1, [1, 4, 3]], ['BIS', 'elf', 0, [1, 2, 3]]];
  // おまかせの6人には、最初から基本の装備を持たせる
  const gear = { FIG: ['w05', 'a02', 's01'], PRI: ['w03', 'a02', 's01', 'u01'], THI: ['w04', 'a02', 's01'], MAG: ['w02', 'a01'], BIS: ['w02', 'a01'] };
  const used = new Set(S.roster.map(c => c.name));
  for (const [cls, race, al, prio] of spec) {
    const k = CLS[cls], st = RACES.find(r => r.id === race).base.slice();
    let pts = Math.max(rollBonus(), 7);
    for (let i = 0; i < 6; i++) while (st[i] < k.req[i] && pts > 0) { st[i]++; pts--; }
    let guard = 0;
    while (pts > 0 && guard++ < 100) for (const i of prio) if (pts > 0 && st[i] < 18) { st[i]++; pts--; }
    let name = AUTO_NAMES.find(n => !used.has(n)) || ('冒険者' + S.nextId);
    used.add(name);
    const c = newChar(name, race, al, st, cls);
    for (const id of gear[cls]) { addItem(c, id, 1); if (IT[id].kind !== 'use') equipItem(c, c.items.length - 1); }
    S.roster.push(c); S.gold += ri(60, 120);
    if (S.party.length < MAXP && !alignClash(c)) S.party.push(c.id);
  }
}

// その場所に着いたとき
async function arrive() {
  const { f, x, y } = S.pos, F = WORLD[f], c = ci(x, y);
  if (!isDark(f, x, y)) markSeen(f, x, y);
  if (f > S.deepest) S.deepest = f;
  const bodies = bodiesHere();
  if (bodies.length) await bodiesFlow(bodies);
  const sp = F.sp[c];
  const prevT = UI.lastCellT; UI.lastCellT = sp ? sp.t : null;
  if (sp) {
    if (sp.t === 'msg') await alertMsg(FLOOR_MSG[f][sp.m]);
    else if (sp.t === 'pit') { if (await pitFlow(f)) return; }
    else if (sp.t === 'chute') {
      if (S.levit) setMsg('床に大きな穴がある。浮いているので落ちずにすんだ。');
      else {
        await alertMsg('床が抜けた！\n一行は 下の階へ 落ちていった……');
        S.pos.f = f + 1; UI.lastCellT = null;
        updateMaze();
        return arrive();
      }
    } else if (sp.t === 'tele') {
      const p = randomSafeCell(f);
      S.pos.x = p.x; S.pos.y = p.y; markSeen(f, p.x, p.y); UI.lastCellT = null;
      updateMaze();
      await alertMsg('足元が光った！\n……気がつくと、別の場所にいた。');
      return;
    } else if (sp.t === 'spin') S.pos.d = ri(0, 3);
    else if (sp.t === 'fount') await fountFlow();
    else if (sp.t === 'anti' && prevT !== 'anti') setMsg('空気が重い。呪文が効かない気がする……');
    else if (sp.t === 'dark' && prevT !== 'dark') setMsg('暗闇に入った。');
  }
  updateMaze();
  if (F.up.x === x && F.up.y === y) {
    if (await askYesNo(f === 1 ? '上り階段だ。町へ戻るか？' : '上り階段だ。上るか？')) {
      if (f === 1) { await returnTown(); return; }
      S.pos.f = f - 1; markSeen(S.pos.f, x, y); UI.lastCellT = null;
      updateMaze(); setMsg(`B${f - 1}Fに 上った。`);
      return;
    }
  }
  if (F.down && F.down.x === x && F.down.y === y) {
    if (await askYesNo('下り階段だ。下りるか？')) {
      S.pos.f = f + 1; markSeen(S.pos.f, x, y); UI.lastCellT = null;
      if (S.pos.f > S.deepest) S.deepest = S.pos.f;
      updateMaze(); setMsg(`B${f + 1}Fに 下りた。`);
      return;
    }
  }
  const r = F.room[c];
  if (r >= 0) {
    if (r === F.guardRoom && GUARDS[f]) {
      if (guardActive(f)) { S.guards[f] = 1; await guardFlow(f); return; }
    } else {
      const k = f + ':' + r;
      if (!S.rooms[k]) {
        S.rooms[k] = 1;
        if (pct(70)) { await battleFlow(randomEncounter(f), { chest: true, text: '部屋の中に 何者かがいる！' }); return; }
      }
    }
  }
  if (pct(ENC_RATE)) await battleFlow(randomEncounter(f), { chest: pct(15) });
}
function guardActive(f) {
  const g = GUARDS[f];
  if (S.guards[f]) return false;
  if (g.boss) return !S.boss;
  if (!S.guardDone) S.guardDone = {};
  return !S.guardDone[f] || !rosterHasKey(g.key);
}
async function guardFlow(f) {
  const g = GUARDS[f];
  await battleFlow(guardEncounter(f), { guard: f, boss: !!g.boss, text: g.text, chest: !g.boss });
}
async function pitFlow(f) {
  if (S.levit) { setMsg('落とし穴の上を ふわりと越えた。'); return false; }
  const msgs = ['落とし穴だ！'];
  for (const c of partyChars()) {
    if (isGone(c) || c.status === 'stoned') continue;
    const d = ri(f, f * 4 + 3);
    c.hp -= d; msgs.push(`${c.name}に ${d}のダメージ。`);
    if (c.hp <= 0) { c.hp = 0; c.status = 'dead'; c.poison = 0; msgs.push(`${c.name}は 死んだ。`); }
  }
  vib(80);
  updateMaze(); await play(msgs, true); updateMaze();
  if (partyWiped()) { await wipeFlow(); return true; }
  return false;
}
async function fountFlow() {
  if (!await askYesNo('石の泉がある。水を飲むか？')) return;
  const r = rnd();
  const ps = partyChars().filter(c => !isGone(c) && c.status !== 'stoned');
  if (r < 0.5) { for (const c of ps) { c.hp = c.mhp; c.poison = 0; } await alertMsg('冷たい水が 体にしみわたる。\n全員の傷が 癒えた！'); }
  else if (r < 0.75) { for (const c of ps) if (!pct(resistChance(c, 'poison'))) c.poison = 1; await alertMsg('うっ……　水に毒が混じっていた！'); }
  else await alertMsg('ただの水だった。');
  updateMaze();
}
async function bodiesFlow(bodies) {
  const names = bodies.map(c => c.name).join('、');
  const room = MAXP - S.party.length;
  if (room <= 0) { await alertMsg(`仲間の亡骸がある：${names}\n連れて行く余裕がない。（パーティは6人まで）`); return; }
  if (!await askYesNo(`仲間の亡骸がある：${names}\n連れて帰るか？`)) return;
  const take = bodies.slice(0, room);
  for (const c of take) { c.maze = null; S.party.push(c.id); }
  updateMaze();
  await alertMsg(`${take.map(c => c.name).join('、')}を 連れて行くことにした。` + (take.length < bodies.length ? '\n（全員は連れて行けなかった）' : ''));
}
async function wipeFlow() {
  updateMaze();
  await alertMsg('……パーティは 全滅した。', '……');
  wipeParty(); saveGame();
  scrTown('全滅した一行の亡骸は、迷宮に残された。\n別の仲間で その場所まで行けば、連れて帰れる。');
}
async function returnTown(note) {
  leaveMaze();
  const orb = partyChars().some(c => c.items.some(i => i.id === 'k04'));
  saveGame();
  if (orb) { await endingFlow(); return; }
  scrTown(note || '一行は 町に戻った。');
}
async function endingFlow() {
  for (const c of S.roster) c.items = c.items.filter(i => i.id !== 'k04');
  S.cleared++; S.gold += 50000;
  for (const c of partyChars()) c.honor = 1;
  saveGame();
  render(`<div class="title"><div class="logo">灰の迷宮</div><div class="story">${br(`王の宝珠は、玉座に戻った。

王は一行を迎え入れ、その名を 城の石碑に刻ませた。
${partyChars().map(c => '　' + c.name).join('\n')}

（全員に ★ の印がついた。褒美として 50000G を得た）

迷宮は まだそこにある。
冒険を続けることもできる。`)}</div><div class="menu">${b('町へ', () => scrTown('王の宝珠を取り戻した英雄たちが 帰ってきた。'))}</div></div>`);
}

function scrMap(f) {
  UI.screen = 'map'; UI.rowClick = null;
  const floors = []; for (let i = 1; i <= S.deepest; i++) if (S.seen[i] && S.seen[i].includes('1')) floors.push(i);
  if (!floors.includes(f)) floors.push(f);
  floors.sort((a, b) => a - b);
  const i = floors.indexOf(f);
  render(`${header(`B${f}F の地図`, S.inMaze && S.pos.f === f ? dispXY(S.pos.x, S.pos.y) : '')}
    <canvas id="map" class="mapc"></canvas>
    <div class="note small">黄色の三角が今いる所。青は扉、赤は鍵の扉。上・下は階段、出は町への出口、文は石壁の文字、†は仲間の亡骸。隠し扉は見つけるまで壁に見える。</div>
    <div class="pad two">
      ${b('◀ 上の階', () => scrMap(floors[i - 1]), 'ghost', i <= 0)}${b('下の階 ▶', () => scrMap(floors[i + 1]), 'ghost', i >= floors.length - 1)}
    </div>
    <div class="menu">${b('戻る', () => S.inMaze ? (UI.campOpen ? scrCamp() : scrMaze()) : scrTown())}</div>`);
  drawMap($('#map'), f);
}

function scrCamp(note) {
  UI.screen = 'camp'; UI.campOpen = true; UI.rowClick = i => charSheet(partyChars()[i], 'camp').then(() => refreshCamp());

      ${b('並べ替え', async () => { await reorderParty(); scrCamp(); }, '', S.party.length < 2)}
      ${b('まとめて鑑定', campIdentAll, '', !bis)}
      ${b('地図', () => scrMap(S.pos.f))}

function refreshCamp() { if (UI.screen === 'camp') { const p = $('#party'); if (p) p.innerHTML = partyRows(); } }
async function campCast() {
  const casters = partyChars().filter(c => canAct(c) && knownSpells(c).some(s => s.w.includes('c')));
  const c = await pickChar('誰が唱える？', casters, x => `魔 ${x.mp.m.join('/')}　祈 ${x.mp.p.join('/')}`);
  if (!c) return;
  const sps = knownSpells(c).filter(s => s.w.includes('c'));
  const sp = await choose(`${c.name}の呪文`, sps.map(s => ({ label: `${s.n}<span class="lv">${s.s === 'm' ? '魔' : '祈'}${s.lv}</span>　残${c.mp[s.s][s.lv - 1]}`, sub: s.d, value: s, dis: !canCast(c, s) })));
  if (!sp) return;
  let t = null;
  if (sp.tg === 'ally') { t = await pickChar(`${sp.n}を 誰に？`, partyChars()); if (!t) return; }
  c.mp[sp.s][sp.lv - 1]--;
  await campEffect(campSpell(sp, t), `${c.name}は ${sp.n}を 唱えた。`);
}
async function campUse() {
  const users = partyChars().filter(c => canAct(c) && c.items.some(i => IT[i.id].use && SP[IT[i.id].use].w.includes('c')));
  const c = await pickChar('誰が使う？', users);
  if (!c) return;
  const opts = c.items.map((it, i) => ({ it, i })).filter(o => IT[o.it.id].use && SP[IT[o.it.id].use].w.includes('c')).map(o => ({ label: itemLine(o.it), value: o.i }));
  const i = await choose('どれを使う？', opts);
  if (i === null) return;
  await useItemCamp(c, i);
}
async function useItemCamp(c, i) {
  const it = c.items[i], d = IT[it.id], sp = SP[d.use];
  if (!S.inMaze || !sp.w.includes('c')) { await alertMsg('ここでは使えない。'); return; }
  let t = null;
  if (sp.tg === 'ally') { t = await pickChar(`誰に使う？`, partyChars()); if (!t) return; }
  it.idf = 1;
  const out = campSpell(sp, t);
  if (pct(d.brk || 0)) { c.items.splice(c.items.indexOf(it), 1); if (d.brk < 100) out.msgs.push(`${d.n}は 壊れてしまった。`); }
  await campEffect(out, `${c.name}は ${d.n}を 使った。`);
}
async function campEffect(out, first) {
  saveGame();
  if (UI.screen === 'camp') { refreshCamp(); setMsg(''); await play([first, ...out.msgs], true); refreshCamp(); }
  else await alertMsg([first, ...out.msgs].join('\n'));
  removeLost(); saveGame();
  if (out.home) { S.gold = Math.floor(S.gold / 2); await alertMsg('一行は 光に包まれ……\n気がつくと 町に戻っていた。（所持金が半分になった）'); await returnTown(); return; }
  if (out.warp) {
    const opts = [{ label: '町へ', value: 0 }];
    for (let f = 1; f <= S.deepest; f++) opts.push({ label: `B${f}F の上り階段へ`, value: f });
    const f = await choose('どこへ移る？', opts, 'やめる');
    if (f === null) return;
    if (f === 0) { await returnTown('一行は 町に移った。'); return; }
    S.pos = { f, x: WORLD[f].up.x, y: WORLD[f].up.y, d: 0 }; markSeen(f, S.pos.x, S.pos.y); UI.lastCellT = null; saveGame();
    UI.campOpen = false; scrMaze(`B${f}Fに 移った。`);
  }
}
async function campIdentAll() {
  const bs = partyChars().filter(c => CLS[c.cls].ident && canAct(c));
  const bi = bs.length === 1 ? bs[0] : await pickChar('誰が鑑定する？', bs, x => `成功率 ${identifyChance(x)}%`);
  if (!bi) return;
  const msgs = [];
  for (const c of partyChars()) for (const it of c.items) if (!it.idf) {
    if (pct(identifyChance(bi))) { it.idf = 1; msgs.push(`${IT[it.id].unk} → ${IT[it.id].n}（${c.name}）`); }
    else msgs.push(`${IT[it.id].unk}は わからなかった。（${c.name}）`);
  }
  saveGame(); refreshCamp();
  await play(msgs.length ? msgs : ['正体のわからない物はない。'], false);
}

// ---- 宝箱 ----
async function chestFlow(ch) {
  const names = TRAPS;
  for (;;) {
    const priest = partyChars().find(c => canAct(c) && knownSpells(c).some(s => s.id === 'wana') && c.mp.p[2] > 0);
    const r = await choose('宝箱がある。どうする？', [
      { label: '開ける', value: 'open' },
      { label: '罠を調べる', sub: '盗賊が得意', value: 'look' },
      { label: '罠見の呪文', sub: priest ? `${priest.name}が唱える` : '唱えられる者がいない', value: 'spell', dis: !priest },
      { label: '罠を外す', sub: '罠の名前を当てて外す', value: 'disarm' },
      { label: '立ち去る', value: 'leave' },
    ], false);
    const able = partyChars().filter(canAct);
    if (r === 'leave') { setMsg('宝箱を あとにした。'); return; }
    if (r === 'spell') {
      priest.mp.p[2]--;
      const guess = pct(95) ? ch.trap : ri(0, 8);
      await alertMsg(`${priest.name}は 罠見を唱えた。\n「${names[guess]}」だ。`);
      continue;
    }
    const who = able.length === 1 ? able[0] : await pickChar(r === 'open' ? '誰が開ける？' : r === 'look' ? '誰が調べる？' : '誰が外す？', able, c => `${CLS[c.cls].n} Lv${c.lv}　外す ${disarmChance(c)}%`);
    if (!who) continue;
    if (r === 'look') {
      if (pct(CLS[who.cls].thief ? 3 : 10)) { await alertMsg(`${who.name}は うっかり 罠に触れてしまった！`); await openChest(ch, who, true); return; }
      const guess = pct(inspectChance(who)) ? ch.trap : ri(0, 8);
      await alertMsg(`${who.name}は 宝箱を調べた。\n「${names[guess]}」のようだ。`);
      continue;
    }
    if (r === 'disarm') {
      const g = await choose('どの罠だと思う？', names.map((n, i) => ({ label: n, value: String(i) })));
      if (g === null) continue;
      if (+g === ch.trap) {
        if (!ch.trap || pct(disarmChance(who))) { await alertMsg(ch.trap ? `${who.name}は ${names[ch.trap]}を 外した！` : '罠は なかった。'); await openChest(ch, who, false); return; }
        if (pct(50)) { await alertMsg(`${who.name}は 罠を外しそこねた！`); await openChest(ch, who, true); return; }
        await alertMsg(`${who.name}は 罠を外せなかった。（まだ働いていない）`);
        continue;
      }
      await alertMsg(`違う罠だった！`);
      await openChest(ch, who, true); return;
    }
    if (r === 'open') { await openChest(ch, who, true); return; }
  }
}
async function openChest(ch, who, spring) {
  setMsg('');
  if (spring && ch.trap) {
    const out = springTrap(ch, who);
    updateMaze(); await play(out.msgs, true); updateMaze();
    if (partyWiped()) { await wipeFlow(); return; }
    if (out.tele) {
      const p = randomSafeCell(S.pos.f); S.pos.x = p.x; S.pos.y = p.y; markSeen(S.pos.f, p.x, p.y); UI.lastCellT = null;
      updateMaze(); await alertMsg('……気がつくと、別の場所にいた。宝箱は 置き去りになった。');
      return;
    }
    if (out.alarm) { await battleFlow(randomEncounter(S.pos.f), { text: '音を聞きつけて、敵がやって来た！' }); return; }
  }
  await loot(ch);
}
async function loot(ch) {
  const msgs = ['宝箱を開けた。'];
  S.gold += ch.gold; msgs.push(`金貨が ${ch.gold}枚 入っていた。`);
  const items = [];
  if (ch.item) items.push([ch.item, 0]);
  if (ch.key) items.push([ch.key, 1]);
  for (const [id, idf] of items) {
    let c = giveItemToParty(id, idf);
    if (!c && IT[id].kind === 'key') { c = partyChars()[0]; c.items.push({ id, eq: 0, idf: 1 }); }
    const nm = idf || IT[id].kind === 'key' ? IT[id].n : IT[id].unk;
    msgs.push(c ? `${nm}を 見つけた。（${c.name}が持った）` : `${nm}を 見つけたが、誰も持てない……`);
  }
  saveGame();
  updateMaze(); await play(msgs, true); updateMaze();
}
