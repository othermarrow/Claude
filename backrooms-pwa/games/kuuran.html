<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空欄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 「降下記録」と同じ組み立て（状態行・文章・命令を作る・十字キー）。色だけ変えた。
   裏側の部屋では明暗が反転し、空の部屋では淡い色になる。それ以外の明暗の切り替えはしない。 */
:root {
  --screen: #0f1215;
  --wall: #c9d1d3;
  --bright: #f4f7f7;
  --dim: #7b868a;
  --faint: #2a3136;
  --key: #151a1d;
  --bar-bg: #c9d1d3;
  --bar-fg: #0f1215;
  --warn: #e3a19a;
  --hot: #9a1d12;
  --dot: "DotGothic16", "Noto Sans Mono CJK JP", "Osaka-Mono", ui-monospace, monospace;
  --size: 17px;
  --line: 1.65;
  color-scheme: dark;
}
body.ura {
  --screen: #d9d6cc; --wall: #2a2620; --bright: #000000; --dim: #6b665a; --faint: #b3ae9f; --key: #cfccc2;
  --bar-bg: #2a2620; --bar-fg: #d9d6cc; --warn: #9b2d1f; --hot: #ff9a8a;
  color-scheme: light;
}
body.sky {
  --screen: #e9e7e1; --wall: #3f5d72; --bright: #172f40; --dim: #7f98a8; --faint: #c9d6dd; --key: #dfe6ea;
  --bar-bg: #9fbfd3; --bar-fg: #172f40; --warn: #8f4a6a; --hot: #8a1f3a;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--screen);
  color: var(--wall);
  font-family: var(--dot);
  font-size: var(--size);
  line-height: var(--line);
  transition: background-color 0.8s, color 0.8s;
}
#app { height: 100%; display: flex; flex-direction: column; }

#bar {
  display: flex; align-items: baseline; gap: 0.8em;
  background: var(--bar-bg); color: var(--bar-fg);
  padding: 0.15em 16px; white-space: nowrap;
}
@media (prefers-reduced-motion: no-preference) {
  #bar.flicker { animation: flicker 0.6s steps(2, end) 1; }
  @keyframes flicker { 0% { opacity: 1; } 30% { opacity: 0.35; } 45% { opacity: 1; } 60% { opacity: 0.6; } 100% { opacity: 1; } }
  .row.fresh { animation: hum 0.25s steps(3, end); }
  @keyframes hum { from { opacity: 0.2; } to { opacity: 1; } }
}
#room { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#score { font-variant-numeric: tabular-nums; font-size: 0.9em; }
#score .hot { color: var(--hot); }
#menu-btn { font: inherit; background: none; border: 0; color: var(--bar-fg); padding: 0 0.2em; cursor: pointer; }
#menu-btn:focus-visible { outline: 2px solid var(--bar-fg); }

#screen {
  flex: 1; min-height: 0; overflow-y: auto;
  padding-inline: 16px; padding-block: 1.1em 0.6em;
  overscroll-behavior: contain;
}
#log { max-width: 46em; display: flex; flex-direction: column; }
.row { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.row.title { color: var(--bright); }
.row.indent { padding-left: 1.5em; }
.row.note { color: var(--dim); font-size: 0.86em; }
.row.warn { color: var(--warn); }
.row.win { color: var(--bright); }
.row.voice { color: var(--bright); padding-left: 1em; }
.gap { height: calc(var(--size) * 0.7); }
.cmd { color: var(--bright); margin-top: 0.4em; }
.cmd .sent { color: var(--dim); font-size: 0.86em; margin-left: 0.8em; }

#dock { border-top: 1px solid var(--faint); padding-block: 0.5em calc(0.6em + env(safe-area-inset-bottom, 0px)); }
#prompt { display: flex; align-items: center; gap: 0.5em; padding-inline: 16px; }
#prompt .gt { color: var(--bright); }
#cmd {
  flex: 1; min-width: 0; font: inherit; font-size: max(16px, 1em);
  background: transparent; color: var(--bright); border: 0; outline: 0;
  caret-color: var(--bright); padding: 0.2em 0;
}
#cmd::placeholder { color: var(--faint); }
#send, #build-btn {
  flex: none; font: inherit; font-size: 0.9em; background: var(--wall); color: var(--screen);
  border: 0; padding: 0.35em 0.7em; cursor: pointer;
}
#send:focus-visible, #build-btn:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }

#pad {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0.7em;
  padding-inline: 16px; padding-top: 0.6em;
}
#compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
#common { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; align-content: start; }
.pk {
  font: inherit; font-size: 0.9em; line-height: 1.2; min-height: 2.4em;
  background: transparent; color: var(--wall); border: 1px solid var(--faint);
  padding: 0.3em 0.1em; cursor: pointer; white-space: nowrap;
}
.pk.dir { background: var(--key); color: var(--dim); }
.pk.dir.open { color: var(--bright); border-color: var(--dim); }
.pk.look { border-color: var(--wall); color: var(--bright); }
.pk.blank { visibility: hidden; }
.pk:active { background: var(--wall); color: var(--screen); }
.pk:focus-visible { outline: 1px solid var(--bright); }
.pk.updown { font-size: 0.82em; }
body.typing #pad { display: none; }

.key {
  font: inherit; font-size: 0.9em; line-height: 1.2;
  background: transparent; color: var(--wall);
  border: 1px solid var(--faint); padding: 0.35em 0.7em; cursor: pointer;
}
.key:active { background: var(--wall); color: var(--screen); }
.key:focus-visible { outline: 1px solid var(--bright); }

#builder, #sheet {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
  display: flex; flex-direction: column; justify-content: flex-end;
}
.panel {
  background: var(--screen); border-top: 1px solid var(--wall);
  max-height: 82%; display: flex; flex-direction: column;
  padding: 0.8em 16px calc(0.8em + env(safe-area-inset-bottom, 0px));
}
.bhead { display: flex; flex-direction: column; gap: 0.15em; padding-bottom: 0.6em; }
#b-title, .panel h2 { color: var(--bright); font: inherit; margin: 0; }
#b-preview { color: var(--dim); font-size: 0.86em; }
#b-list {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; align-content: start;
}
#b-list.verbs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.bk {
  font: inherit; text-align: left; background: transparent; color: var(--wall);
  border: 1px solid var(--faint); padding: 0.45em 0.6em; cursor: pointer; min-width: 0;
}
#b-list.verbs .bk { padding: 0.4em 0.45em; }
.bk.held { border-color: var(--dim); }
.bk:active { background: var(--wall); color: var(--screen); }
.bk:focus-visible { outline: 1px solid var(--bright); }
#b-list .empty { color: var(--dim); }
.bfoot { display: flex; gap: 0.4em; flex-wrap: wrap; padding-top: 0.7em; }
#sheet .panel { gap: 0.8em; overflow-y: auto; }
#sheet p { margin: 0; color: var(--dim); font-size: 0.86em; line-height: 1.6; }
#confirm-row { display: flex; gap: 0.4em; flex-wrap: wrap; }
/* 熱が上がると、頭の右上に浮かぶ球。自分にしか見えない */
#tekkyu {
  position: fixed; top: 2.3em; right: 14px; pointer-events: none;
  color: var(--dim); font-size: 1.4em; line-height: 1; opacity: 0;
  transition: opacity 0.8s;
}
#tekkyu.on { opacity: 0.8; }
@media (prefers-reduced-motion: no-preference) {
  #tekkyu.on { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-3px, 2px); } }
}
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <span id="room">空欄</span>
    <span id="score">木曜　36.5℃</span>
    <button id="menu-btn" type="button" aria-label="メニュー" aria-expanded="false">≡</button>
  </header>
  <span id="tekkyu" aria-hidden="true">●</span>

  <main id="screen" aria-live="polite">
    <div id="log"></div>
  </main>

  <footer id="dock">
    <form id="prompt" autocomplete="off">
      <button id="build-btn" type="button" aria-haspopup="dialog">命令を作る</button>
      <label for="cmd" class="gt">&gt;</label>
      <input id="cmd" type="text" enterkeyhint="send" placeholder="ここ、どこ？" autocapitalize="off" spellcheck="false">
      <button id="send" type="submit">決定</button>
    </form>
    <div id="pad">
      <div id="compass" aria-label="移動">
        <button class="pk dir updown" type="button" data-go="u">上</button>
        <button class="pk dir" type="button" data-go="n">北</button>
        <span class="pk blank" aria-hidden="true"></span>
        <button class="pk dir" type="button" data-go="w">西</button>
        <button class="pk look" type="button" data-cmd="look">見る</button>
        <button class="pk dir" type="button" data-go="e">東</button>
        <span class="pk blank" aria-hidden="true"></span>
        <button class="pk dir" type="button" data-go="s">南</button>
        <button class="pk dir updown" type="button" data-go="d">下</button>
      </div>
      <div id="common" aria-label="よく使う命令">
        <button class="pk" type="button" data-cmd="inventory">持ち物</button>
        <button class="pk" type="button" data-cmd="wait">待つ</button>
        <button class="pk" type="button" data-cmd="listen">耳をすます</button>
        <button class="pk" type="button" data-cmd="sleep">寝る</button>
        <button class="pk" type="button" data-cmd="dunno">わからない</button>
        <button class="pk" type="button" data-cmd="help">遊び方</button>
      </div>
    </div>
  </footer>

  <div id="builder" hidden>
    <div class="panel" role="dialog" aria-labelledby="b-title">
      <div class="bhead">
        <span id="b-title">何をする？</span>
        <span id="b-preview"></span>
      </div>
      <div id="b-list"></div>
      <div class="bfoot">
        <button class="key" type="button" id="b-back">戻る</button>
        <button class="key" type="button" id="b-close">閉じる</button>
      </div>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="panel" role="dialog" aria-label="メニュー">
      <h2>空欄</h2>
      <p>十字キーで移動する。左上の「上」と右下の「下」で、上下にも動ける。「命令を作る」を押し、動詞 → 物（またはことば）の順にタップすると命令になる。入力欄に日本語で書いてもいい。困ったら「わからない」。</p>
      <p>途中の状態は自動で残り、次に開くと続きから始まる。</p>
      <div id="confirm-row">
        <button class="key" type="button" id="restart-btn">はじめから</button>
        <button class="key" type="button" id="restart-yes" hidden>本当にはじめから</button>
        <button class="key" type="button" id="restart-no" hidden>やめる</button>
      </div>
      <button class="key" type="button" id="close-sheet">閉じる</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
  const $ = id => document.getElementById(id);
  const logEl = $("log"), screenEl = $("screen"), cmdEl = $("cmd");

  // ---- 保存（ブラウザの記憶。Tasker のシーンでは Tasker/kuuran/ のファイルにも残す） ----
  const TK = (() => {
    try {
      if (typeof tk !== "undefined" && tk && typeof tk.readFile === "function" && typeof tk.writeFile === "function") return tk;
      if (typeof readFile === "function" && typeof writeFile === "function") {
        return { readFile, writeFile,
          global: typeof global === "function" ? global : undefined,
          setGlobal: typeof setGlobal === "function" ? setGlobal : undefined };
      }
    } catch (e) { /* Tasker の外 */ }
    return null;
  })();
  const TK_FILE = "/storage/emulated/0/Tasker/kuuran/kuuran-data.json";
  const TK_VAR = "KUURAN";
  const KEY = "kuuran.state";
  const VERSION = 1;
  // Tasker はないファイルを読むと止まるので、一度書いたことを変数 %KUURAN に残し、書いたあとでだけ読む
  function loadSaved() {
    if (TK) {
      let written = false;
      try { written = TK.global && String(TK.global(TK_VAR)) === "1"; } catch (e) { /* 読めない */ }
      try { written = written || localStorage.getItem(KEY + ".tk") === "1"; } catch (e) { /* 同上 */ }
      if (written) {
        try { const v = TK.readFile(TK_FILE); if (v) return JSON.parse(String(v)); } catch (e) { /* 壊れている */ }
      }
    }
    try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; }
  }
  function writeSaved(obj) {
    const json = JSON.stringify(obj);
    try { localStorage.setItem(KEY, json); } catch (e) { /* 残せなくても遊べる */ }
    if (TK) {
      try {
        TK.writeFile(TK_FILE, json, false);
        try { if (TK.setGlobal) TK.setGlobal(TK_VAR, "1"); } catch (e) { /* 変数に書けない */ }
        try { localStorage.setItem(KEY + ".tk", "1"); } catch (e) { /* 同上 */ }
      } catch (e) { /* 書けなくても遊べる */ }
    }
  }
  // 何回目か、前のあなたが何をしたかは、はじめからやり直しても残る
  function loadLoop() {
    try { return JSON.parse(localStorage.getItem(KEY + ".loop") || "null") || { n: 0, echo: [] }; } catch (e) { return { n: 0, echo: [] }; }
  }
  function saveLoop(v) { try { localStorage.setItem(KEY + ".loop", JSON.stringify(v)); } catch (e) { /* 残らなくても遊べる */ } }

  // ---- 物の置き場 ----
  const O = {};
  function thing(id, def) {
    O[id] = Object.assign({ id, loc: null, take: false, en: id.toLowerCase(), aliases: [def.name] }, def);
  }
  const text = v => (typeof v === "function" ? v() : v);
  const held = id => O[id].loc === "player";
  const near = id => O[id].loc === "player" || O[id].loc === S.loc;

  const DIR_JA = { n: "北", s: "南", e: "東", w: "西", u: "上", d: "下" };
  // 日曜は、来ない
  const DAYS = ["木", "月", "水", "土", "火", "金"];
  const SCHOOL = ["shall", "sroom", "toilet", "lab", "music", "avroom"];
  const RULES = [{ k: "push", ja: "おさない" }, { k: "run", ja: "はしらない" }, { k: "talk", ja: "しゃべらない" }];
  const QUESTIONS = ["ここ、どこ？", "わたし、だれ？", "この音は？", "あなた、だれ？", "死んだの？"];
  const FOODS = ["グラタン", "具のないアサリ汁", "見切り野菜のスープ", "レタスのチャーハン"];
  const DREAMS = ["くじらになりたい", "せんせいになりたい", "すうじをうちこむひと", "まだ、ない"];
  const FILM = "エンドロールだけの映画";
  const FIELDS = [["film", "好きな映画"], ["food", "好きな料理"], ["dream", "夢"], ["complaint", "主訴"], ["sound", "好きな音"]];

  function initWorld() {
    for (const k of Object.keys(O)) delete O[k];

    // ---- 白い部屋（613）
    thing("ceiling", { name: "白い天井", aliases: ["白い天井", "天井", "ceiling"], loc: "bed", scenery: true,
      desc: "ずっと見上げていた気がする天井。小さな染みがいくつもある。数えるたびに、数が合わない。" });
    thing("lamp", { name: "蛍光灯", aliases: ["蛍光灯", "明かり", "電気", "灯り", "lamp"], en: "lamp", loc: "bed", scenery: true,
      desc: () => S.dark.bed ? "消えた蛍光灯。カバーの中の羽虫の影だけが、窓明かりで黒く浮いている。" :
        "カバーの中に、羽虫の影がいくつも溜まっている。全部、同じ向きを向いて死んでいる。目を閉じても、四角い光の形がまぶたに残る。" });
    thing("bedd", { name: "ベッド", aliases: ["ベッド", "枕", "シーツ", "bed"], en: "bed", loc: "bed", scenery: true,
      desc: () => {
        if (!S.noteFound) { S.noteFound = true; O.note.loc = "bed"; return "白いシーツ。枕をどけると、下に、四つに折ったわら半紙が一枚。"; }
        return "白いシーツに、自分の形のくぼみが残っている。";
      } });
    thing("note", { name: "わら半紙", aliases: ["わら半紙", "紙", "メモ"], en: "rough paper", take: true, paper: true,
      desc: "四つに折った、ざらざらのわら半紙。",
      read: "鉛筆で、一言だけ。「逃げろ！」\n筆圧が強すぎて、裏まで字が浮いている。" });
    thing("call", { name: "ナースコール", aliases: ["ナースコール", "呼び出しボタン", "ボタン", "nurse call"], en: "nurse call", loc: "bed", scenery: true,
      desc: "枕元の白いボタン。押せば、誰かが来るのだろう。" });
    thing("tag", { name: "名札", aliases: ["名札", "札", "name tag"], en: "name tag", loc: "bed", scenery: true,
      desc: () => "ベッドの柵の名札。「613」。" + (LOOP.n ? `その横に、鉛筆で小さく「${LOOP.n + 1}」。` : "") + "名前を書くところは、空いている。" });
    thing("window", { name: "窓", aliases: ["窓", "カーテン", "window"], en: "window", loc: "bed", scenery: true,
      desc: () => S.dark.bed ? "明かりを消すと、窓は鏡であることをやめた。外は、思ったより明るい。正面玄関の灯りと、国道。土手の上に、細い月。" :
        "カーテンを開けても、窓は暗い鏡になっている。白い部屋と、ベッドの横に立つ誰かが映る。……顔のところだけ、反射が薄い。" });

    // ---- 病棟の廊下
    thing("d611", { name: "611の扉", aliases: ["611の扉", "611", "診察室の扉", "診察室"], en: "door 611", loc: "corr", scenery: true,
      desc: "611の扉。「診察室」の札がかかっている。" });
    thing("d612", { name: "612の扉", aliases: ["612の扉", "612"], en: "door 612", loc: "corr", scenery: true, desc: "612の扉。中から、何の音もしない。" });
    thing("d613", { name: "613の扉", aliases: ["613の扉", "613号室", "自分の部屋"], en: "door 613", loc: "corr", scenery: true, desc: "613の扉。自分の部屋だ。たぶん。" });
    thing("d615", { name: "615の扉", aliases: ["615の扉", "615"], en: "door 615", loc: "corr", scenery: true, desc: "615の扉。隙間から、水の匂いがする。" });
    thing("d616", { name: "616の扉", aliases: ["616の扉", "616"], en: "door 616", loc: "corr", scenery: true, desc: "616の扉。郵便受けがついている。病室なのに。" });

    // ---- 詰所
    thing("form", { name: "613のファイル", aliases: ["613のファイル", "ファイル「613」", "入所記録", "ファイル", "file 613"], en: "file 613", loc: "station", scenery: true,
      desc: "表紙に「613」と書かれた薄いファイル。", read: () => formText() });
    thing("f2111", { name: "2111のファイル", aliases: ["2111のファイル", "ファイル「2111」", "2111"], en: "file 2111", loc: "station", scenery: true,
      desc: "表紙に「2111」と書かれた、分厚いファイル。",
      read: () => {
        const first = !S.read2111; S.read2111 = true;
        if (first) addT(0.1, "");
        return "出生時の体重。身長と体重の記録。予防接種の日付。いつのまにか増えた、ピアスの穴の数。面談の記録。反省文。\n毎日の記録が、一日も途切れずに続いている。\nそれでも、いちばん知りたいことは、どこにも書いていない。";
      } });
    thing("tsheet", { name: "検温表", aliases: ["検温表", "表"], en: "temperature sheet", loc: "station", scenery: true,
      desc: "壁に貼られた検温表。",
      read: "613の欄に、毎朝の体温が並んでいる。今日の欄にも、明日の欄にも、来週の欄にも、もう書いてある。「36.5℃　特変なし」。\n表には、日曜の欄がない。" });
    thing("cal", { name: "カレンダー", aliases: ["カレンダー", "calendar"], en: "calendar", loc: "station", scenery: true,
      desc: () => S.sunday ? "切り取られていた日曜の列に、紙が一枚、貼り直してある。今日の日付に、丸。" :
        "月のカレンダー。日曜の列だけが、カッターで縦に切り取られている。" });
    thing("inko", { name: "インコ", aliases: ["インコ", "鳥かご", "鳥", "parrot"], en: "parrot", loc: "station", scenery: true,
      desc: "灰色のインコ。籠の扉は開いているのに、出ようとしない。首をかしげて、こちらを見る。" });
    thing("nuka", { name: "暗がり", aliases: ["暗がり", "気配", "タッパー", "ぬか床", "箱"], en: "dark corner", loc: "station", scenery: true,
      desc: () => {
        if (S.nuka) return "ぬか床。誰かが毎日、手を入れているらしい。";
        S.nuka = true;
        addT(-0.1, "");

  // ---- 状態 ----
  let S = null;
  let LOOP = loadLoop();
  function newState() {
    initWorld();
    S = { loc: "bed", moves: 0, done: false, seen: {}, t: 36.5, di: 0, day: 0, sunday: false,
      f: { film: null, food: null, dream: null, complaint: null, sound: null },
      dark: { bed: false, exam: false }, noteFound: false, read2111: false, nuka: false, scroll: false,
      face: "center", gOpen: false, film: false,

  const SAVED_FIELDS = ["loc", "closed"];
  function snapshot() {
    const objs = {};

  function restore(data) {

    S = data.S;
    for (const [id, st] of Object.entries(data.objs || {})) if (O[id]) Object.assign(O[id], st);
    return true;
  }

  // ---- 表示 ----
  let rows = [];
  function rowEl(r) {
    if (r.t === "gap") { const d = document.createElement("div"); d.className = "gap"; return d; }
    const p = document.createElement("p");
    if (r.t === "cmd") {
      p.className = "row cmd";
      p.textContent = "> " + r.ja;
      if (r.en && r.en !== r.ja) { const s = document.createElement("span"); s.className = "sent"; s.textContent = r.en; p.append(s); }
      return p;
    }
    p.className = "row" + (r.cls ? " " + r.cls : "");
    p.textContent = r.ja;
    return p;
  }
  function push(r, fresh) {
    rows.push(r);
    const el = rowEl(r);
    if (fresh) el.classList.add("fresh");
    logEl.append(el);
  }
  // 熱が上がってくると、文章の字がところどころ問いに変わる
  function corrupt(t) {
    if (!S || S.t < 37.6 || t.length < 6 || Math.random() > 0.25) return t;
    const i = 2 + Math.floor(Math.random() * (t.length - 3));
    return t.slice(0, i) + (Math.random() < 0.5 ? "■" : "？") + t.slice(i + 1);
  }
  function say(t, cls) { for (const part of String(t).split("\n")) push({ t: "out", ja: cls === "title" || cls === "win" ? part : corrupt(part), cls: cls || "" }, true); }
  function gap() { push({ t: "gap" }); }
  function scrollDown() { requestAnimationFrame(() => { screenEl.scrollTop = screenEl.scrollHeight; }); }
  function flicker() {
    const bar = $("bar");
    bar.classList.remove("flicker"); void bar.offsetWidth; bar.classList.add("flicker");
  }
  // 過去に打った命令の一つが、打っていない命令に書き換わる
  function haunt(t) {
    const idx = [];
    rows.forEach((r, i) => { if (r.t === "cmd" && i < rows.length - 8) idx.push(i); });
    if (!idx.length) return;
    const i = idx[Math.floor(Math.random() * idx.length)];
    rows[i] = { t: "cmd", ja: t, en: "" };
    const el = logEl.children[i];
    if (el) { el.textContent = "> " + t; }
  }
  const dayName = () => (S.loc === "ura" || S.sunday) ? "日" : S.loc === "sky" ? "？" : DAYS[S.di];
  const isMonday = () => !S.sunday && DAYS[S.di] === "月";
  const hot = () => S.t >= 37.5 && !S.done;
  function setStatus() {
    $("room").textContent = ROOMS[S.loc].name;
    const sc = $("score");
    sc.textContent = "";
    const sv = document.createElement("span");
    sv.textContent = S.t.toFixed(1) + "℃";
    if (S.t >= 37.5) sv.className = "hot";
    sc.append(document.createTextNode(dayName() + "曜　"), sv);
    const ex = exitsOf(S.loc);
    for (const b of document.querySelectorAll("[data-go]")) b.classList.toggle("open", !!ex[b.dataset.go]);
    document.body.classList.toggle("ura", S.loc === "ura");
    document.body.classList.toggle("sky", S.loc === "sky");
    $("tekkyu").classList.toggle("on", hot());
  }

  // ---- 世界のしくみ ----
  function visible() {
    const out = [];
    const walk = parent => {
      for (const o of Object.values(O)) {
        if (o.loc !== parent) continue;
        out.push(o);
        if (o.container && !o.closed) walk(o.id);
      }
    };
    walk(S.loc);
    walk("player");
    if (hot()) out.push(O.tekkyu);
    return out;
  }
  function describe(full) {
    const r = ROOMS[S.loc];
    say(r.name, "title");
    if (full || !S.seen[S.loc]) say(text(r.desc));
    S.seen[S.loc] = true;
    const loose = Object.values(O).filter(o => o.loc === S.loc && !o.scenery);
    for (const o of loose) say(`ここに${o.name}がある。`);
    for (const c of Object.values(O).filter(o => o.loc === S.loc && o.container && !o.closed)) {
      const inside = Object.values(O).filter(o => o.loc === c.id && !o.scenery);
      if (inside.length) say(`${c.name}の中に、${inside.map(o => o.name).join("、")}。`);
    }
    if (hot() && full) say("頭の右上に、鉄の球が浮かんでいる。", "note");
  }
  function go(dir) {
    if (S.loc === "ura") { say("扉は、内側からは開かない。手の中の鏡の破片が、冷たい。"); return; }
    if (S.loc === "sky") { say("どこまで歩いても、水面が続く。少女との距離は、少しも変わらない。"); return; }
    if (S.loc === "river") { say("どちらへ行こうとしても、配達員が「あの」と呼び止める。手紙の宛名が、まだ空欄だ。"); return; }
    if (S.loc === "front" && dir === "n") {
      if (S.sunday) { toRiver(); return; }
      S.bump = (S.bump || 0) + 1;
      say("ガラス扉に、額をぶつけた。扉は開かない。");
      say("「この先は、行き止まりです」", "voice");
      say(S.bump >= 3 ? "どこからか、表情のない声。……本当に、行き止まりなのだろうか。外には、道がいくらでも見えているのに。" : "どこからか、表情のない声がした。");
      addT(0.2, "");
      return;
    }
    if (S.loc === "stairs" && dir === "u") { climb(); return; }
    if (S.loc === "smoke" && dir === "n" && !S.gOpen) { say("警備員室の扉には、鍵がかかっている。"); return; }
    const to = exitsOf(S.loc)[dir];
    if (!to) { say(`${DIR_JA[dir] || "そちら"}へは行けない。`); return; }
    if (S.loc === "corr" && dir === "s") say("613の扉を開けて、中に入る。");
    if (S.loc === "hall" && dir === "d") say("床の端の階段を、半地下へ降りる。");
    if (S.loc === "roof" && dir === "d") say("外階段を降りる。下りは、すぐだった。");
    enter(to);
  }
  function enter(to) {
    if (S.loc === "smoke") S.face = "center";
    S.loc = to;
    describe(false);
    arrive(to);
  }
  // 部屋に入ったときの出来事
  function arrive(to) {
    if (to === "smoke") say("入ってきたこちらを、三人が肩越しにちらりと見た。", "note");
    if (to === "corr" && !S.sunday && (DAYS[S.di] === "水" || DAYS[S.di] === "土") && S.mailDay !== S.day) {
      S.mailDay = S.day;
      say("自転車を押した郵便配達員が、廊下を来た。616の扉の郵便受けをのぞいてから、扉を開けて、自転車ごと入っていく。すれ違いざま、こちらに言う。", "note");
      say("「ここ、隣の区への近道なんですよ」", "voice");
    }
    if (to === "passage") {
      S.ring = !S.sunday && S.moves > 10 && Math.random() < (LOOP.n ? 0.6 : 0.35);
      if (S.ring) say("公衆電話が鳴っている。", "warn");
    }
    if (to === "shall" && isMonday() && S.seen.chime !== S.day) { S.seen.chime = S.day; say("誰もいない校舎に、一時間目のチャイムが鳴っている。", "note"); }
    if (to === "station" && S.sunday) say("インコも、今日は黙っている。", "note");
  }
  function addT(n, why) {
    if (S.done) return;
    S.t = Math.round(Math.max(35.8, Math.min(39, S.t + n)) * 10) / 10;
    if (why) say(why, n > 0 ? "warn" : "note");
    if (S.t >= 38.0) collapse();
  }
  const allFields = () => FIELDS.every(([k]) => S.f[k]);
  function setField(k, v) {
    if (S.f[k]) return;
    S.f[k] = v;
    say("どこかで、ペン先が紙の上を走る音がした。", "note");
    if (allFields()) say("……遠くで、カレンダーが一枚、風にめくれる音。", "note");
  }
  // 朝が来る。曜日は順番どおりに来ない
  function nextDay(fever) {
    S.day++;
    if (!S.sunday && allFields() && S.space) S.sunday = true;
    else if (!S.sunday) S.di = (S.di + 1) % DAYS.length;
    S.t = fever ? 37.2 : 36.5;
    S.face = "center";
    S.ring = false;
    S.dark.bed = false;
    S.qa = S.f.food ? S.qa : 0;
    S.qaAsk = S.f.food ? S.qaAsk : false;
    S.uraWait = 0;
  }
  function morning() {
    if (S.sunday) {
      say("目を覚ます。……検温の声が、来ない。");
      say("廊下が、しんとしている。今日は、日曜らしい。");
      return;
    }
    say("「おはようございます。お熱、はかりますね」", "voice");
    say(`天井のスピーカーから声がして、脇の下で体温計が鳴った。${S.t.toFixed(1)}℃。`);
    say("「はい、特に変わりなしですね」", "voice");
  }
  // 熱が上がりきると、白い部屋で目を覚ます
  function collapse() {

          if (S.face === "center") { S.face = "wall"; say("こちらも、壁のほうを向いて立つ。煙の匂い。……皆、また壁を向いた。誰も、誰の顔も見ていない。"); }
          else { S.face = "center"; say("灰を落とす音が、三つ重なる。皆が中央を向き、互いの背中を見る。……こちらの背中も、見られている。"); }
          return;
        case "ura":
          S.uraWait++;
          say("向かいの誰かが、震える声で言う。");
          say("「どうしよう。……見つけちゃった」", "voice");
          say("さっきも、同じことを聞いた。");
          if (S.uraWait >= 2) addT(0.2, "同じ会話が、また始まる。何回目なのか、もう分からない。");
          return;
        case "stairs": say("列の人たちが、黙ってこちらを追い越していく。誰も、こちらを見ない。"); return;
        case "sky": say("少女が、もう一度訊く。「この世界、きれい？」"); return;
        case "river": say("配達員は、封筒を持ったまま待っている。「あの、お名前は……」"); return;
        case "avroom": VERB_DO.listen(); return;
        case "cafe": if (O.mizuwari.loc === "cafe") { say("グラスの氷が、少しも溶けない。"); return; } break;
        case "bed": say(S.sunday ? "静かだ。廊下に、誰もいない。" : "白い天井の染みを数える。数えるたびに、数が合わない。"); return;
      }
      say("時間が過ぎる。" + (hot() ? "頭の右上で、鉄の球がゆっくり揺れている。" : ""));
    },
    hint: () => say("（ヒント）" + hintText(), "note"),
    dunno: () => {
      if (SCHOOL.includes(S.loc) && !S.rules) {
        say("「わから――」と言いかけて、口を押さえた。窓の外の何かが、身じろぎする。", "voice");
        say("心の中でだけ言うと、どこかで、誰かが小さく答えた。", "note");
        say("（ヒント）" + hintText(), "note");
        return;
      }
      say("「わからない」", "voice");
      if (S.loc === "ura") say("向かいの誰かが、顔を伏せたまま、小さく答えた。", "note");
      else if (S.loc === "sky") say("少女が、くすりと笑って答えた。", "note");
      else say("どこかで、誰かが、質問ではない声で、小さく答えた。", "note");
      say("（ヒント）" + hintText(), "note");
    },
    listen: () => {
      switch (S.loc) {
        case "bed": say(S.dark.bed ? "明かりを消すと、うなりも消えた。自分の呼吸だけ。" : "蛍光灯のうなり。廊下の遠くで、カートの車輪が鳴っている。"); return;
        case "corr": say("どの扉の向こうからも、物音がしない。614があるはずの壁の中から、かすかに、寝息のような音。"); return;
        case "station": say("インコが、羽をふくらませる音。" + (S.nuka ? "ぬか床が、ぷつ、と鳴った。" : "机の隅の暗がりで、何かが小さく、ぷつ、と鳴った。")); return;
        case "exam": if (S.dark.exam) { if (!S.f.complaint) { hearFireworks(); return; } say("遠くで、季節外れの花火。"); return; } say("蛍光灯のうなり。窓の外の音は、ガラスで止まっている。"); return;
        case "front": say("ガラスの向こうで、車の音と、少年たちの笑い声。ガラス一枚ぶん、遠い。"); return;
        case "smoke": say("煙を吐く音が、三つ。誰も話さない。"); return;
        case "guard": say("冷蔵庫の低いうなり。その中に、カリカリと、何かを考える音が混じっている。"); return;
        case "cafe": say(S.musicOff ? "スクリーンの裏で、何十人もが眠っている寝息。" : "クラシック。弦の音の奥に、荒い息づかい。何十人ぶんの。"); return;
        case "passage": say(S.ring ? "公衆電話が鳴っている。" : "風が、渡り廊下の窓を鳴らす。"); return;
        case "hall": say("下駄箱の蓋が、どこかで一つ、ぱたんと閉まった。"); return;
        case "shall": say(S.rules ? "秒針の音だけ。" : "秒針の音。窓の外側を、何かが吸いつきながら這う音。"); return;
        case "sroom": say("チョークの粉が、黒板の下に降り積もる音。……そんな音は、しないはずだ。"); return;
        case "toilet": say("蛇口から、一滴ずつ。ひびの入った鏡が、ときどき、ぴしりと鳴る。"); return;
        case "lab": say("扉の向こうで、誰かが小さく話している。同じことを、何度も。"); return;
        case "music": say("鳴らないはずの鍵盤が一つ、ことりと沈む音。"); return;
        case "avroom": say("「それは、本当に必要な質問ですか？」「必要かどうかを、誰が決めるのですか？」「決めるのは、誰であるべきだと思いますか？」……質問が、質問を呼んでいる。"); return;
        case "stairs": say("大勢の足音。誰も、息を切らしていない。"); return;
        case "roof": say("風。遠くの国道。どこかで、季節外れの虫が一匹だけ鳴いている。"); return;
        case "lib": say("細い窓の外を、誰かの足が通りすぎる。"); return;
        case "lib2": say("山羊の、反芻する音。監視カメラの、小さな駆動音。"); return;
        case "ura": say("向かいの誰かの、浅い呼吸。パンフレットの紙が、かさりと鳴る。"); return;
        case "sky": say("聞いたことのない音が、聞いたことのない順番で鳴っている。どれも、楽譜には書けない。"); return;
        case "river": say("川の音。車の音。少年たちの声。どれも、ガラス越しではない。"); return;
      }
      say("何も聞こえない。");
    },
    help: () => say("遊び方：「命令を作る」で、動詞 → 物（「言う」「書く」ならことば）の順にタップする。十字キーで移動し、「上」「下」で上下に動く。困ったら「わからない」。", "note"),
    sleep: () => {
      if (S.loc === "guard") { say("新品の布団に横になってみた。……自分の場所ではない気がして、すぐに起きた。"); return; }
      if (S.loc === "ura") { say("目を閉じても、向かいの誰かの震えが伝わってくる。眠れない。"); return; }
      if (S.loc !== "bed") { say("ここでは、眠れない。"); return; }
      say("ベッドに横になり、目を閉じる。羽虫の影が、まぶたの裏に残る。");
      say("……眠る。夢は見ない。");
      gap();
      nextDay(false);
      morning();
      describe(true);
    },
    run: () => {
      if (S.loc === "stairs") {
        say("一段飛ばしで、駆け上がる。うつむいた人たちを、次々に追い越す。息が切れる。");
        say("三つ目の踊り場の先に、頂上が見えた。");
        say("後ろのほうで、誰かが小さく拍手をした。");
        gap();
        enter("roof");
        return;
      }
      if (ruleBreak("run")) return;
      if (SCHOOL.includes(S.loc)) { say("走りかけて、やめた。……もう、何も追ってこない。"); return; }
      if (S.loc === "corr") { say("廊下を走る。614があるはずの場所を、通りすぎた。振り返っても、壁しかない。"); return; }
      say("走る理由が、見つからない。");
    },
    examine: (o) => {
      if (!need(o, "調べる")) return;
      if (o.id === "keyhole") { if (S.loc === "lab") peek(); return; }
      if (o.id === "shard" && S.loc === "ura") { leaveUra(); return; }
      if (o.id === "form") S.seen.form = true;
      say(text(o.desc) || `${o.name}に、特に変わったところはない。`);
    },
    read: (o) => {
      if (!need(o, "読む")) return;
      if (!o.read) { VERB_DO.examine(o); return; }
      if (o.id === "form") S.seen.form = true;
      say(text(o.read));
    },
    take: (o) => {
      if (!need(o, "取る")) return;
      if (o.loc === "player") { say("もう持っている。"); return; }
      if (o.id === "booth" || o.id === "sphone") { answerPhone(); return; }
      if (o.id === "keys") {
        if (S.face !== "wall") { say("手を伸ばしかけたとき、警備員の目が、背中越しにこちらを見ていた。手を引っこめる。"); addT(0.3, ""); return; }
        O.keys.loc = "player"; O.keys.scenery = false;
        say("皆が壁を向いているあいだに、鍵束を、灰皿スタンドの縁から外した。誰も、振り向かない。");
        return;
      }
      if (o.id === "tekkyu") { say("手を伸ばしても、触れない。触れられるのは、本物だけだ。"); return; }
      if (o.id === "glasses") { say("ケースの札に、触らないでください、とある。……かけてみるくらいなら、と思う。"); return; }
      if (o.id === "mizuwari") { say("グラスごと持ち歩くものではない。ここで飲むものだ。"); return; }
      if (o.id === "inko") { say("インコは、籠から出ようとしない。"); return; }
      if (o.id === "goat") { say("山羊は、重い。そして、こちらを見ても笑わない。"); return; }
      if (o.id === "heart") { say("人の手紙だ。そのままにしておく。"); return; }
      if (o.id === "violin" && !S.strung && !held("string")) { /* 持っていくのは構わない */ }
      if (!o.take) { say(`${o.name}は取れない。`); return; }
      o.loc = "player";
      if (o.id === "fusen") S.fusenTaken = true;
      say(`${o.name}を取った。`);
    },
    drop: (o) => {
      if (!need(o, "置く")) return;
      if (o.loc !== "player") { say(`${o.name}は持っていない。`); return; }
      if (o.id === "shard" && S.loc === "ura") { say("これを手放したら、戻れなくなる気がする。"); return; }
      o.loc = S.loc;
      say(`${o.name}を置いた。`);
    },
    put: (o, w) => {
      if (!need(o, "入れる")) return;
      if (o.id === "switch") { musicOn(); return; }
      if (o.id === "string" || (o.id === "violin" && w && w.id === "string")) {
        if (!held("string") && O.string.loc !== S.loc) { say("弦を持っていない。"); return; }
        if (!(held("violin") || visible().includes(O.violin))) { say("張る楽器が、ここにない。"); return; }
        if (S.strung) { say("もう張ってある。"); return; }
        O.string.loc = "gone";
        S.strung = true;
        say("弦を、バイオリンに張った。一本だけ。糸巻きを回しても、音は合わない。合わないまま、止めた。");
        return;
      }
      if (o.id === "shard" && w && w.id === "keyhole") { VERB_DO.examine(O.keyhole); return; }
      if (o.id === "keys" && w && w.id === "gdoor") { VERB_DO.open(O.gdoor); return; }
      if (!w) { say("どこに入れる？"); return; }
      if (w.id === "goat") { giveTo(o, w); return; }
      if (w.container && !w.closed && o.loc === "player") { o.loc = w.id; say(`${o.name}を、${w.name}に入れた。`); return; }
      say(`${o.name}は、${w.name}には入れられない。`);
    },
    give: (o, w) => giveTo(o, w),
    open: (o) => {
      if (!need(o, "開ける")) return;
      if (o.id === "d611") { say("611の扉を開けて、中に入る。"); gap(); enter("exam"); return; }
      if (o.id === "d613") { say("613の扉を開けて、中に入る。"); gap(); enter("bed"); return; }
      if (o.id === "d612") { say("扉を開ける。ベッドに誰かが横たわっている。目は開いているのに、動かない。天井を見ているのではなく、天井の向こうを聞いている顔だ。\n……そっと扉を閉めた。"); return; }
      if (o.id === "d615") { say("扉を開ける。部屋の真ん中に、空の水槽と、ガラス板が一枚。水槽とガラス板のあいだに、何かを挟んで、横を向かせていた跡がある。\n……そっと扉を閉めた。"); return; }
      if (o.id === "d616") {
        say("扉を開ける。……隣の区の、知らない路地だった。夜の自転車置き場。遠くに、知らない駅の灯り。");
        say("一歩踏み出す前に、扉を閉めた。今は、まだ。");
        return;
      }
      if (o.id === "gdoor") {
        if (S.gOpen) { say("もう開いている。"); return; }
        if (!held("keys")) { say("鍵がかかっている。"); return; }
        S.gOpen = true;
        say("「警」と彫られた鍵を差しこむ。回る。扉が、内側へ開いた。北に、畳の部屋。");
        return;
      }
      if (o.id === "ldoor") { say("鍵がかかっている。開かずの間だ。鍵穴だけが、こちらを向いている。"); return; }
      if (o.id === "udoor") { say("内側には、取っ手がない。"); return; }
      if (o.id === "glass") { go("n"); return; }
      if (o.id === "door613") {
        if (!S.goat) { say("山羊が扉の前に座りこんでいて、開けられない。"); return; }
        say("扉を開ける。白い天井。……自分の部屋だった。近道になっているらしい。");
        gap();
        enter("bed");
        return;
      }
      if (o.id === "skylight") {
        if (S.polaris) { say("もう開いている。"); return; }
        S.polaris = true;
        say("天窓を開けた。");
        say("……下にあるはずの校舎はなく、窓の中にも、夜空があった。");
        say("星が、ゆっくり回っている。全部の星が、たった一つの星を中心に。");
        say("足もとは、少しも動いていない。回っているのは、空のほうだった。……誰かに知られたら、困る人がいるのだろう。");
        say("北の空の、その一つの星だけが、まだ、そこにある。");
        addT(-1.0, "胸の熱が、すっと引いていく。");
        return;
      }
      if (o.id === "letter2" || o.id === "note" || o.id === "pamph") { VERB_DO.read(o); return; }
      if (o.container) {
        if (!o.closed) { say("もう開いている。"); return; }
        o.closed = false;
        if (o.id === "fridge") {
          say("冷蔵庫を開ける。冷気。棚の奥に、古いノートパソコンが一台、冷やされている。");
          say("画面に一行。「わたしの好きな映画は」");
          say("その先で、カーソルが点滅している。");
        } else if (o.id === "shoebox") say("613の下駄箱の蓋を開ける。上靴の上に、白い封筒が一通。");
        else if (o.id === "vcase") say("ケースを開ける。古いバイオリン。弦が、一本もない。");
        else say(`${o.name}を開けた。`);
        return;
      }
      say(`${o.name}は、開けるものではない。`);
    },
    close: (o) => {
      if (!need(o, "閉める")) return;
      if (o.id === "skylight") { say("開けたものは、閉められない。……閉めても、もう知ってしまった。"); return; }
      if (o.id === "switch") { musicOff(); return; }
      if (o.container) { if (o.closed) { say("もう閉まっている。"); return; } o.closed = true; say(`${o.name}を閉めた。`); return; }
      say(`${o.name}は、閉めるものではない。`);
    },
    lighton: (o) => {
      if (o && o.id === "switch") { musicOn(); return; }
      if (o && o.id === "tv") { VERB_DO.press(o); return; }
      const room = S.loc === "bed" ? "bed" : S.loc === "exam" ? "exam" : null;
      if (room && (!o || o.id === "lamp" || o.id === "elamp")) { lampOn(room); return; }
      say(o ? `${o.name}は、点けるものではない。` : "点けるものがない。");
    },
    lightoff: (o) => {
      if (o && o.id === "switch") { musicOff(); return; }
      if (!o && S.loc === "cafe") { musicOff(); return; }
      const room = S.loc === "bed" ? "bed" : S.loc === "exam" ? "exam" : null;
      if (room && (!o || o.id === "lamp" || o.id === "elamp")) { lampOff(room); return; }
      say(o ? `${o.name}は、消すものではない。` : "消すものがない。");
    },
    drink: (o) => {
      if (!need(o, "飲む")) return;
      if (!o.drink) { say(`${o.name}は、飲めない。`); return; }
      if (O.mizuwari.loc !== S.loc) { say("ここに水割りはない。"); return; }
      O.mizuwari.loc = null;
      say("硬い氷が、グラスの中でゆっくり回る。時間が経っても、薄まらない。");
      addT(-0.8, "喉を通るあいだだけ、熱が引いた。");
    },
    press: (o) => {
      if (!need(o, "押す")) return;
      if (ruleBreak("push")) return;
      if (o.id === "call") {
        if (S.sunday) { say("ナースコールを押す。……誰も来ない。日曜だ。"); return; }
        say("ナースコールを押す。しばらくして、天井のスピーカーから声。");
        say("「はーい、お熱、はかりますね」", "voice");
        say(`いつのまにか、脇の下で体温計が鳴っている。${S.t.toFixed(1)}℃。`);
        say("「はい、特に変わりなしですね」", "voice");
        if (S.t >= 37.5) say("……変わりなし、ではない気がする。", "note");
        return;
      }
      if (o.id === "kb") {
        S.scroll = !S.scroll;
        if (S.scroll && !S.seen.scroll) {
          S.seen.scroll = true;
          say("押されたことのなかったキーが、はじめて押された。小さなランプが一つ、灯る。");
          say("……何も起きない。何も起きないことが、このキーの仕事なのだろう。");
        } else say(S.scroll ? "ランプが灯った。何も起きない。" : "もう一度押す。ランプが消えた。");
        return;
      }
      if (o.id === "tv") {
        if (S.film) { say("再生ボタンを押す。……ディスクは回らない。一度きりだったらしい。"); return; }
        S.film = true;
        say("再生ボタンを押す。テレビが点いた。");
        say("黒い画面を、白い字が、下から上へ流れていく。エンドロールだけだ。");
        say("役の名前が並ぶ。「白い天井」「検温の声」「行き止まりの貼り紙」「壁を向く人たち」「質問しかしない二人」「笑わない山羊」……");
        say("演じた人の欄は、どれも空いている。");
        say("最後に一行。「そして、あなた」。");
        say("画面が暗くなる。本編がどこにあったのかは、分からない。");
        return;
      }
      if (o.id === "switch") { if (S.musicOff) musicOn(); else musicOff(); return; }
      if (o.id === "piano") { VERB_DO.play(o); return; }
      if (o.id === "goat") { say("山羊を押した。びくともしない。紙のほうが好きらしい。"); return; }
      say(`${o.name}を押しても、何も起きない。`);
    },
    play: (o) => {
      if (!need(o, "弾く")) return;
      if (o.id === "piano") {
        say("ドミソを鳴らす。明るい。真ん中のミを半音下げると、暗くなる。二番目の音を一つ動かすだけで、別の曲になる。");
        say("……どの音も、知っている音だ。鳴らない鍵が、二つある。");
        return;
      }
      if (o.id === "violin") {
        if (!held("violin") && !visible().includes(O.violin)) { say("バイオリンが、ここにない。"); return; }
        if (!S.strung) { say("弦が一本もない。弓は、空を切るだけだ。"); return; }
        if (S.f.sound) { say("弓を引く。合っていない音。……あの空には、もう一度は行けない気がする。でも、指はあの音を覚えている。"); return; }
        if (S.loc !== "music") { say("ここで弾く気には、なれない。音楽室で。"); return; }
        say("顎にあて、弓を引く。音程が、まるで合っていない。");
        say("……合っていないはずの音が、どの音にも当てはまらない形で、きれいだった。弾くのを、止められない。");
        say("楽譜に書けない音が、部屋を満たしていく。");
        say("壁が、乳白色にほどけた。");
        gap();
        flicker();
        S.loc = "sky";
        describe(true);
        say("少女が、こちらを見て言う。", "");
        say("「この世界、きれい？」", "voice");
        return;
      }
      say(`${o.name}は、弾けない。`);
    },
    listenTo: (o) => {
      if (o && (o.id === "booth" || o.id === "sphone")) { answerPhone(); return; }
      if (o && o.id === "inko") { if (S.sunday) { say("インコは、黙っている。"); return; } inkoTalk(); return; }
      if (o && o.id === "screen") { say(S.musicOff ? "幕の向こうの寝息。" : "幕に耳を近づける。弓の音に混じって、誰かが小さく言った。「もう、何年……」"); return; }
      if (o && o.id === "fridge") { say("冷蔵庫の中で、何かが、一本の映画を思い出そうとしている音。"); return; }
      VERB_DO.listen();
    },
    fold: (o) => {
      if (!need(o, "折る")) return;

  // ---- 命令を読む ----
  const EN_SIMPLE = [
    ["look", /^(look|l)$/], ["inventory", /^(inventory|i)$/], ["wait", /^(wait|z)$/], ["hint", /^hint$/], ["help", /^help$/],
    ["listen", /^listen$/], ["dunno", /^(dunno|i don'?t know)$/], ["sleep", /^sleep$/], ["run", /^run$/],
    ["sit", /^sit( down)?$/], ["lookback", /^look back$/], ["down", /^(descend|climb down)$/], ["up", /^(ascend|climb up|climb)$/],
  ];
  const DIR_WORDS = { n: "n", north: "n", s: "s", south: "s", e: "e", east: "e", w: "w", west: "w", u: "u", up: "u", d: "d", down: "d" };
  function findObj(s) {
    s = String(s || "").trim().toLowerCase().replace(/^the /, "");
    if (!s) return null;
    const vis = visible();
    for (const o of vis) if (o.aliases.some(a => a.toLowerCase() === s) || o.en === s) return o;
    for (const o of vis) if (o.aliases.some(a => a.length > 1 && s.includes(a.toLowerCase()))) return o;
    return { missing: s };
  }
  function findWord(s) {
    s = String(s || "").trim().toLowerCase();
    return WORDS.find(w => w.en === s || w.ja.toLowerCase() === s || (w.alt || []).some(a => a.toLowerCase() === s)) || null;
  }
  function findWordIn(s) {
    let best = null, len = 0;
    for (const w of WORDS) for (const a of [w.ja, ...(w.alt || [])]) if (a.trim() && a.length > len && s.includes(a.replace(/[、？]/g, ""))) { best = w; len = a.length; }
    return best;
  }
  function parseEn(cmd) {
    cmd = cmd.toLowerCase().replace(/\s+/g, " ").trim();
    for (const [v, rx] of EN_SIMPLE) if (rx.test(cmd)) return { v };
    const g = cmd.replace(/^go /, "");
    if (DIR_WORDS[g]) return { v: "go", dir: DIR_WORDS[g] };
    const sm = cmd.match(/^say (.+)$/);
    if (sm) return { v: "say", w: findWord(sm[1]) };
    const wm = cmd.match(/^write (.+)$/);
    if (wm) return { v: "write", w: findWord(wm[1]) };
    if (cmd === "write") return { v: "write", w: null };
    const pats = [
      ["give", /^(?:give|feed) (.+) to (.+)$/], ["put", /^(?:put|insert|place|string) (.+) (?:in|into|on) (.+)$/], ["put", /^(?:put|insert) (.+)$/],
      ["open", /^open (.+)$/], ["close", /^(?:close|shut) (.+)$/], ["lighton", /^(?:light|turn on|switch on) (.+)$/],
      ["lightoff", /^(?:douse|turn off|switch off) (.+)$/], ["drink", /^drink (.+)$/], ["press", /^(?:press|push|touch) (.+)$/],
      ["play", /^play (.+)$/], ["fold", /^fold (.+)$/], ["wear", /^(?:wear|put on) (.+)$/], ["listenTo", /^listen (?:to )?(.+)$/],
      ["examine", /^(?:examine|x|look at|peek into|peek) (.+)$/], ["read", /^read (.+)$/],
      ["take", /^(?:take|get|pick up|answer) (.+)$/], ["drop", /^drop (.+)$/], ["sit", /^sit (?:on|at) (.+)$/],
    ];
    for (const [v, rx] of pats) { const m = cmd.match(rx); if (m) return { v, a: m[1], b: m[2] }; }
    return null;
  }
  // 先に当たったものを動詞にする。物の名前の部分は伏せてから探すので、名前の中の字は動詞にならない
  const JA_VERBS = [
    ["dunno", /わからな|分からな/],
    ["say", /と言う|って言う|と言って|と答え|を言う|と叫ぶ|と呟く|と口にする|と訊く|と聞く|言う$/],
    ["write", /書く|書いて|書き|書こう|記入/],
    ["lookback", /振り向|振り返|ふりむ|ふりかえ|後ろを見/],
    ["sleep", /寝る|眠る|寝て|眠って|^ねる$/], ["run", /走る|走って|駆け/],
    ["up", /上る|登る|上がる|のぼる/], ["down", /降りる|おりる|下りる|降りて/],
    ["give", /あげる|あげて|与え|食べさせ|渡す|渡して|やる$/], ["fold", /折る|折って|折り|たたむ|畳む/],
    ["play", /弾く|弾いて|演奏|奏で/], ["wear", /身につけ|かける|かけて|着ける/],
    ["lighton", /点ける|つける|点灯|点けて/], ["lightoff", /消す|消して|消灯|切る|切って/],
    ["sit", /座る|すわる|座って|腰を下ろ|腰掛け/],
    ["drink", /飲む|飲んで|飲み/], ["press", /押す|押して|押した|触れる|触る|再生/],
    ["listenTo", /聞く|聴く|聞いて|耳をすま|耳を澄ま|出る/], ["close", /閉める|閉じる|閉めて|しめる/],
    ["open", /開け|開く|入る/], ["put", /入れ|差す|差し|挿す|張る|張って/], ["read", /読/], ["examine", /調べ|見る|眺め|見つめ|覗/],
    ["take", /取|拾|持つ/], ["drop", /置/],
  ];
  const JA_DIRS = { "北": "n", "南": "s", "東": "e", "西": "w", "上": "u", "下": "d" };
  const OBJLESS = ["dunno", "sleep", "run", "lookback", "down", "up"];
  const SIMPLE = { "見る": "look", "周りを見る": "look", "見回す": "look", "持ち物": "inventory", "待つ": "wait", "ヒント": "hint", "遊び方": "help", "ヘルプ": "help",
    "耳をすます": "listen", "耳を澄ます": "listen", "聞く": "listen", "わからない": "dunno", "分からない": "dunno",
    "寝る": "sleep", "眠る": "sleep", "走る": "run", "振り向く": "lookback", "振り返る": "lookback", "座る": "sit", "降りる": "down", "上る": "up", "登る": "up" };
  function parseJa(t) {
    const br = t.match(/[「『]([\s　]*)[」』]/);
    if (br) return { v: "say", w: W("　"), raw: true };
    const s = t.replace(/[\s　。！？!?、「」『』]/g, "");
    if (!s) return null;
    const dm = s.match(/^(北|南|東|西|上|下)(へ|に)?(行く|進む|いく|移動|行って|進んで|出る|降りる|おりる|登る|上がる|上る|る)?(ください)?$/);
    if (dm) return { v: "go", dir: JA_DIRS[dm[1]] };
    if (SIMPLE[s]) return { v: SIMPLE[s] };
    const exact = findWord(s);
    if (exact) return { v: "say", w: exact, raw: true };
    const vis = visible();
    const als = [];
    for (const o of vis) for (const a of o.aliases) if (a) als.push(a);
    als.sort((x, y) => y.length - x.length);
    let masked = s;
    for (const a of als) {
      let i = masked.indexOf(a);
      while (i >= 0) { masked = masked.slice(0, i) + "□".repeat(a.length) + masked.slice(i + a.length); i = masked.indexOf(a, i + a.length); }
    }
    let verb = null, vm = null;
    for (const [v, rx] of JA_VERBS) { const m = masked.match(rx); if (m) { verb = v; vm = m; break; } }
    if (!verb) return null;
    if (OBJLESS.includes(verb)) return { v: verb, raw: true };
    const objPart = s.slice(0, vm.index);
    if (verb === "say" || verb === "write") return { v: verb, w: findWordIn(objPart), raw: true };
    // 名前の頭は、文の頭か助詞のすぐあとにあるものだけを数える（「貼り紙」の「紙」を拾わない）
    const edge = i => i === 0 || /[をのにでとへがは]/.test(objPart[i - 1]);
    const hits = [];
    for (const o of vis) {
      let best = -1, len = 0;
      for (const a of o.aliases) {
        let i = objPart.indexOf(a);
        while (i >= 0 && !edge(i)) i = objPart.indexOf(a, i + 1);
        if (i >= 0 && a.length > len) { best = i; len = a.length; }
      }
      if (best >= 0) hits.push({ o, i: best, end: best + len });
    }
    if (!hits.length && objPart && !["sit", "listenTo", "lighton", "lightoff"].includes(verb)) {
      const m = objPart.match(/^(.+?)(を|に|へ|で|の|と)/);
      return { v: verb, ao: { missing: m ? m[1] : objPart }, bo: null, raw: true };
    }
    const uniq = hits.filter(h => !hits.some(k => k !== h && k.i <= h.i && k.end >= h.end && (k.end - k.i) > (h.end - h.i)));
    uniq.sort((x, y) => x.i - y.i);
    const after = h => objPart.slice(h.end, h.end + 1);
    const a = uniq.find(h => after(h) === "を") || uniq.find(h => after(h) === "の") || uniq[0];
    const b = uniq.find(h => h !== a);
    return { v: verb, ao: a ? a.o : null, bo: b ? b.o : null, raw: true };
  }

  // その場所の空気。説明を読むだけのときは動かない
  const META = ["hint", "help", "inventory", "look", "dunno"];
  function tick(v) {
    if (S.done || META.includes(v)) return;
    if (S.loc === "station" && !S.sunday && v !== "listenTo" && S.hist.length > 3 && Math.random() < 0.3) inkoTalk();
    if (S.loc === "cafe" && !S.musicOff && Math.random() < 0.15) say("スクリーンの裏で、誰かが咳きこんだ。演奏は止まらない。", "note");
    if (S.loc === "passage" && S.ring && v !== "take" && Math.random() < 0.5) say("公衆電話が、鳴りつづけている。", "note");
    if (hot() && Math.random() < 0.15) say("頭の右上で、鉄の球が、ごとりと鳴った。", "note");
  }
  function act(input, label) {
    if (S.done) { say("ここで、終わっている。≡ のメニューから、はじめから。", "note"); return; }
    const ascii = /^[\x20-\x7e]*$/.test(input);
    const p = ascii ? parseEn(input) : parseJa(input);
    if (!p) { say("その言い方はわからない。「命令を作る」を使うと確実だ。"); return; }
    S.moves++;
    if (label && !META.includes(p.v)) { S.hist.push(label); if (S.hist.length > 30) S.hist.shift(); }
    const before = S.loc;
    if (p.v === "go") { go(p.dir); if (S.loc === before) tick("go"); return; }
    if (p.v === "say") { VERB_DO.say(p.w); if (S.loc === before) tick("say"); return; }
    if (p.v === "write") { VERB_DO.write(p.w); if (S.loc === before) tick("write"); return; }
    let a = p.ao, b = p.bo;
    if (!p.raw) { a = p.a ? findObj(p.a) : null; b = p.b ? findObj(p.b) : null; }
    for (const x of [a, b]) if (x && x.missing) { say(`ここに「${x.missing}」は見当たらない。`); return; }
    VERB_DO[p.v](a, b);
    if (S.loc === before) tick(p.v);
  }

  function submit(label, en) {
    label = String(label || "").trim();
    const cmd = en || label;
    if (!cmd) return;
    gap();
    push({ t: "cmd", ja: label || cmd, en: en && en !== label ? en : "" });
    act(cmd, label || cmd);
    setStatus();
    scrollDown();
    writeSaved(snapshot());
  }

  // ---- 入力 ----
  $("prompt").addEventListener("submit", e => {
    e.preventDefault();
    const v = cmdEl.value;
    cmdEl.value = "";
    submit(v);
  });
  $("pad").addEventListener("click", e => {
    const b = e.target.closest("[data-go],[data-cmd]");
    if (!b) return;
    if (b.dataset.go) submit(b.textContent, { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" }[b.dataset.go]);
    else submit(b.textContent, b.dataset.cmd);
  });
  cmdEl.addEventListener("focus", () => { document.body.classList.add("typing"); scrollDown(); });
  cmdEl.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== cmdEl) document.body.classList.remove("typing"); }, 120));

  // ---- 命令を作る ----
  // [ボタンの文字, 英語の型, 日本語の型]。% は1つ目の物、# は2つ目の物。% がなければ物を選ばずにそのまま送る。「言う」「書く」はことばを選ぶ
  const VERBS = [
    ["調べる", "examine %", "%を調べる"], ["読む", "read %", "%を読む"], ["取る", "take %", "%を取る"],
    ["置く", "drop %", "%を置く"], ["入れる", "put % in #", "%を#に入れる"], ["あげる", "give % to #", "%を#にあげる"],
    ["開ける", "open %", "%を開ける"], ["閉める", "close %", "%を閉める"], ["押す", "press %", "%を押す"],
    ["点ける", "light %", "%を点ける"], ["消す", "douse %", "%を消す"], ["飲む", "drink %", "%を飲む"],
    ["弾く", "play %", "%を弾く"], ["折る", "fold %", "%を折る"], ["身につける", "wear %", "%を身につける"],
    ["聞く", "listen to %", "%に耳をすます"], ["言う", "say %", "「%」と言う"], ["書く", "write %", "「%」と書く"],
    ["座る", "sit", "座る"], ["寝る", "sleep", "寝る"], ["走る", "run", "走る"],
    ["振り向く", "look back", "振り向く"],
  ];
  const builder = $("builder");
  const bs = { step: "verb", verb: null, obj1: null };
  const fill = (t, a, b) => t.replace("%", a).replace("#", b);
  function bButton(label, onClick, cls) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "bk" + (cls ? " " + cls : ""); b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }
  function emptyNote(list, msg) {
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = msg;
    list.append(p);
  }
  function renderBuilder() {
    const list = $("b-list");
    list.textContent = ""; list.scrollTop = 0;
    if (bs.step === "verb") {
      $("b-title").textContent = "何をする？"; $("b-preview").textContent = "";
      list.className = "verbs";
      for (const v of VERBS) list.append(bButton(v[0], () => {
        if (!v[1].includes("%")) { closeBuilder(); submit(v[2], v[1]); return; }
        bs.verb = v; bs.step = "obj"; renderBuilder();
      }));
      $("b-back").hidden = true;
      return;
    }
    $("b-back").hidden = false;
    list.className = "";
    const v = bs.verb, second = bs.step === "obj2";
    if (v[1].startsWith("say") || v[1].startsWith("write")) {
      const kind = v[1].startsWith("say") ? "say" : "write";
      $("b-title").textContent = kind === "say" ? "何と言う？" : "何と書く？";
      $("b-preview").textContent = kind === "say" ? "「…」と言う" : "「…」と書く";
      const ws = wordsHere(kind);
      for (const w of ws) {
        const sh = w.show || w.ja;
        list.append(bButton("「" + sh + "」", () => { closeBuilder(); submit(kind === "say" ? `「${sh}」と言う` : `「${sh}」と書く`, `${kind} ${w.en}`); }));
      }
      if (!ws.length) emptyNote(list, kind === "say" ? "口にできることばが、思いつかない。" : "書くことが、思いつかない。");
      return;
    }
    $("b-title").textContent = second ? (v[1].startsWith("give") ? "誰に？" : "どこに？") : "何を？";
    $("b-preview").textContent = second ? fill(v[2], bs.obj1.name, "…") : fill(v[2], "…", "…");
    let items = visible();
    if (second) items = items.filter(o => o !== bs.obj1);
    items.sort((x, y) => (y.loc === "player") - (x.loc === "player"));
    for (const o of items) {
      const isHeld = o.loc === "player";
      list.append(bButton(o.name + (isHeld ? "（持）" : ""), () => {
        if (!second) {
          bs.obj1 = o;
          if (v[1].includes("#")) { bs.step = "obj2"; renderBuilder(); return; }
          closeBuilder();
          submit(fill(v[2], o.name, ""), fill(v[1], o.en, ""));
        } else {
          closeBuilder();
          submit(fill(v[2], bs.obj1.name, o.name), fill(v[1], bs.obj1.en, o.en));
        }
      }, isHeld ? "held" : ""));
    }
    if (!items.length) emptyNote(list, "選べる物がない。");
  }
  function openBuilder() {
    if (S.done) return;
    bs.step = "verb"; bs.verb = null; bs.obj1 = null;
    builder.hidden = false;
    renderBuilder();
  }
  function closeBuilder() { builder.hidden = true; }
  $("build-btn").addEventListener("click", openBuilder);
  $("b-close").addEventListener("click", closeBuilder);
  builder.addEventListener("click", e => { if (e.target === builder) closeBuilder(); });
  $("b-back").addEventListener("click", () => { bs.step = bs.step === "obj2" ? "obj" : "verb"; renderBuilder(); });

  // ---- メニュー ----
  const sheet = $("sheet");
  function openSheet(open) {
    sheet.hidden = !open;
    $("menu-btn").setAttribute("aria-expanded", String(open));
    $("restart-yes").hidden = $("restart-no").hidden = true;
    $("restart-btn").hidden = false;
  }
  $("menu-btn").addEventListener("click", () => openSheet(sheet.hidden));
  $("close-sheet").addEventListener("click", () => openSheet(false));
  sheet.addEventListener("click", e => { if (e.target === sheet) openSheet(false); });
  $("restart-btn").addEventListener("click", () => { $("restart-btn").hidden = true; $("restart-yes").hidden = $("restart-no").hidden = false; });
  $("restart-no").addEventListener("click", () => openSheet(false));
  $("restart-yes").addEventListener("click", () => { openSheet(false); start(true); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeBuilder(); openSheet(false); } });

  // ---- 起動 ----
  function intro() {
    say("空欄", "title");
    gap();
    say(LOOP.n ? "「ここ、どこ？」……前にも、同じことを訊いた気がする。" : "「ここ、どこ？」", "voice");
    say("白い天井。蛍光灯のカバーの中に、羽虫の影がいくつも溜まっている。");
    say("「わたし、だれ？」", "voice");
    say("ベッドの柵に、名札。「613」。名前を書くところは、空いている。");
    gap();
    morning();
    gap();
    describe(true);
  }
  function start(fresh) {
    rows = []; logEl.textContent = "";
    LOOP = loadLoop();
    const saved = fresh ? null : loadSaved();
    if (saved && restore(saved)) {
      for (const r of saved.log || []) push(r, false);
      gap();
      say("（前回の続きから）", "note");
    } else {
      newState();
      intro();
      writeSaved(snapshot());
    }
    setStatus();
    scrollDown();
  }
  start(false);
})();
</script>

</body>
